<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahlillar 2</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#1c1c1e)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:6px;background:#dde1e6;border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:#2b7de9;width:0}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.75;margin-bottom:8px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid #d0d5db;border-radius:10px;background:transparent;color:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.o b{flex:0 0 26px;height:26px;border-radius:50%;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.o.ok{border-color:#1f9d55;background:#e6f6ec;color:#1c1c1e}.o.ok b{background:#1f9d55}
.o.no{border-color:#d64545;background:#fdeaea;color:#1c1c1e}.o.no b{background:#d64545}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2b7de9);color:var(--tg-theme-button-text-color,#fff);font-size:16px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.res{text-align:center}.res .big{font-size:44px;font-weight:700;margin:10px 0}
</style></head><body><div class="w">
<h1>Tahlillar 2</h1>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div></div>
<script>
const Q=[{"n": 11, "q": "112-maktabda yangi o‘quv yilidan o‘quvchilar portfoliosini raqamli platformada yuritish joriy etilmoqda. Direktor pedagogik kengashda o‘zgarishning sababi va maqsadini batafsil tushuntirdi, platformadan foydalanish bo‘yicha ikki kunlik amaliy seminar ham o‘tkazildi. Shunga qaramay, bir oy o‘tib ham o‘qituvchilarning yarmidan ko‘pi platformaga ma’lumot kiritmadi. Direktor o‘rinbosari buni «o‘qituvchilar erinmoqda» deb baholab, haftalik hisobot talab qilishni taklif etdi. Suhbatlarda esa boshqa manzara ochildi: o‘qituvchilar ikki yil oldin boshlangan «elektron kundalik» loyihasi yarim yo‘lda to‘xtab qolganini, o‘shanda kiritilgan ma’lumotlar yo‘qolib ketganini eslatdi. «Bu ham bir-ikki oydan keyin unutiladi», — dedi ko‘pchilik. Platformaning o‘zi esa ular uchun qiyin emasligi ma’lum bo‘ldi.\nModulga ko‘ra, jamoadagi qarshilikning asosiy sababi qaysi?", "o": ["Avvalgi o‘zgarish samarasiz yakunlangani sababli ishonchsizlik", "Yangi talab va texnologiyalar murakkab ko‘ringani sababli paydo bo‘lgan qo‘rquv", "O‘zgarishning sababi va maqsadi xodimlarga yetarli tushuntirilmagani", "Mavjud ish tartibi qulayroq bo‘lgani sababli odatdan voz kecha olmaslik"], "a": 0}, {"n": 12, "q": "45-maktab direktori yangi o‘quv yilining birinchi oyida uchta yangilikni e’lon qildi: elektron jurnalga to‘liq o‘tish, har bir o‘qituvchi uchun haftalik ochiq dars va yangi baholash mezonlari. Har bir yangilik uchun mablag‘ va texnika ajratildi, har biriga mas’ul o‘rinbosar tayinlandi. Oy oxiriga kelib o‘qituvchilar charchaganini aytdi, elektron jurnal yarim to‘ldirildi, ochiq darslar rasmiyatchilikka aylandi. Direktor «hamma sharoit yaratildi-ku» deb hayron.\nModulga ko‘ra, direktor qarshilikni kamaytirishning qaysi usulini buzgan?", "o": ["Jarayon davomida barqaror qo‘llab-quvvatlash va monitoring olib borish", "Qarshilikni tanqid sifatida qabul qilib, ochiq fikr almashish muhitini yaratish", "Moslashgan xodimlarni rag‘batlantirib, kichik yutuqlarni nishonlash", "O‘zgarishni bosqichlarga bo‘lib, har bosqich natijasini tahlil qilish"], "a": 3}, {"n": 13, "q": "Maktabda 4-sinflarda o‘quvchi savodxonligi pastligi aniqlandi. Direktor uch yil ichida natija ko‘rsatadigan aniq maqsad qo‘ymoqchi.\nQaysi variant strategik maqsad talablariga javob BERMAYDI?", "o": ["2026–2028-yillarda 4-sinf o‘quvchilarining o‘qish savodxonligini diagnostika asosida kamida 15 foizga oshiramiz", "2026–2028-yillarda 4-sinf o‘quvchilarida savodxonlikni zamonaviy metodlar yordamida kamida 15 foizga yuksaltiramiz", "2026–2028-yillarda 4-sinf o‘quvchi savodxonligiga samaradorlikning natijasini kamida 15 foizga oshiramiz", "2026–2028-yillarda 4-sinf o‘quvchilarining savodxonlik darajasini malakali o‘qituvchilar orqali kamida 15 foizga oshiramiz"], "a": 2}, {"n": 14, "q": "78-maktabda «O‘qish soati» loyihasi boshlandi: maqsad — 5-sinflarda o‘qish tezligi va matnni tushunishni oshirish. Loyiha maktab strategiyasiga kiritildi, mas’ul metodist, muddat va kutubxona resurslari belgilandi. Uch oy davomida 5-sinflarda har kuni 20 daqiqalik o‘qish soati o‘tkazildi. O‘qituvchilar va ota-onalar loyihani maqtadi, sinf rahbarlari «bolalar kitobga qiziqib qoldi» deb hisobot yozdi. Shundan so‘ng direktor loyihani yangi chorakdan 1–11-sinflarning barchasiga majburiy kiritish haqida buyruq loyihasini tayyorladi. Metodist esa loyiha boshida o‘tkazilgan o‘qish tezligi sinovi bilan hozirgi holat hali solishtirilmaganini eslatdi.\nModulga ko‘ra, direktor buyruqni imzolashdan oldin nima qilishi kerak?", "o": ["Loyihaning maktab vizyoni va strategik maqsadlariga mosligini qayta tekshirish", "Belgilangan KPIlar bo‘yicha natijani tahlil qilib, loyiha samarasini baholash", "Barcha sinflar uchun mas’ul, muddat va resurslarni oldindan taqsimlab chiqish", "Ota-onalar va o‘qituvchilarning ijobiy fikrini so‘rovnoma bilan rasmiylashtirish"], "a": 1}, {"n": 15, "q": "Ishchi guruh strategiya loyihasidagi missiya bandiga shunday yozdi: «2030-yilgacha bitiruvchilarning oliy ta’limga kirish ko‘rsatkichini 60 foizga yetkazamiz». Pedagogik kengashda metodist bu jumla missiya emasligini aytdi va uni boshqa bandga ko‘chirishni taklif qildi.\nModulga ko‘ra, jumla qaysi bandga ko‘chirilishi kerak va nega?", "o": ["Vizyonga — unda maktabning kelajakdagi holati tasvirlangan", "Strategik maqsadga — natijasi aniq va o‘lchab bo‘ladi", "Qadriyatlarga — u jamoaning ustuvor intilishini ifodalaydi", "Yillik rejaga — unda bajariladigan vazifa va muddat bor"], "a": 1}, {"n": 16, "q": "Strategik rejalashtirishda ishchi guruh hujjat tayyorlamoqda: missiya, vizyon, strategik maqsad va qadriyatlar alohida ko‘rsatilishi kerak.\nQaysi variant aynan missiyaga eng mos?", "o": ["Har bir o‘quvchiga sifatli ta’lim berib, yaqin yillarda mintaqaning eng nufuzli ta’lim maskaniga aylanamiz", "Halollik va ijodkorlik qadriyatlari asosida har bir o‘quvchini bilimli, raqobatbardosh shaxs sifatida tarbiyalashga xizmat qilamiz", "Har bir o‘quvchining intellektual va ma’naviy rivojlanishini ta’minlab, uni jamiyatga munosib shaxs sifatida tayyorlashni maqsad qilamiz", "Har bir o‘quvchining qobiliyatini rivojlantirib, uni bilimli va mas’uliyatli shaxs sifatida tarbiyalashga xizmat qilamiz"], "a": 3}, {"n": 17, "q": "Rahbarlarning xatti-harakatini temperament turi bilan moslashtiring.\n1) Yangi buyruqni bir necha bor qayta o‘qiydi, har bir xavfni yozib chiqadi va o‘z xatosini qayta-qayta tahlil qiladi\n2) Ota-ona baqirib kirganda ham ovozini ko‘tarmaydi, gapini oxirigacha eshitadi va shoshilmay xulosa chiqaradi\n3) Yangi jamoaga kelgan birinchi haftadayoq hamma bilan til topishib, yig‘ilishlarni ko‘tarinki kayfiyatda o‘tkazadi\nA) Flegmatik\nB) Sangvinik\nC) Melanxolik\nD) Xolerik", "o": ["1–C, 2–A, 3–B", "1–C, 2–A, 3–D", "1–A, 2–C, 3–B", "1–D, 2–A, 3–B"], "a": 0}, {"n": 18, "q": "Pedagogik kengashda tajribali o‘qituvchi direktorning yangi tartibini hammaning oldida keskin tanqid qildi. Direktor ovozini ko‘tarmadi, «fikringiz uchun rahmat, buni alohida muhokama qilamiz» dedi va kengashni davom ettirdi. Ertasi kuni o‘qituvchini chaqirib, avval nimadan xavotirda ekanini so‘radi: yangi tartib uning qo‘shimcha darslariga to‘g‘ri kelgan ekan. Direktor jadvalni u bilan birga qayta ko‘rib chiqdi.\nDirektorning xatti-harakati, eng avvalo, qaysi kompetensiyani ko‘rsatadi?", "o": ["Rahbarning ichki pozitsiyasi", "Emotsional intellekt", "Professional intizom", "O‘zini boshqarish"], "a": 1}, {"n": 19, "q": "Rahbar duch kelgan muammoni temperament turi bilan moslashtiring.\n1) «Hammasi joyida bo‘ladi, bizda muammo yo‘q» deb, akkreditatsiyaga tayyorgarlikni oxirgi haftaga qoldirdi\n2) Yig‘ilishda o‘qituvchining e’tirozini eshitib, darhol ovozini ko‘tardi, keyin aytganidan afsuslandi\n3) Bitta ota-onaning shikoyatidan keyin bir hafta xavotirda yurdi va qaror qabul qilolmay qoldi\nA) Xolerik\nB) Sangvinik\nC) Flegmatik\nD) Melanxolik", "o": ["1–C, 2–A, 3–D", "1–B, 2–D, 3–A", "1–B, 2–A, 3–C", "1–B, 2–A, 3–D"], "a": 3}, {"n": 20, "q": "Rahbar mas’uliyatining quyidagi jihatlari qanday ketma-ketlikda amalga oshiriladi?\n1) Xavf-xatarlarni tahlil qilish\n2) Xodimlarni o‘qitish\n3) Shaffoflik va monitoringni yo‘lga qo‘yish\n4) Tizimli chora-tadbirlar ishlab chiqish\n5) Qoidabuzarliklarga nisbatan chora belgilash", "o": ["1 → 2 → 4 → 3 → 5", "1 → 4 → 3 → 2 → 5", "1 → 4 → 2 → 3 → 5", "4 → 1 → 2 → 5 → 3"], "a": 2}];const L="ABCD";let i=0,score=0,done=false;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const app=document.getElementById('app'),bar=document.getElementById('bar');
function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;
app.querySelectorAll('.o').forEach(b=>{b.querySelector('span').textContent=q.o[+b.dataset.k];b.onclick=()=>pick(b)});
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():result()};window.scrollTo(0,0)}
function pick(b){if(done)return;done=true;const k=+b.dataset.k,a=Q[i].a;
app.querySelectorAll('.o')[a].classList.add('ok');if(k===a)score++;else b.classList.add('no');
try{Telegram.WebApp.HapticFeedback.notificationOccurred(k===a?'success':'error')}catch(e){}
document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
</script></body></html>
