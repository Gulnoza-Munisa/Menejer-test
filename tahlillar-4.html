<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahlillar 4</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#1c1c1e)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:6px;background:#dde1e6;border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:#2b7de9;width:0}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.75;margin-bottom:8px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid #d0d5db;border-radius:10px;background:transparent;color:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.o b{flex:0 0 26px;height:26px;border-radius:50%;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.o.ok{border-color:#1f9d55;background:#e6f6ec;color:#1c1c1e}.o.ok b{background:#1f9d55}
.o.no{border-color:#d64545;background:#fdeaea;color:#1c1c1e}.o.no b{background:#d64545}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2b7de9);color:var(--tg-theme-button-text-color,#fff);font-size:16px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.res{text-align:center}.res .big{font-size:44px;font-weight:700;margin:10px 0}
</style></head><body><div class="w">
<h1>Tahlillar 4</h1>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div></div>
<script>
const Q=[{"n": 31, "q": "O‘qituvchi o‘quvchilarni kichik guruhlarga bo‘lib, muammo bo‘yicha loyiha ishlab chiqishni topshirdi. O‘quvchilar tadqiqot qilib, yechimlarni taqdim etdi va fikr almashdi. Hamkorlik va mustaqil izlanish asosiy o‘rinda bo‘ldi.\nBu vaziyat qaysi yondashuvni ifodalaydi?", "o": ["Kompetensiyaviy ta’lim metodlari", "Muammoli o‘qitish metodlari", "Faol va interfaol metodlar", "Tadqiqotga asoslangan metodlar"], "a": 2}, {"n": 32, "q": "Ona tili darsida «Rasmiy uslub» mavzusi o‘tildi. Darsning ikkinchi yarmida har bir o‘quvchi mahalla raisiga ko‘chaga yoritish chiroqlari o‘rnatishni so‘rab ariza yozdi. O‘qituvchi har bir arizani haqiqiy hujjatga qo‘yiladigan talablar asosida tekshirib, har bir o‘quvchiga alohida izoh berdi. Eng yaxshi ariza maktab nomidan mahallaga yuborildi.\nDirektor dars tahlilida bu darsni, eng avvalo, qaysi yondashuv namunasi sifatida baholashi kerak?", "o": ["Faol va interfaol metodlar", "Kompetensiyaga yo‘naltirilganlik", "Mavzular integratsiyasi", "Individual o‘quv trayektoriyasi"], "a": 1}, {"n": 33, "q": "Direktorning harakatlarini ta’lim sifatini boshqarish tamoyillari bilan moslashtiring.\n1) Ona tili natijasi pastligi sababini o‘qituvchidan emas, dars rejasi, baholash va o‘quv resurslari zanjiridan izladi\n2) Metodbirlashma taklif qilgan qo‘shimcha darslarni diagnostik test va monitoring raqamlari chiqmaguncha tasdiqlamadi\n3) Har chorak yakunida kengashda kamchiliklar ko‘rib chiqilib, har biriga mas’ul va muddat belgilanmoqda\nA) Dalilga asoslangan boshqaruv\nB) Jarayon yondashuvi\nC) Doimiy takomillashtirish\nD) Natijaga yo‘naltirilganlik", "o": ["1–B, 2–A, 3–C", "1–D, 2–A, 3–C", "1–B, 2–C, 3–A", "1–B, 2–A, 3–D"], "a": 0}, {"n": 34, "q": "Direktor e-maktab tizimidan foydalanish bo‘yicha yig‘ilish o‘tkazdi. Aniqlandi: tizimdan foydalanish sifati past, statistik hisobotlar noto‘g‘ri yuritilmoqda, ota-onalar tizimga kam kiradi. Davomat va baholar elektron jurnalga kech kiritilmoqda, ota-onalar o‘zlashtirish va uy vazifalaridan xabarsiz, fanlar bo‘yicha o‘zlashtirish muntazam tahlil qilinmayapti.\nRahbar e-maktabdagi qaysi hisobotlardan foydalanishi va qanday metodik ish qilishi eng muhim?", "o": ["Davomat va baholar holati hisobotlarini tahlil qilish, sinflar kesimida faollikni kuzatish, ota-onalarning tizimdan foydalanish darajasini o‘rganish", "Elektron jurnal va kundalik yuritilishi hisobotlarini tahlil qilish, uy vazifalari berilishini kuzatish, sinf rahbarlari bilan metodik suhbatlar o‘tkazish", "Fanlar kesimidagi baholar va davomatni umumlashtirish, o‘zlashtirishdagi pasayishlarni aniqlash, ma’lumot kiritilishini tartibga solish", "O‘zlashtirish darajasi va baholar statistikasini tahlil qilish, fanlar kesimida o‘rtacha natijalarni shakllantirish, jurnal yuritilishini kuzatish"], "a": 1}, {"n": 35, "q": "Rahbariyat tashqi baholashga faqat tekshiruv deb qaradi: risk nuqtalari aniqlanmadi, dalillar jamlanmadi, kamchiliklar bo‘yicha reja tuzilmadi.\nTashqi baholashni ichki sifat tizimini mustahkamlovchi mexanizmga aylantirish uchun harakatlar ketma-ketligini aniqlang.\n1) Choralar natijasini indikatorlar orqali qayta o‘rganish\n2) DTS/DTT talablari asosida risk nuqtalarini aniqlash\n3) Muammolar bo‘yicha kamchiliklar reyestrini shakllantirish\n4) Ta’lim sifati bo‘yicha dalillarni tizimli jamlash", "o": ["4 → 2 → 3 → 1", "2 → 4 → 3 → 1", "2 → 3 → 4 → 1", "3 → 2 → 4 → 1"], "a": 1}, {"n": 36, "q": "Direktor matematika darsini kuzatmoqda: «Foizlar» mavzusi do‘kondagi chegirmalar, bank omonatlari va kredit foizlari orqali yechtirilmoqda.\nBu holatda qaysi yondashuv amalga oshirilgan?", "o": ["Kompetensiyaga yo‘naltirilganlik", "Mavzular integratsiyasi", "Differensial yondashuv", "Formativ baholash"], "a": 1}, {"n": 37, "q": "Kasb tushunchasining asosiy tamoyillari qaysi javobda to‘liq va to‘g‘ri berilgan?", "o": ["Kasb tarixiylikni, qonuniylikni, foyda keltirishni, ixtiyoriylikni talab etadi va faoliyat turi boshqasidan farqlanishi zarur", "Kasb tayyorgarlikni, qonuniylikni, jamiyatga foyda keltirishni, qiziqishni talab etadi va mehnat faoliyati bilan bog‘liq bo‘lishi zarur", "Kasb ixtiyoriylikni, mehnat ko‘nikmalarini, kasbiy mas’uliyatni, foyda keltirishni talab etadi va qobiliyatga mos tanlanishi zarur", "Kasb qonuniylikni, amaliy tajribani, shaxsiy qiziqishni, mehnat bozoriga moslikni talab etadi va jamiyat ehtiyojiga xizmat qilishi zarur"], "a": 0}, {"n": 38, "q": "Ta’lim sifati pastligidan kelib chiqadigan holatlarni ularning oqibatlari bilan moslashtiring.\n1) Mehnat bozorida raqobatbardosh kadrlar yetishmasligi\n2) Innovatsion rivojlanishning sekinlashuvi\n3) Davlat iqtisodiy barqarorligiga tahdid\nA) Korxonalar unumdorligi tushib, aholi daromadi kamayadi va davlat tushumlari qisqaradi\nB) Yangi texnologiya va ilmiy ishlanmalarni yarata oladigan mutaxassislar tanqisligi yuzaga keladi\nC) Bitiruvchilar kasb tanlashda qiynalib, oliy ta’limga kirish ko‘rsatkichi pasayadi\nD) Ish beruvchilar talab qilgan ko‘nikmaga ega bitiruvchilar topilmay, bo‘sh ish o‘rinlari to‘lmay qoladi", "o": ["1–C, 2–B, 3–A", "1–D, 2–C, 3–A", "1–B, 2–D, 3–A", "1–D, 2–B, 3–A"], "a": 3}, {"n": 39, "q": "Kasbga yo‘naltirish faoliyatlarini 2026/2027 o‘quv yilidan joriy etiladigan bosqichlar bilan moslashtiring.\n1) Bolalar «shifokor», «oshpaz» rolli o‘yinlarida turli kasblar haqida ilk tasavvur hosil qilmoqda\n2) Maktab maslahatchisi o‘quvchining qiziqish va qobiliyatini aniqlab, akademik ta’lim yoki kasb-hunar yo‘lini tavsiya qildi\n3) O‘quvchilar ishlab chiqarish korxonasiga borib, turli mehnat sohalariga bo‘lgan qiziqishini rivojlantirdi\nA) «Atrofimizdagi kasblar»\nB) «Kasblar olami»\nC) «Kasblar alifbosi»\nD) «Mening kelajakdagi kasbim»", "o": ["1–C, 2–D, 3–B", "1–A, 2–D, 3–B", "1–A, 2–B, 3–D", "1–A, 2–D, 3–C"], "a": 1}, {"n": 40, "q": "Yangi baholash tizimida formativ baholash qanday maqsadda qo‘llaniladi?", "o": ["O‘quvchi xatosini kuzatib, unga keyingi topshiriqlar bo‘yicha yo‘nalish berish", "O‘quvchi qiyinchiligini aniqlab, o‘quv jarayonida qo‘llab-quvvatlash", "O‘quvchi xatosini aniqlab, uni tuzatishga yo‘naltirish", "O‘quvchi faoliyatini tahlil qilib, rivojlanishiga yordam berish"], "a": 2}];const L="ABCD";let i=0,score=0,done=false;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const app=document.getElementById('app'),bar=document.getElementById('bar');
function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;
app.querySelectorAll('.o').forEach(b=>{b.querySelector('span').textContent=q.o[+b.dataset.k];b.onclick=()=>pick(b)});
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():result()};window.scrollTo(0,0)}
function pick(b){if(done)return;done=true;const k=+b.dataset.k,a=Q[i].a;
app.querySelectorAll('.o')[a].classList.add('ok');if(k===a)score++;else b.classList.add('no');
try{Telegram.WebApp.HapticFeedback.notificationOccurred(k===a?'success':'error')}catch(e){}
document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
</script></body></html>
