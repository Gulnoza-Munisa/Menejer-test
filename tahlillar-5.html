<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahlillar 5</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#1c1c1e)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:6px;background:#dde1e6;border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:#2b7de9;width:0}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.75;margin-bottom:8px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid #d0d5db;border-radius:10px;background:transparent;color:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.o b{flex:0 0 26px;height:26px;border-radius:50%;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.o.ok{border-color:#1f9d55;background:#e6f6ec;color:#1c1c1e}.o.ok b{background:#1f9d55}
.o.no{border-color:#d64545;background:#fdeaea;color:#1c1c1e}.o.no b{background:#d64545}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2b7de9);color:var(--tg-theme-button-text-color,#fff);font-size:16px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.res{text-align:center}.res .big{font-size:44px;font-weight:700;margin:10px 0}
</style></head><body><div class="w">
<h1>Tahlillar 5</h1>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div></div>
<script>
const Q=[{"n": 41, "q": "Tuman topshirig‘i bilan direktor dam olish kunlari pedagoglarni ko‘chalarni obodonlashtirishga jalb qildi va kelmaganlarning mukofot pulidan ushlab qolinishini e’lon qildi. Pedagoglardan biri bu haqda rasmiy murojaat yubordi, o‘rganish davomida holat tasdiqlandi.\n«Pedagogning maqomi to‘g‘risida»gi Qonundagi taqiqlarni buzgan direktor qanday javobgarlikka tortilishi mumkin?", "o": ["Ma’muriy javobgarlik to‘g‘risidagi kodeks asosida ma’muriy javobgarlikka", "Mehnat kodeksi asosida intizomiy jazo — hayfsan yoki lavozimdan ozod etishga", "Fuqarolik kodeksi asosida yetkazilgan zararni qoplash — moddiy javobgarlikka", "Jinoyat kodeksi asosida mansab vakolatini suiiste’mol qilganlik uchun jinoiy javobgarlikka"], "a": 0}, {"n": 42, "q": "Direktor o‘rinbosari 7-A sinf uchun chorak oxiridagi summativ baholash jadvalini tuzdi. Seshanba kuni: matematika — CHSB, ona tili — CHSB, ingliz tili — BSB, tarix — BSB. Har biri bir soatdan. Direktor jadvalni imzolamay qaytardi.\nDirektor jadvalni qaysi sababga ko‘ra qaytargan?", "o": ["BSB va CHSB bir kunning o‘zida birga o‘tkazilishi mumkin emas", "CHSB faqat chorakning oxirgi haftasida o‘tkazilishi kerak", "Bitta sinfda bir kunda 3 tadan ortiq summativ baholash o‘tkazilmaydi", "Bir kundagi summativ baholashlar umumiy vaqti 3 soatdan oshmasligi kerak"], "a": 2}, {"n": 43, "q": "Maktabda o‘quvchiga nisbatan zo‘ravonlik yoki kiberbulling holati haqida xabar kelib tushdi. Rahbar holatni cho‘zmasdan, bolaning xavfsizligini ta’minlash va vaziyatni qonuniy-tizimli tartibda hal qilishi kerak.\nHarakatlarni to‘g‘ri ketma-ketlikda joylashtiring.\n1) Dalillarni hujjatlashtirish: guvohlar, yozishmalar, skrinlar; maxfiylikni ta’minlash\n2) Xabarni qabul qilish: vaqt, joy, ishtirokchilarni yozma qayd etish\n3) Psixologik yordam, ota-ona bilan muloqot, kerak bo‘lsa tashkilotlarni jalb qilish\n4) Bolani xavfsiz joyga olish, kattalar nazoratini kuchaytirish\n5) Keyingi holatni monitoring qilish, sinfda profilaktikani kuchaytirish\n6) Og‘irlik darajasini aniqlash: takroriylik, tahdid, jarohat, shantaj, onlayn tarqatish", "o": ["2 → 4 → 6 → 1 → 3 → 5", "2 → 6 → 4 → 1 → 3 → 5", "4 → 2 → 6 → 1 → 5 → 3", "2 → 4 → 1 → 6 → 3 → 5"], "a": 0}, {"n": 44, "q": "Maktab direktori ish rejasini strategik, taktik va operatsion darajaga bo‘ldi. Ushbu yondashuv nimani ifodalaydi?", "o": ["Vaqt va resurslarni boshqarish hamda rejalashtirish iyerarxiyasini tizimli tashkil etish", "Uzoq muddatli maqsadlarni oylik va kunlik vazifalar bilan izchil bog‘lash", "Maktab faoliyatini maqsad, vazifa va ijro darajalarida tartibli rejalashtirish", "Rahbar ish jarayonida ustuvor yo‘nalishlarni bosqichma-bosqich amalga oshirish"], "a": 0}, {"n": 45, "q": "Direktor modul tavsiyasiga amal qilib, ish kunining dastlabki 90 daqiqasini qabul va majlislarsiz «chuqur ishlash» vaqti qilib belgiladi. Endi u bu vaqtga qaysi vazifalarni qo‘yishni tanlamoqda.\nModulga ko‘ra bu vaqt qaysi turdagi vazifalar uchun ajratiladi?", "o": ["Muhim va shoshilinch vazifalar — kun davomida kechiktirib bo‘lmaydigan ishlar", "Muhim va shoshilinch bo‘lmagan strategik vazifalar", "Shoshilinch, lekin muhim bo‘lmagan joriy topshiriqlar", "Bir turdagi mayda ishlar — xatlarga javob va hujjat imzolash"], "a": 1}, {"n": 46, "q": "Kasbiy rivojlanish kuni tadbirlarini tashkil qilishda qanday ta’lim shakllaridan foydalaniladi?", "o": ["Masofaviy ta’lim, amaliy treninglar, metodik seminarlar va mustaqil tayyorgarlik", "Dual ta’lim, mentorlik kuzatuvlari, tajriba almashish va metodik mashg‘ulotlar", "Ishlab chiqarishdan ajralmagan holda ta’lim olish, kasbiy treninglar va masofaviy mashg‘ulotlar", "Masofaviy ta’lim, ishlab chiqarishdan ajratilgan holda ta’lim olish, dual ta’lim va mustaqil ta’lim"], "a": 3}, {"n": 47, "q": "Zamonaviy ta’lim tizimida CPD — kasbiy rivojlanishning o‘rni qaysi javobda to‘g‘ri ifodalangan?", "o": ["O‘qituvchilarning kasbiy ehtiyojlariga mos metodik yordamni tashkil etish va dars jarayonini takomillashtirishga xizmat qiladi", "O‘qituvchilarning individual ehtiyojlariga mos metodlarni o‘rganish va innovatsion yondashuvlarni joriy qilish imkonini beradi", "O‘qituvchilarning darsdagi metodik muammolarini tahlil qilish va amaliy qo‘llab-quvvatlashni kuchaytirishga xizmat qiladi", "O‘qituvchilarning tajriba almashishi, refleksiya qilishi va kasbiy faoliyatini tizimli rivojlantirishiga yordam beradi"], "a": 1}, {"n": 48, "q": "Quyidagilardan qaysi biri strategik HR boshqaruvi yo‘nalishiga KIRMAYDI?", "o": ["Kadrlar tarkibini strategik rejalashtirish", "O‘qituvchilarni maktabda saqlab qolish (retensiya)", "Yetakchilik salohiyatini shakllantirish", "Ish vaqti va davomatni qayd etish tizimini yuritish"], "a": 3}, {"n": 50, "q": "Maktabda inson resurslarini boshqarishning strategik sikli bosqichlarini to‘g‘ri ketma-ketlikda joylashtiring.\n1) Kasbiy rivojlanish\n2) Kadrlar tarkibini rejalashtirish\n3) Moslashuv va kasbiy moslashtirish (induksiya)\n4) Xodimlarni ishga qabul qilish va tanlash\n5) Faoliyatni boshqarish va baholash", "o": ["2 → 3 → 4 → 1 → 5", "4 → 2 → 3 → 1 → 5", "2 → 4 → 3 → 1 → 5", "2 → 4 → 1 → 3 → 5"], "a": 2}, {"n": 51, "q": "Fizika o‘qituvchisi o‘rni ikki oydan beri bo‘sh. Direktor yagona nomzodni chaqirdi: uning namunaviy darsini mentor bilan birga kuzatdi, suhbatda jamoada ishlash qarashlarini ham o‘rgandi. Natijalar o‘rtacha chiqdi, lekin direktor «boshqa odam yo‘q» deb uni ishga oldi.\nModulga ko‘ra direktor ishga qabulda qaysi keng tarqalgan xatoga yo‘l qo‘ydi?", "o": ["Pedagogik amaliyotni kuzatmasdan faqat diplomga tayandi", "Maktab madaniyati va jamoaviy ishlashga moslikni e’tiborsiz qoldirdi", "Tajribali mentorni baholash jarayoniga jalb qilmadi", "Nomzodni mosligi emas, balki mavjudligi asosida ishga oldi"], "a": 3}];const L="ABCD";let i=0,score=0,done=false;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const app=document.getElementById('app'),bar=document.getElementById('bar');
function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;
app.querySelectorAll('.o').forEach(b=>{b.querySelector('span').textContent=q.o[+b.dataset.k];b.onclick=()=>pick(b)});
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():result()};window.scrollTo(0,0)}
function pick(b){if(done)return;done=true;const k=+b.dataset.k,a=Q[i].a;
app.querySelectorAll('.o')[a].classList.add('ok');if(k===a)score++;else b.classList.add('no');
try{Telegram.WebApp.HapticFeedback.notificationOccurred(k===a?'success':'error')}catch(e){}
document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
</script></body></html>
