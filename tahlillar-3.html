<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahlillar 3</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#1c1c1e)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:6px;background:#dde1e6;border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:#2b7de9;width:0}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.75;margin-bottom:8px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid #d0d5db;border-radius:10px;background:transparent;color:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.o b{flex:0 0 26px;height:26px;border-radius:50%;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.o.ok{border-color:#1f9d55;background:#e6f6ec;color:#1c1c1e}.o.ok b{background:#1f9d55}
.o.no{border-color:#d64545;background:#fdeaea;color:#1c1c1e}.o.no b{background:#d64545}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2b7de9);color:var(--tg-theme-button-text-color,#fff);font-size:16px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.res{text-align:center}.res .big{font-size:44px;font-weight:700;margin:10px 0}
</style></head><body><div class="w">
<h1>Tahlillar 3</h1>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div></div>
<script>
const Q=[{"n": 21, "q": "Dars tugashi bilan bir ota-ona direktor xonasiga baqirib kirdi: «O‘qituvchingiz bolamni butun sinf oldida haqorat qildi, hozir ota-onalar guruhiga yozaman!» Xonada o‘rinbosar va yana ikki ota-ona bor edi. O‘qituvchi bu paytda darsda.\nBoshqaruv psixologiyasiga ko‘ra, direktorning birinchi qadami qanday bo‘lishi kerak?", "o": ["Ota-onani tinchlantirib, o‘qituvchiga bugunoq tushuntirish xati yozdirishni va’da qilish", "Ota-onaga shikoyatni yozma ariza qilib berishni aytib, ko‘rib chiqish muddatini belgilash", "O‘qituvchi tajribali ekanini aytib, ota-onadan shoshilmaslikni va guruhga yozmaslikni so‘rash", "Shoshilmay, ohangni pasaytirib, nima bo‘lgani, qachon va kim ko‘rganini aniqlashtirish"], "a": 3}, {"n": 22, "q": "Vaziyatlarni boshqaruv psixologiyasi qonuniyatlari bilan moslashtiring.\n1) Direktor jamoadagi eng xushmuomala, hammaga yoqadigan o‘qituvchini fan oyligiga mas’ul qildi, lekin tadbir sust o‘tdi\n2) Direktor uch o‘qituvchiga bir xil topshiriqni shaxsan va yozma berdi, uchalasi uni uch xil mazmunda bajardi\n3) O‘qituvchi o‘zini maktabdagi eng kuchli mutaxassis deb hisoblaydi, ammo o‘quvchilari natijasi o‘rtachadan past\nA) O‘z-o‘zini baholashning noadekvatligi\nB) Inson inson tomonidan yetarli aks ettirilmasligi\nC) Natijaning noaniqligi\nD) Boshqaruv ma’lumotlari mazmunining yo‘qolib borishi", "o": ["1–C, 2–B, 3–A", "1–B, 2–D, 3–A", "1–B, 2–C, 3–A", "1–A, 2–C, 3–B"], "a": 2}, {"n": 23, "q": "Boshqaruv psixologiyasi qonuniyatlarini ularning amaliy mazmuni bilan moslashtiring.\n1) Kompensatsiya qonuni\n2) Natijaning noaniqligi qonuni\n3) O‘z-o‘zini baholashning noadekvatligi\nA) Xodim o‘ziga yuqori baho beradi, lekin bu baho o‘zini oqlamaydi — «aysberg» ko‘rinishi\nB) Har kim mukammal emas: bilim fazilat bilan to‘ldiriladi, kamchilik tajriba hisobiga yopiladi\nC) Har bir xodim individual va takrorlanmas, topshiriqni har xil mazmunda bajaradi\nD) Buyruq ijrosida xodimlarda teskari norozilik — «bumerang» effekti paydo bo‘ladi", "o": ["1–B, 2–A, 3–C", "1–B, 2–C, 3–A", "1–C, 2–A, 3–B", "1–B, 2–D, 3–C"], "a": 1}, {"n": 24, "q": "Boshqaruv qarorini qabul qilish bosqichlarini to‘g‘ri tartibda joylashtiring.\n1) Pedagogik kengashda tanlangan yechimni muhokama qilib, kelishib olish\n2) Samaradorlik, resurs, vaqt va xavf bo‘yicha baholash ko‘rsatkichlarini belgilash\n3) Chorak natijalari va ichki-tashqi omillarni o‘rganib, asosiy muammoni belgilash\n4) Belgilangan ko‘rsatkichlar asosida eng maqbul yechimni tanlash\n5) Muammoni hal etishning bir nechta mumkin bo‘lgan yechimini ishlab chiqish", "o": ["3 → 5 → 2 → 4 → 1", "3 → 2 → 5 → 1 → 4", "2 → 3 → 5 → 4 → 1", "3 → 2 → 5 → 4 → 1"], "a": 3}, {"n": 25, "q": "Maktabda o‘quvchilarning chorak yakunidagi ko‘rsatkichlari kutilgan natijaga erishmadi. Rahbar ichki monitoring natijalari, pedagoglar fikri va o‘quvchilar ehtiyojlarini o‘rgandi. Bir nechta muqobil yechim ishlab chiqilib, pedagogik kengashda muhokama qilindi. Qaror ijrosi uchun muddatlar, mas’ul ijrochilar, nazorat va baholash mexanizmlari belgilandi.\nBu qarorning eng aniq ilmiy boshqaruv tavsifi qaysi?", "o": ["Pedagogik maqsadga yo‘naltirilgan, monitoring va pedagoglar fikriga asoslangan, ijrochilari belgilangan, nazorat hisobotlar orqali tashkil etilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, jamoaviy muhokamaga tayangan va qaror qabul qilishning asosiy bosqichlari amalga oshirilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, tahlilga asoslangan, muqobil yechimlar ko‘rilgan, ijrochi va muddatlar buyruq bilan rasmiylashtirilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, jamoaviy muhokamada ishlangan, ijrochilar belgilangan, nazorat muntazam yig‘ilishlar orqali tashkil etilgan qaror"], "a": 1}, {"n": 26, "q": "Yuqori sinflarda dars qoldirish, baho pasayishi, tadbirlarda ishtirok kamayishi kuzatilmoqda. Direktor sinf rahbarlari orqali ota-onalarni ogohlantiradi, biroq ko‘pchilik befarq, ba’zilari chatlarda norozi. O‘qituvchilar o‘zini himoyasiz his qilmoqda. Veb-saytda hisobotlar chiqmoqda, lekin ota-onalar bilan samarali muloqot yo‘q. Direktor tizimli yondashmoqchi.\nOta-onalar bilan hamkorlikni tiklash va o‘quvchilar faolligini oshirishning eng maqbul yechimi qaysi?", "o": ["Ochiq eshiklar va ochiq muloqot kunlari, seminar va treninglar orqali ota-onalar qiziqishini oshirish, media va ijtimoiy hamkorlikni faollashtirish", "Muntazam ochiq muloqot kunlari va seminarlar o‘tkazib, yutuq va muammolarni birga muhokama qilish, hamkorlikni kuzatuv kengashi orqali rasmiylashtirish", "Sinf rahbarlari va o‘qituvchilar bilan birga ota-onalar uchun ochiq tadbirlar, media faolligi va jamoaviy loyihalar orqali hamkorlikni yo‘lga qo‘yish", "Ota-onalar qo‘mitasi va kuzatuv kengashi orqali muloqot o‘rnatib, faoliyatni media orqali yoritish va seminarlar orqali jalb etish"], "a": 0}, {"n": 27, "q": "Tabiiy fanlardan o‘zlashtirish pasaydi. Rahbar tezkor yig‘ilish o‘tkazib, darsni kuchaytirish va ichki nazoratni qat’iylashtirish bo‘yicha qaror qildi, qo‘shimcha hisobotlar va vazifalar joriy etildi. Laboratoriya jihozlari yetishmasligi, materiallarning eskirgani va yuklama ortgani chuqur o‘rganilmadi. Masala pedagogik kengashda muhokama qilinmadi. Bir necha oydan keyin ham natija o‘zgarmadi.\nBoshqaruv jarayonining qaysi bo‘g‘inida jiddiy kamchilik bor?", "o": ["Monitoring natijalari yuzaki tahlil qilingan, pedagoglar fikri olinmagan, choralar samaradorligi tizimli baholanmagan", "Qaror ijrosida mas’ul shaxslar va muddatlar belgilanmagan, tizimli nazorat va teskari aloqa yo‘lga qo‘yilmagan", "Jamoaviy muhokama va muammoning chuqur tahlili o‘tkazilmagan, shu sababli asosiy sabablar aniqlanmay, samarali chora belgilanmagan", "Resurs va materiallar yetishmasligi aniqlangan bo‘lsa-da, ularni bartaraf etish rejasi va moliyaviy imkoniyatlar baholanmagan"], "a": 2}, {"n": 28, "q": "O‘quvchilar olimpiadalarda yuqori natija ko‘rsatmoqda, pedagoglar malakali. Biroq ota-onalar va mahalla orasida maktab faoliyati ochiq emas, yutuqlar yoritilmaydi, degan fikr bor. Rasmiy axborot kam beriladi, ijtimoiy tarmoq sahifalari faolsiz. Maktabning tashqi imiji ichki imkoniyatlariga mos emas.\nImijni yaxshilash uchun eng to‘g‘ri va ustuvor qaror qaysi?", "o": ["Ijtimoiy tarmoq va veb-sayt orqali yutuqlarni tizimli yoritib, ota-onalar va mahalla bilan ishonchli muloqot kanallarini yo‘lga qo‘yish", "Faoliyatni strategik asosda yo‘lga qo‘yib, yutuqlar va jarayonlar haqida tezkor, tizimli va shaffof axborot berish orqali ishonchli muloqot o‘rnatish", "Ota-onalar qo‘mitasi va mahalla bilan tizimli uchrashuvlar o‘tkazib, yutuqlarni shaffof taqdim etish va hamkorlikni strategik yo‘lga qo‘yish", "PR faoliyatini tizimli rejalashtirib, yutuqlar haqida tezkor axborot berish, ijtimoiy tarmoq va an’anaviy vositalar orqali muloqotni kuchaytirish"], "a": 1}, {"n": 29, "q": "Maktab PR faoliyatini samarali tashkil etish bosqichlarining to‘g‘ri ketma-ketligini aniqlang.\n1) Har chorak oxirida ota-onalar fikri va sahifa ko‘rsatkichlari qanday o‘zgarganini o‘lchash\n2) Ochiq eshiklar kunini o‘tkazib, yutuqlarni sahifada haftalik yoritishni boshlash\n3) Natijaga qarab kontent rejasi va muloqot kanallarini qayta ko‘rib chiqish\n4) Ota-onalar va mahalla orasida so‘rovnoma o‘tkazib, maktab haqidagi fikrni o‘rganish\n5) PR strategiyasi, yillik reja va mas’ul xodimlarni tasdiqlash", "o": ["4 → 1 → 5 → 2 → 3", "4 → 5 → 1 → 2 → 3", "5 → 4 → 2 → 1 → 3", "4 → 5 → 2 → 1 → 3"], "a": 3}, {"n": 30, "q": "Ijtimoiy tarmoqda maktab haqida tasdiqlanmagan salbiy axborot tarqaldi. Rahbariyat ichki o‘rganishga vaqt ajratib, bir necha kun rasmiy munosabat bildirmadi. Bu orada mish-mishlar kuchaydi, ota-onalarda ishonchsizlik paydo bo‘ldi. Keyin axborot noto‘g‘ri talqin qilingani aniqlandi.\nKelgusida imijga zarar yetmasligi uchun eng samarali yondashuv qaysi?", "o": ["Inqirozli vaziyatda tezkor, aniq va ochiq rasmiy pozitsiya bildirish, axborot tashabbusini o‘z qo‘liga olish", "Bahsli holatda rasmiy ma’lumotni tizimli tayyorlab, ota-onalarga asosli izoh berish, axborot tarqalishini nazoratga olish", "Ijtimoiy tarmoqdagi salbiy munosabatlarni tahlil qilib, maktab pozitsiyasini tushunarli bayon etish, kommunikatsiyani tartibga solish", "Bahsli vaziyatlarda jamoatchilik bilan muloqotni kuchaytirish, noto‘g‘ri talqinning oldini olish uchun izchil axborot berish"], "a": 0}];const L="ABCD";let i=0,score=0,done=false;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const app=document.getElementById('app'),bar=document.getElementById('bar');
function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;
app.querySelectorAll('.o').forEach(b=>{b.querySelector('span').textContent=q.o[+b.dataset.k];b.onclick=()=>pick(b)});
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():result()};window.scrollTo(0,0)}
function pick(b){if(done)return;done=true;const k=+b.dataset.k,a=Q[i].a;
app.querySelectorAll('.o')[a].classList.add('ok');if(k===a)score++;else b.classList.add('no');
try{Telegram.WebApp.HapticFeedback.notificationOccurred(k===a?'success':'error')}catch(e){}
document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
</script></body></html>
