<html lang="ru">
<head>

<title>Тесты для менеджеров</title>

<style>
:root{
  --bg:var(--tg-theme-bg-color,#f4f6fb);
  --card:var(--tg-theme-secondary-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#1c2233);
  --hint:var(--tg-theme-hint-color,#7a8399);
  --accent:var(--tg-theme-button-color,#2f6fed);
  --accent-text:var(--tg-theme-button-text-color,#ffffff);
  --ok:#1f9d55; --ok-bg:rgba(31,157,85,.12);
  --bad:#d64545; --bad-bg:rgba(214,69,69,.12);
  --line:rgba(127,135,160,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--hint);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.test-item{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.test-item b{font-size:17px}
.test-item small{color:var(--hint);display:block;margin-top:2px}
.badge{font-size:13px;padding:4px 9px;border-radius:20px;background:var(--line);white-space:nowrap}
.badge.good{background:var(--ok-bg);color:var(--ok)}
.legend{font-size:13px;color:var(--hint)}
.legend span{display:inline-block;margin:2px 8px 2px 0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hint);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.type{display:inline-block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:6px;background:var(--line);margin-bottom:8px}
.type.case{background:#fff1d6;color:#9a6200}
.type.seq{background:#e3ecff;color:#2b55b8}
.type.match{background:#efe3ff;color:#6b35b8}
.situation{background:rgba(255,193,7,.12);border-left:4px solid #e0a800;padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:15px}
.q{font-weight:600;font-size:17px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;font-size:15px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.seq-item{display:flex;gap:10px;align-items:flex-start}
.num{min-width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.opt.picked .num{background:var(--accent);color:var(--accent-text)}
.row{margin-bottom:12px}
.row .left{font-weight:600;margin-bottom:5px;font-size:15px}
select{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
select.ok{border-color:var(--ok);background:var(--ok-bg)}
select.bad{border-color:var(--bad);background:var(--bad-bg)}
.fix{font-size:13px;color:var(--ok);margin-top:4px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-text);font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
.btn.sec{background:var(--line);color:var(--text)}
.btn:disabled{opacity:.45}
.feedback{padding:10px 12px;border-radius:10px;margin:8px 0;font-weight:600}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);color:var(--bad)}
.correct-list{font-size:14px;margin:6px 0 0;padding-left:20px}
.big{font-size:44px;font-weight:800;text-align:center;margin:8px 0}
.center{text-align:center}
.review .rq{font-size:14px;margin-bottom:4px;font-weight:600}
.review .ra{font-size:14px;color:var(--ok)}
.hidden{display:none}
</style>
</head>

const QUESTIONS_PER_TEST = 30;
const TEST_COUNT = 5;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// Собираем тесты: в каждом 20 обычных вопросов, 4 кейса, 3 на последовательность, 3 на соответствие
const TESTS = [];
for(let t=0;t<TEST_COUNT;t++){
  const qs=[];
  MC.slice(0,100).forEach((q,i)=>{ if(i%TEST_COUNT===t) qs.push({type:'mc',q:q[0],correct:q[1],opts:q.slice(1)}); });
  CASE.forEach((q,i)=>{ if(i%TEST_COUNT===t) qs.push({type:'case',sit:q[0],q:q[1],correct:q[2],opts:q.slice(2)}); });
  SEQ.forEach((q,i)=>{ if(i%TEST_COUNT===t) qs.push({type:'seq',q:q[0],items:q[1]}); });
  MATCH.forEach((q,i)=>{ if(i%TEST_COUNT===t) qs.push({type:'match',q:q[0],pairs:q[1]}); });
  TESTS.push({name:'Тест '+(t+1),qs});
}

const TYPE_LABEL={mc:'Вопрос',case:'Кейс',seq:'Последовательность',match:'Соответствие'};
const app=document.getElementById('app');
let st=null;

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

function home(){
  st=null;
  let h='<h1>Тесты для менеджеров</h1><div class="sub">5 тестов по 30 вопросов · всего 150 вопросов</div>';
  h+='<div class="card legend"><span>🔹 Вопросы с выбором ответа</span><span>📋 Кейсы</span><span>🔢 Последовательность</span><span>🔗 Соответствие</span></div>';
  TESTS.forEach((t,i)=>{
    const best=store('ru_best_'+i);
    const b=best!==null&&best!==undefined?`<span class="badge ${+best>=24?'good':''}">Лучший: ${best}/${t.qs.length}</span>`:'<span class="badge">Не пройден</span>';
    h+=`<div class="card test-item" onclick="start(${i})"><div><b>${t.name}</b><small>${t.qs.length} вопросов</small></div>${b}</div>`;
  });
  app.innerHTML=h; window.scrollTo(0,0);
}

function start(i){
  st={t:i,idx:0,score:0,wrong:[],answered:false,seqPick:[]};
  show();
}

function show(){
  const T=TESTS[st.t], q=T.qs[st.idx];
  st.answered=false; st.seqPick=[];
  let h=`<div class="top"><span>${T.name}</span><span>${st.idx+1} / ${T.qs.length}</span></div><div class="bar"><i style="width:${st.idx/T.qs.length*100}%"></i></div>`;
  h+=`<div class="card"><span class="type ${q.type}">${TYPE_LABEL[q.type]}</span>`;
  if(q.type==='case') h+=`<div class="situation">${esc(q.sit)}</div>`;
  h+=`<div class="q">${esc(q.q)}</div><div id="body"></div><div id="fb"></div></div>`;
  h+=`<button class="btn sec" onclick="if(confirm('Выйти из теста? Прогресс будет потерян.'))home()">Выйти</button>`;
  app.innerHTML=h;
  const body=document.getElementById('body');
  if(q.type==='mc'||q.type==='case'){
    q._shown=shuffle(q.opts);
    body.innerHTML=q._shown.map((o,k)=>`<button class="opt" onclick="pick(${k})">${esc(o)}</button>`).join('');
  } else if(q.type==='seq'){
    q._shown=shuffle(q.items);
    renderSeq();
  } else {
    q._right=shuffle(q.pairs.map(p=>p[1]));
    body.innerHTML=q.pairs.map((p,k)=>`<div class="row"><div class="left">${k+1}. ${esc(p[0])}</div><select id="m${k}" onchange="matchReady()"><option value="">— выберите —</option>${q._right.map(r=>`<option>${esc(r)}</option>`).join('')}</select><div id="fx${k}"></div></div>`).join('')
      +`<button class="btn" id="chk" disabled onclick="checkMatch()">Проверить</button>`;
  }
  window.scrollTo(0,0);
}

function pick(k){
  if(st.answered)return; st.answered=true;
  const q=TESTS[st.t].qs[st.idx];
  const btns=document.querySelectorAll('#body .opt');
  const ok=q._shown[k]===q.correct;
  btns.forEach((b,i)=>{b.disabled=true;if(q._shown[i]===q.correct)b.classList.add('ok');});
  if(!ok)btns[k].classList.add('bad');
  done(ok);
}

function renderSeq(){
  const q=TESTS[st.t].qs[st.idx];
  const body=document.getElementById('body');
  let h='<div class="legend" style="margin-bottom:8px">Нажимайте на пункты по порядку: первый, второй, третий…</div>';
  h+=q._shown.map((it,k)=>{const n=st.seqPick.indexOf(k);return `<button class="opt seq-item ${n>=0?'picked':''}" ${st.answered?'disabled':''} onclick="seqTap(${k})"><span class="num">${n>=0?n+1:''}</span><span>${esc(it)}</span></button>`;}).join('');
  if(!st.answered){
    h+=`<button class="btn sec" onclick="st.seqPick=[];renderSeq()">Сбросить</button>`;
    h+=`<button class="btn" ${st.seqPick.length===q._shown.length?'':'disabled'} onclick="checkSeq()">Проверить</button>`;
  }
  body.innerHTML=h;
}
function seqTap(k){
  if(st.answered)return;
  const i=st.seqPick.indexOf(k);
  if(i>=0)st.seqPick.splice(i,1); else st.seqPick.push(k);
  renderSeq();
}
function checkSeq(){
  const q=TESTS[st.t].qs[st.idx];
  st.answered=true;
  const user=st.seqPick.map(k=>q._shown[k]);
  const ok=user.every((v,i)=>v===q.items[i]);
  renderSeq();
  const btns=document.querySelectorAll('#body .opt');
  q._shown.forEach((it,k)=>{const pos=st.seqPick.indexOf(k);btns[k].classList.add(q.items[pos]===it?'ok':'bad');});
  done(ok, ok?'':'<div style="margin-top:6px;font-weight:600">Правильный порядок:</div><ol class="correct-list">'+q.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>');
}

function matchReady(){
  const q=TESTS[st.t].qs[st.idx];
  const all=q.pairs.every((p,k)=>document.getElementById('m'+k).value);
  document.getElementById('chk').disabled=!all;
}
function checkMatch(){
  const q=TESTS[st.t].qs[st.idx];
  st.answered=true;
  let ok=true;
  q.pairs.forEach((p,k)=>{
    const s=document.getElementById('m'+k); s.disabled=true;
    if(s.value===p[1]) s.classList.add('ok');
    else{ok=false;s.classList.add('bad');document.getElementById('fx'+k).innerHTML='<div class="fix">✓ '+esc(p[1])+'</div>';}
  });
  document.getElementById('chk').remove();
  done(ok);
}

function done(ok,extra){
  const T=TESTS[st.t];
  if(ok)st.score++; else st.wrong.push(st.idx);
  const last=st.idx===T.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✅ Верно!':'❌ Неверно'}</div>${extra||''}<button class="btn" onclick="next()">${last?'Показать результат':'Далее →'}</button>`;
  try{window.Telegram&&Telegram.WebApp.HapticFeedback&&Telegram.WebApp.HapticFeedback.notificationOccurred(ok?'success':'error');}catch(e){}
}

function next(){
  const T=TESTS[st.t];
  if(st.idx<T.qs.length-1){st.idx++;show();}
  else result();
}

function answerText(q){
  if(q.type==='mc'||q.type==='case')return esc(q.correct);
  if(q.type==='seq')return q.items.map((x,i)=>(i+1)+'. '+esc(x)).join('<br>');
  return q.pairs.map(p=>esc(p[0])+' — '+esc(p[1])).join('<br>');
}

function result(){
  const T=TESTS[st.t], n=T.qs.length, pct=Math.round(st.score/n*100);
  const prev=+store('ru_best_'+st.t)||0;
  if(st.score>prev)store('ru_best_'+st.t,String(st.score));
  let msg=pct>=86?'Отлично! 🏆':pct>=71?'Хорошо! 👍':pct>=56?'Удовлетворительно 🙂':'Нужно повторить материал 📚';
  let h=`<div class="card center"><div class="sub" style="margin:0">${T.name} завершён</div><div class="big">${st.score} / ${n}</div><div><b>${pct}%</b> — ${msg}</div></div>`;
  if(st.wrong.length){
    h+='<h1 style="font-size:18px">Ошибки и правильные ответы</h1>';
    st.wrong.forEach(i=>{const q=T.qs[i];h+=`<div class="card review"><div class="rq">${i+1}. ${esc(q.q)}</div><div class="ra">${answerText(q)}</div></div>`;});
  }
  h+=`<button class="btn" onclick="start(${st.t})">Пройти ещё раз</button><button class="btn sec" onclick="home()">К списку тестов</button>`;
  app.innerHTML=h; window.scrollTo(0,0);
}

try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}}catch(e){}
home();
</script>
