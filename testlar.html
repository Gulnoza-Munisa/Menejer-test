<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menejerlik testi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f3f6fb; --card:#ffffff; --text:#0f172a; --muted:#64748b;
    --brand:#2563eb; --brand2:#0ea5e9; --ok:#16a34a; --okbg:#dcfce7;
    --bad:#dc2626; --badbg:#fee2e2; --line:#e2e8f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;padding:20px 16px 32px}
  .card{background:var(--card);border-radius:20px;padding:22px;box-shadow:0 4px 18px rgba(15,23,42,.06)}
  h1{font-size:24px;line-height:1.25;margin-bottom:8px}
  h2{font-size:19px;line-height:1.4;margin-bottom:18px}
  p{color:var(--muted);line-height:1.5}
  .hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:20px;padding:24px;margin-bottom:16px}
  .hero p{color:rgba(255,255,255,.88)}
  .badge{display:inline-block;background:rgba(255,255,255,.2);padding:5px 11px;border-radius:99px;font-size:13px;margin-bottom:12px}
  .stats{display:flex;gap:10px;margin:16px 0 20px}
  .stat{flex:1;background:var(--bg);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;color:var(--muted)}
  label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;margin-bottom:16px;outline:none}
  input:focus{border-color:var(--brand)}
  .btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.ghost{background:var(--bg);color:var(--text);margin-top:10px}
  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .count{font-weight:600;color:var(--muted);font-size:14px}
  .timer{background:#e0f2fe;color:#0369a1;font-weight:800;padding:7px 14px;border-radius:99px;font-variant-numeric:tabular-nums}
  .timer.low{background:var(--badbg);color:var(--bad)}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15px;line-height:1.4;cursor:pointer;color:var(--text)}
  .opt .l{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:700}
  .opt.ok{border-color:var(--ok);background:var(--okbg)}
  .opt.ok .l{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .opt.bad .l{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .note{border-radius:14px;padding:13px;margin:6px 0 14px;font-size:14px;line-height:1.5}
  .note.ok{background:var(--okbg);color:#14532d}
  .note.bad{background:var(--badbg);color:#7f1d1d}
  .score{width:150px;height:150px;border-radius:50%;margin:8px auto 18px;display:grid;place-items:center;text-align:center}
  .score div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .score b{font-size:34px;display:block}
  .score span{font-size:13px;color:var(--muted)}
  .center{text-align:center}
  .review{margin-top:18px}
  .ri{border-top:1px solid var(--line);padding:12px 0;font-size:14px;line-height:1.45}
  .ri b{display:block;margin-bottom:4px}
  .ri .y{color:var(--bad)} .ri .c{color:var(--ok)}
  .hidden{display:none}
  h2#qText{white-space:pre-line;font-size:17px}
  .tests{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .tbtn{padding:14px 10px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15px;font-weight:700;cursor:pointer;color:var(--text);text-align:center}
  .tbtn small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:3px}
  .tbtn.on{border-color:var(--brand);background:#eff6ff;color:var(--brand)}
  .tbtn.wide{grid-column:1/-1}
  .quit{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px 0}
</style>
</head>
<body>
<div class="app">

  <!-- Boshlash -->
  <section id="start">
    <div class="hero">
      <span class="badge">🏫 Maktab bo‘limi</span>
      <h1>Menejerlik bo‘yicha test</h1>
      <p>Menejerlik o‘quv kursi test bazasi: 6 ta test, 179 ta savol.</p>
    </div>
    <div class="card">
      <label>Testni tanlang</label>
      <div class="tests" id="tests"></div>
      <div class="stats">
        <div class="stat"><b id="sQ">30</b><span>savol</span></div>
        <div class="stat"><b id="sT">2</b><span>daqiqa / savol</span></div>
        <div class="stat"><b>1</b><span>to‘g‘ri javob</span></div>
      </div>
      <label for="name">Ism-familiyangiz</label>
      <input id="name" placeholder="Masalan: Aliyeva Nodira" autocomplete="name">
      <button class="btn" id="go" disabled>Testni boshlash</button>
    </div>
  </section>

  <!-- Savol -->
  <section id="quiz" class="hidden">
    <div class="top">
      <span class="count" id="count"></span>
      <button class="quit" id="quit">✕ Chiqish</button>
      <span class="timer" id="timer">02:00</span>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="card">
      <h2 id="qText"></h2>
      <div id="opts"></div>
      <div id="note" class="note hidden"></div>
      <button class="btn hidden" id="next">Keyingi savol</button>
    </div>
  </section>

  <!-- Natija -->
  <section id="result" class="hidden">
    <div class="card center">
      <h1 id="rTitle"></h1>
      <p id="rTest"></p>
      <p id="rName"></p>
      <div class="score" id="ring"><div><span><b id="rScore"></b>to‘g‘ri javob</span></div></div>
      <p id="rMsg"></p>
      <div class="review" id="review" style="text-align:left"></div>
      <button class="btn" id="again" style="margin-top:18px">Qayta topshirish</button>
    </div>
  </section>

</div>

<script>
/* ====== TEST BAZASI (test_baza_13_tozalangan.pdf dan olingan) ====== */
const BANK = [{"name":"1-TEST","qs":[{"q":"O‘qituvchi dars jarayonida o‘quvchilarni kichik guruhlarga bo‘lib, ularga muayyan muammo yuzasidan loyiha ishlab chiqish vazifasini berdi. O‘quvchilar tadqiqot olib borib, yechimlarni taqdim etdilar hamda o‘zaro fikr almashdilar. Jarayonda hamkorlik va mustaqil izlanish ustuvor bo‘ldi. Ushbu vaziyat qaysi yondashuvni ifodalaydi?","o":["Faol va interfaol metodlar","Nazorat va baholash tizimi","Reproduktiv o‘qitish usuli","Ma’ruza asosidagi yondashuv"],"a":0},{"q":"Rahbar mas’uliyatining quyidagi jihatlari qanday ketma-ketlikda amalga oshiriladi?\n1.Xavf-xatarlarni tahlil qilish\n2.Xodimlarni o‘qitish\n3.Shaffoflik va monitoringni yo‘lga qo‘yish\n4.Tizimli chora-tadbirlar ishlab chiqish\n5.Qoidabuzarliklarga nisbatan chora belgilash","o":["1-2-4-3-5","1-4-2-3-5","4-1-2-3-5","1-3-2-4-5"],"a":1},{"q":"Moliyaviy xarajatni samarali tashkil etishda direktor resurslar oqimini qarorlar zanjiri asosida boshqaradi. Quyidagi jarayonlarni to‘g‘ri ketma- ketlikda joylashtiring.\n1.Mablag‘ ajratish\n2.Ehtiyojni aniqlash\n3.Nazorat\n4.Reja tuzish\n5.Tahlil va takomillashtirish\n6.Xarid ijrosi","o":["2-1-4-6-3-5","2-4-1-6-3-5","4-2-1-6-5-3","2-4-6-1-3-5"],"a":1},{"q":"Moslashtiring. Yo‘nalishlar\n1.Ma’muriy maqsad\n2.Motivatsion maqsad\n3.Rivojlantirish maqsadi Mazmuni\nA) Xodimning kasbiy ehtiyojlarini aniqlash va individual rivojlanish yo‘nalishini belgilash\nB) Lavozimga tayinlash, boshqa ishga o‘tkazish, shartnomani bekor qilish uchun asos yaratish\nC) Yuqori natijaga erishgan xodimlarni rag‘batlantirish orqali raqobat muhitini shakllantirish\nD) Xodim faoliyati natijalari bo‘yicha obyektiv ma’lumot berish va kamchiliklarni tushuntirish","o":["1-B, 2-C, 3-A","1-B, 2-A, 3-D","1-A, 2-D, 3-B","1-C, 2-A, 3-D"],"a":0},{"q":"Direktor TALIS tavsiyalari va milliy islohotlar bilan uyg‘un holda maktab boshqaruvini transformatsiya qilish rejasini ishlab chiqmoqda. Qaysi variant boshqaruvda eng maqbul strategik yo‘nalishlarni ifodalaydi?","o":["Kadrlar zaxirasini shakllantirish, avtonomiya va hisobdorlik muvozanatini saqlash, jamoatchilik ishtirokini kengaytirish, pedagogik yetakchilikni ustuvor qilish, ilg‘or tajribalarni moslashtirish","Tashqi nazoratni kuchaytirish, moliyaviy hisobotlarni kengaytirish, o‘qituvchilar faoliyatini qat’iy tartibga solish, markazlashgan boshqaruvni kuchaytirish","Infratuzilmani yangilash, sinf xonalarini ta’mirlash, ichki tartib- qoidalarni kuchaytirish, asosiy qarorlarni rahbar tomonidan qabul qilish","Reyting ko‘rsatkichlariga yo‘naltirilgan ishlarni kuchaytirish, hujjatlar hajmini oshirish, ota-onalar ishtirokini cheklash, pedagogik tashabbuslarni kamaytirish"],"a":0},{"q":"Ma’muriy IIR boshqaruvi ustun bo‘lgan maktabda qanday xavf yuzaga kelishi mumkin?","o":["Vazifalarning tezroq bajarilishi","Rivojlanishning sekinlashuvi","Nazorat mexanizmlarining kuchayishi","Hujjat aylanishining ortib borishi"],"a":1},{"q":"Quyidagilarni moslashtiring. Sun’iy intellekt dasturlari\n1.ChatGPT\n2.Claude\n3.Copilot Vazifasi\nA) Google tomonidan yaratilgan kuchli sun’iy intellekt tizimi bo‘lib, u tabiiy tilni tushunish va turli vazifalarni bajarish (matn, kod, suhbat) uchun xizmat qiladi.\nB) Musk kompaniyasi tomonidan ishlab chiqarilgan sun’iy intellekt chat-boti bo‘lib, u tezkor javoblar, ijodiy matnlar, fikrlash va suhbat uchun xizmat qiladi.\nC) Microsoft tomonidan ishlab chiqarilgan sun’iy intellekt yordamchisi bo‘lib, u dasturlashda yordam berish, kod yozish, takliflar berish va tahlil qilishga xizmat qiladi.\nD) OpenAI tomonidan ishlab chiqarilgan sun’iy intellekt asosidagi chat-bot bo‘lib, u inson bilan muloqot qilish, matn yaratish, tushuntirish va maslahat berishga xizmat qiladi.","o":["1-C, 2-B, 3-D","1-D, 2-C, 3-B","1-A, 2-D, 3-C","1-D, 2-B, 3-C"],"a":3},{"q":"Maktabda o‘quvchilar olimpiadalar va tanlovlarda muntazam yuqori natijalarga erishmoqda, pedagoglar malakali, biroq ota-onalar va mahalla o‘rtasida maktab faoliyati yetarlicha ochiq emas, yutuqlar tizimli yoritilmaydi, degan qarash shakllangan. Rasmiy axborot tez-tez berilmaydi, ijtimoiy tarmoqlardagi sahifalar esa faolsiz. Natijada maktabning tashqi imiji uning ichki imkoniyatlariga mos kelmayapti. Ushbu vaziyatda maktab imijini yaxshilash uchun eng to‘g‘ri va ustuvor boshqaruv qarori to‘g‘ri ko‘rsatilgan javob variantini aniqlang.","o":["Maktabning ijtimoiy tarmoqdagi sahifalarini vaqtincha yopib, faqat ota- onalar yig‘ilishlari orqali axborot berishni yo‘lga qo‘yish","Asosiy e’tiborni ichki nazorat va hujjatlashtirishga qaratib, jamoatchilik bilan aloqani keyingi bosqichga qoldirish","Olimpiada natijalarini ichki hisobotlarda saqlab, tashqi axborot berishni faqat rasmiy tadbirlar bilan cheklash","Faoliyatni strategik asosda yo‘lga qo‘yib, yutuqlar va jarayonlar haqida tezkor, tizimli va shaffof axborot berish orqali jamoatchilik bilan ishonchli muloqot o‘rnatish"],"a":3},{"q":"Tashkilot rahbari buyruq va farmoyishlarni qonuniy asosda rasmiylashtirishni, shuningdek hujjatlar bilan ishlash madaniyatini rivojlantirishni maqsad qilmoqda. Shu maqsadda u amaliy-huquqiy tahlil qilish, hujjatlarni tekshirish va takomillashtirish ishlarini yo‘lga qo‘ymoqda. Bunda qaysi yo‘l uning huquqiy savodxonligini bevosita mustahkamlaydi?","o":["Tashkiliy nazorat mexanizmlarini kuchaytirish","Boshqaruv topshiriqlarining ijro muddatlarini qisqartirish","Amaliy huquqiy ko‘nikmalarni shakllantirish","Hujjatlar aylanishi tezligini oshirish"],"a":2},{"q":"Tarifikatsiya ro‘yxatlarini shakllantirish tartibi bosqichlarini to‘g‘ri ketma-ketlikda joylashtiring.\n1.Pedagogik kengash tomonidan dars soatlari setkasini ko‘rib chiqish\n2.Umumta’lim muassasalari uchun tayanch o‘quv rejasini ishlab chiqish\n3.Umumta’lim muassasasida dars soatlari setkasini shakllantirish\n4.Belgilangan ma’lumotlarni elektron dasturga kiritish\n5.Umumta’lim muassasasida dars soatlarini qayta taqsimlashni belgilash","o":["2-3-1-5-4","3-2-1-4-5","2-1-3-5-4","2-3-5-1-4"],"a":0},{"q":"Direktor o‘zgarishni tez amalga oshirish uchun barcha topshiriqlarni bir vaqtning o‘zida jamoaga yuklaydi. Natijada charchoq va qarshilik kuchayadi. Bunda qaysi tamoyil buzilgan?","o":["Moslashuvchanlik tamoyili","Shaffoflik tamoyili","Ketma-ketlik tamoyili","Ishtirokchilik tamoyili"],"a":2},{"q":"Direktor o‘quvchining o‘zlashtirishdagi qiyinchiligini faqat “bola sust” degan fikr bilan izohlash o‘rniga dars metodikasi, sinf muhiti va ta’lim sharoitlarini ham tahlil qilishni topshirdi. Bu yondashuv inkluziv ta’limning qaysi jihatini aks ettiradi?","o":["Dars natijalarini baholash mezonlarini qayta ko‘rib chiqishni","Ta’lim jarayonida individual yondashuvni kuchaytirish zarurligini","Ta’limdagi cheklovlar talqinining o‘zgarishini","O‘quvchilarni qobiliyatiga qarab guruhlash samaradorligini"],"a":2},{"q":"Maktab direktori o‘qituvchilar uchun uzluksiz malaka oshirish dasturini joriy etish va yetakchi o‘qituvchilarni kelajakdagi boshqaruv lavozimlariga tayyorlashni rejalashtirmoqda. Ushbu faoliyat qaysi yondashuvga mos keladi?","o":["Moliyaviy rag‘batlantirishga ustuvorlik berish","Strategik inson resurslarini boshqarish","Ma’muriy nazoratga asoslangan boshqaruv","Operativ vazifalarni taqsimlash yondashuvi"],"a":1},{"q":"Maktab sport zali ta’miri uchun ajratilgan mablag‘ smetaga muvofiq sarflandi, shartnomalar rasmiylashtirildi, uzoq muddatli foydali taklif tanlandi va manfaatlar to‘qnashuvi oldindan bartaraf etildi. Ushbu holatda moliyaviy boshqaruvga qo‘yilgan qaysi yondashuv eng to‘liq aks etgan?","o":["Moliyaviy nazoratning joriy hujjatlar bilan cheklangan yondashuvi","Moliyaviy boshqaruvning asosiy tamoyillariga asoslangan yondashuv","Xarajatlarni kamaytirishga ustuvor ahamiyat berilgan amaliy yondashuv","Mablag‘lardan foydalanishda qisqa muddatli natijaga qaratilgan yondashuv"],"a":1},{"q":"Tashkilotlar va ular bilan hamkorlikda amalga oshiriladigan faoliyat yo‘nalishlarini moslashtiring.\n1.Xususiy sektor va tadbirkorlar\n2.Xalqaro tashkilotlar\n3.Nodavlat tashkilotlar va ijtimoiy fondlar\nA) Kasbiy ta’lim, amaliyot va ishga joylashuv imkoniyatlarini yaratish\nB) Zamonaviy ta’lim tajribasini joriy qilish, seminar va konferensiyalarda ishtirokni ta’minlash\nC) Resurslar jalb qilish, grantlar va bolalarning ijodiy rivojlanishini qo‘llab- quvvatlash\nD) O‘quvchilarning tarbiyasiga e’tiborni oshirish, ularning ma’naviy- ma’rifiy va madaniy rivojlanishini ta’minlash","o":["1-A, 2-D, 3-B","1-A, 2-B, 3-C","1-B, 2-C, 3-D","1-C, 2-A, 3-D"],"a":1},{"q":"Moliyaviy qarorlar va xarajatlar bo‘yicha ma’lumotlar tizimli ravishda yuritilib, tekshiruv uchun ochiq holda saqlanadi. Bu qaysi tamoyilni ifodalaydi?","o":["Tejamkorlik va samaradorlik","Operativ nazorat tizimi","Markazlashgan boshqaruv","Shaffoflik va hisobdorlik"],"a":3},{"q":"Siz maktab rahbarisiz. Dars kuzatuviga kirganingizda o‘qituvchi 45 daqiqa davomida o‘z nutqini asosiy qismga aylantirgan, o‘quvchilarning faol ishtiroki esa kam bo‘lgan. Siz sifat mezoni bo‘yicha eng katta kamchilikni belgilang.","o":["Vaqt taqsimotida nazariy tushuntirish ulushining yuqori bo‘lgani","Darsda o‘quvchi markazlashuvining yetarli darajada ta’minlanmagani","Baholash va nazorat elementlarining dars jarayoniga sust integratsiya qilingani","O‘qituvchining mavzuni izchil va tartibli bayon etishga ortiqcha urg‘u bergani"],"a":1},{"q":"Umumiy o‘rta ta’lim muassasasini boshqarishda quyidagi tamoyillar va ularning natijalari o‘rtasidagi moslikni aniqlang.\n1.Adolatlilik\n2.Ilmiylik\n3.Demokratiklik\nA) Mas’uliyatning bo‘linishi\nB) Ishonch muhitining shakllanishi\nC) Asosli qarorlarning qabul qilinishi\nD) Maktabning ijtimoiy nufuzi oshishi","o":["1-B, 2-C, 3-A","1-C, 2-B, 3-D","1-A, 2-C, 3-B","1-B, 2-A, 3-D"],"a":0},{"q":"Maktab rahbariyati tomonidan OTM ta’lim muassasasi bilan hamkorlik qilinib, memorandum imzolandi. Har bir tashkilotdan mas’ul xodimlar belgilandi. OTMning turli kafedralari maktabda bir qator tadbirlar tashkil qildi. Bir kafedra o‘z imkoniyatlaridan kelib chiqib fanlar bo‘yicha maktab olimpiadasini, boshqa kafedra maktab o‘qituvchilari uchun treninglar, yana boshqa kafedra sport musobaqasini, yana bir kafedra esa pazanda qizlar klubini tashkil qildi. Ammo yil oxiriga kelib, maktabda ta’lim sifati ko‘rsatkichlari sezilarli darajada pasaydi.\nSavol: Bunda maktab rahbariyati samaradorlikni oshirish uchun quyidagi choralarni qaysi ketma-ketlikda amalga oshirishi kerak?\n1.Har bir hamkorlik uchun mas’ul shaxslar va muddatlarni belgilash\n2.Maqsad va samaradorlik ko‘rsatkichlarini qaytadan ko‘rib chiqish\n3.Hamkorlik natijalarini baholashni yo‘lga qo‘yish\n4.Jarayonni muvofiqlashtiruvchi uchrashuvlarni tizimli o‘tkazish\n5.Harakatni tadbirga emas, natijaga yo‘naltirish","o":["1-2-4-5-3","2-5-1-4-3","2-1-5-4-3","1-5-2-4-3"],"a":2},{"q":"Kuzatuv kengashining asosiy vazifasi nimadan iborat?","o":["O‘quvchilarning davomatini yuritish","Maktabdagi barcha buyruqlarni mustaqil tasdiqlash","O‘qituvchilarning kundalik dars jarayonini nazorat qilish","Maktab faoliyatining shaffofligini ta’minlash"],"a":3},{"q":"Maktabda yangi baholash tizimi joriy etildi. O‘qituvchilar “nima o‘zgaradi?” degan savollarga javob ololmayapti. Mish-mishlar ko‘paydi va norozilik kuchaydi. Direktor qaysi muammoni birinchi navbatda bartaraf etishi kerak?","o":["Kommunikatsiya bo‘shlig‘ini","Tashkiliy intizomning pasayishini","Nazorat mexanizmlarining sustligini","Me’yoriy hujjatlar yetishmasligini"],"a":0},{"q":"Maktab direktori yangi o‘quv yiliga tayyorgarlik ko‘rish uchun vaqtni boshqarish jarayonini tashkil qilishda qaysi ketma-ketlik to‘g‘ri hisoblanadi?","o":["Rejalashtirish, tahlil, nazorat, maqsad qo‘yish, amaliy o‘zlashtirish","Nazorat, tahlil, rejalashtirish, maqsad qo‘yish, amaliy o‘zlashtirish","Maqsad qo‘yish, tahlil, amaliy o‘zlashtirish, rejalashtirish, nazorat","Tahlil, maqsad qo‘yish, rejalashtirish, amaliy o‘zlashtirish, nazorat"],"a":3},{"q":"Qaysi holatda “5 nega?” usuli eng samarador hisoblanadi?","o":["Muammo takrorlanib kelayotganida","Vazifa ijrosi muddatidan oldin bajarilganda","Qarorlar tezkor ravishda qabul qilinayot
