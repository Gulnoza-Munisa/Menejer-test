tlar olinadigan bo‘ldi. Belgilangan muddat davomida barcha rejalashtirilgan tadbirlar amalga oshirildi. Nazorat jarayonida ayrim kamchiliklar aniqlanib, ish rejalariga tegishli tuzatishlar ham kiritildi. Mas’ul shaxslar aniq belgilandi va ijro intizomi kuchaytirildi. O‘quv yili yakunida rahbar erishilgan natijalarni dastlabki maqsadlar bilan solishtirdi. O‘quvchilar o‘zlashtirish darajasi, fanlar kesimidagi o‘sish ko‘rsatkichlari hamda ota-onalar fikri tahlil qilindi. Natijalar asosida qabul qilingan qarorning samaradorligi va ta’sir darajasi aniqlandi. Rahbar kelgusida yanada mukammal qarorlar qabul qilish uchun xulosalar chiqardi. Mazkur vaziyatda rahbar tomonidan amalga oshirilgan boshqaruv bosqichi qaysi javobda to‘g‘ri ko‘rsatilgan?","o":["Qarorni baholash","Tuzatishlar kiritish","Qaror ijrosini ta`minlash","Qaror bajarilishini kuzatish"],"a":0},{"q":"Pulli ta’lim xizmatlarini tashkil etish tartibida quydagi bosqichlar\nmavjud. Ularni to‘g’ri ketma ketligda joylashtiring:\n1. Narxni asoslash\n2. Buyriq va nizom tayyorlash\n3. Alohida hisob raqam yuritish\n4. Shartnoma va kvitansiya joriy etish","o":["2-1-4-3","1-2-3-4","1-2-4-3","2-3-1-4"],"a":0},{"q":"Maktab direktori o‘z muassasasining hududiy o‘ziga xosligi va o‘qituvchilar jamoasining real imkoniyatlarini tahlil qilmasdan, yuqori turuvchi organlar tomonidan berilgan umumiy ko‘rsatmalarni tahlilsiz, \"qolip\" ko‘rinishida tatbiq etishda davom etmoqda. Bu esa maktabdagi real muammolarning yechilmay qolishiga sabab bo‘lmoqda. Mazkur vaziyatda rahbar faoliyatida eng avvalo qaysi boshqaruv bo‘shlig‘i (nuqsoni) yaqqol namoyon bo‘lmoqda?","o":["Boshqaruv faoliyatida kelgusi rivojlanish bosqichlarini to‘liq ko‘ra bilmaslikda namoyon bo‘ladigan strategik bo‘shliq","Boshqaruv faoliyatida vakolatlarni o‘z vaqtida va adolatli taqsimlay olmaslikda namoyon bo‘ladigan avtoritarizm va bosim","Boshqaruv faoliyatida topshiriqlarni ko‘r-ko‘rona va yuzaki ijro etishda namoyon bo‘ladigan formalizm va rasmiyatchilik","Boshqaruv faoliyatida jamoaning emotsional holati hamda ehtiyojini anglamaslikda namoyon bo‘ladigan sovuqqonlik"],"a":2},{"q":"Maktab direktori muassasani rivojlantirish va ta’lim sifatini oshirish bo‘yicha muhim strategik qarorlar qabul qilish jarayonida soha mutaxassislaridan iborat ekspert guruhi fikrini oldi. Ushbu amaliyot rahbar faoliyatida eng avvalo qaysi maqsadga xizmat qiladi?","o":["Boshqaruv jarayonida adolatni ta’minlash uchun ma’muriy va ishchanlik muhitini saqlash","Boshqaruv jarayonida intizomni kuchaytirish uchun me’yoriy va ijro intizomini ta’minlash","Boshqaruv jarayonida ochiqlikni oshirish uchun monitoring va jamoat nazoratini o‘rnatish","Boshqaruv jarayonida samaradorlikka erishish uchun maslahat va hamkorlikni yo‘lga qo‘yish"],"a":3},{"q":"Kelajakda insondek fikrlash va qaror qabul qilish bilan birga, o‘zini o‘zi uzluksiz takomillashtira oladigan hamda barcha sohalarda inson aql- idrokidan ustun bo‘ladigan sun’iy intellekt turi qaysi javobda to‘g‘ri ko‘rsatilgan?","o":["Super SI","Neyro SI","Tor SI","Umumiy SI"],"a":0},{"q":"Maktabda yangi elektron jurnal tizimini joriy etish jarayonida ikki nafar tajribali o‘qituvchi o‘rtasida kelishmovchilik yuzaga keldi. Bir o‘qituvchi yangi tizim vaqtni tejashini ta’kidlasa, ikkinchisi uning qo‘shimcha yuklama keltirib chiqarayotganini aytib, yig‘ilishlarda norozilik bildira boshladi. Vaqt o‘tishi bilan bahs boshqa pedagoglarga ham ta’sir qildi, jamoada guruhlanish va o‘zaro e’tirozlar kuchaydi. Maktab direktori vaziyatni chuqur o‘rganmasdan turib, yig‘ilishda har ikki tomonni bir vaqtning o‘zida muhokamaga chaqirdi va zudlik bilan murosaga kelishni talab qildi. Natijada tomonlar o‘z pozitsiyalarida qoldi, konflikt yanada kuchaydi va jamoadagi ish muhiti yomonlashdi. Mazkur vaziyatda konfliktni samarali hal etish uchun maktab rahbari harakatlarni qaysi ketma-ketlikda amalga oshirishi lozim edi? \n1.Muqobil yechimlarni belgilash\n2.Holat bo‘yicha faktlarni aniqlash\n3.Tomonlarni tinglash\n4.Kelishuvga erishish va monitoring","o":["2 – 1 – 3 – 4","2 – 3 – 1 – 4","3 – 1 – 2 – 4","3 – 2 – 1 – 4"],"a":3},{"q":"Gospital maktabda (shifoxona huzuridagi ta’lim muassasasida) o‘quv jarayonini tashkil etish mezonlari va ularning tub mazmuniga xos bo‘lgan ta’riflarni to‘g‘ri moslashtiring.\n1.O‘quv reja va dasturlarni moslashtirish mezonlari\n2.Individual yondashish mezonlari\n3.Boladagi ehtiyojlarni e’tiborga olish mezonlari \nA) Sinovlar hajmini kamaytirish, baholashda o‘quvchining shaxsiy ishlar natijasini (portfolio) o‘rganish va erishilgan rivojlanish dinamikasini baholab borish\nB) O‘quv materiallarini qisqa 30 daqiqalik modullarga bo‘lish, asosiy mavzular ketma-ketligini tibbiy muolajalar vaqtiga ko‘ra moslashtirilgan jadvalga solish\nC) Bolaning kognitiv, ruhiy-emotsional holati hamda joriy tashxisi asosida uning faollik yuklamasini va darslar davomiyligini qayta shakllantirish\nD) Ta’lim jarayonining davolash muolajalariga xalaqit bermasligini ta’minlash, tibbiyot xodimlari bilan doimiy hamkorlik qilish va bolada kasallikka nisbatan ijobiy munosabatni shakllantirish","o":["1 – B, 2 – D, 3 – A","1 – B, 2 – C, 3 – D","1 – A, 2 – B, 3 – C","1 – C, 2 – A, 3 – D"],"a":0},{"q":"Media savodxonlikning asosiy ko‘nikmalari va ularning tub mazmuniga xos bo‘lgan ta’riflarni to‘g‘ri moslashtiring.\n1.Estetik va kreativ ko‘nikma\n2.Interfaollik ko‘nikmasi\n3.Tanqidiy tahlil ko‘nikmasi \nA) Ota-onalar va jamoatchilik bilan elektron tizimlar orqali avtomatik tarzda xabar hamda ma’lumot almashish\nB) Media kontentlarini va axborot oqimini tahliliy vositalar orqali mazmunli, mantiqiy va xolis talqin qilish\nC) Media muhiti orqali faol muloqotga kirishish, o‘zaro hamkorlik qilish hamda turli media rollarini bajarish\nD) Media mahsulotlarini ijodiy jihatdan idrok etish, ularni mustaqil yaratish va badiiy-vizual shaklda talqin etish","o":["1 – C, 2 – D, 3 – A","1 – B, 2 – D, 3 – C","1 – D, 2 – C, 3 – B","1 – A, 2 – B, 3 – C"],"a":2},{"q":"Ingliz tili o‘qituvchisi dars jarayonida zamonaviy pedagogik va axborot- kommunikatsiya texnologiyalaridan, interaktiv metodlardan unumli foydalangan holda mashg‘ulotlarni tashkil etmoqda. Ushbu holat pedagoglar faoliyatini baholashning qaysi mezoniga muvofiq baholanadi?","o":["Dars mashg‘ulotlarini interaktiv usullar va AKT bilan tashkil etishni ifodalovchi kasbiy bilim va kompetensiyasi","Dars mashg‘ulotlarida va faoliyatda mehnat intizomi hamda odob normalarini ifodalovchi kasbiy etika va intizomi","Dars mashg‘ulotlarida o‘quvchilarning o‘zlashtirish va bilim darajasini ifodalovchi o‘quv-tarbiya natijadorligi","Dars mashg‘ulotlaridan tashqari tashabbuskorlik hamda amaliy faollikni ifodalovchi ijtimoiy-pedagogik faolligi"],"a":0},{"q":"Zamonaviy ta’lim tizimining kamchiliklarini izohlari bilan moslashtiring\n1.Ijtimoiy o‘zaro ma’suliyatning etishmasligi\n2.Chalg’ish imkoniyati\n3.o‘quvchilar ezlyatsiya qilinishi\nA)Kam motivatsiyaga ega o‘quvchilar diqqatini o‘qishdan ko‘ra boshqa faoliyatga ham qaratadi va o‘qish jarayonida chetlashadi\nB)o‘quvchilar tashqi dunyodan uzilib o‘zlarini yolg’iz ajralilgan his qiladi ularning olgan bilimi o‘quvchining bilimigagina bog’liq bo‘ladi\nC)onlayin o‘quv kurslari o‘z-o‘zini o‘tkazilganligi o‘quvchilarning tengdoshlari bilan muloqotni cheklab ijtimoiy ko‘nikmalarni rivojlantirishini qiyinlashtiradi\nD)O‘quvchilarni qiziqishini va bilimini oshirish uchun o‘qituvchilarni jalb etgan holda faqat nazariy mashg’ulotlarni o‘zlashtiradi","o":["1-D.2-A.3-C","1-C.2-B.3-D","1-A.2-C.3-D","1-C.2-A.3-B"],"a":3},{"q":"Savol: Sun’iy intellektga asoslangan vizualizatsiya va grafik yaratish vositalari hamda ularning o‘ziga xos xususiyatlarini to‘g‘ri moslashtiring.\n1.Midjourney\n2.Napkin AI\nA) San-Fransisko (AQSh) - yuqori sifatli fotorealistik va badiiy tasvirlar, murakkab rang-barang dizaynlar va keng stilistik diapazon taqdim etuvchi hamda pullik obuna talab qiluvchi platforma\nB) Kaliforniya (AQSh) - avtomatik ravishda diagramma, sxema va infografikalar yaratib, matnli g‘oyalarni taqdimot hamda hujjatlar uchun qisqa, aniq vizual shaklga o‘tkazuvchi platforma\nC) Nyu-York (AQSh) - matnlarni avtomatik ravishda ko‘p tilli audio va videolarga o‘giruvchi hamda virtual muloqotchi obrazlarini yaratuvchi interaktiv platforma","o":["1 – C, 2 – B","1 – A, 2 – C","1 – B, 2 – A","1 – A, 2 – B"],"a":3},{"q":"Maktab direktori o‘zini har tomonlama mukammal rahbar deb hisoblar edi. Biroq so‘nggi vaqtlarda jamoa hamda xodimlar orasida rahbar faoliyatiga nisbatan yashirin va ochiq salbiy fikrlar sezila boshladi. O‘zidagi kamchiliklarni xolis aniqlab, o‘z ustida ishlash uchun rahbar eng avvalo qaysi baholash usulini tanlashi to‘g‘ri bo‘ladi?","o":["360 darajali baholash","O‘zini o‘zi tahlil qilish","Individual refleksiya","Tashqi ma’muriy audit"],"a":0}]}];
const SECONDS = 120;
const MIX_COUNT = 20;
let QUESTIONS = [];
/* ==================================================================== */

const $ = id => document.getElementById(id);
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

let order = [], idx = 0, score = 0, answers = [], timerId = null, left = SECONDS, userName = "";

let choice = 0;
const tbox = $("tests");
function renderTests(){
  tbox.innerHTML = "";
  BANK.forEach((t,i) => addT(t.name, t.qs.length + " ta savol", i));
  addT("🔀 Aralash test", MIX_COUNT + " ta tasodifiy savol (barcha testlardan)", "mix", true);
}
function addT(title, sub, val, wide){
  const b = document.createElement("button");
  b.className = "tbtn" + (wide ? " wide" : "") + (choice === val ? " on" : "");
  b.innerHTML = "<span></span><small></small>";
  b.children[0].textContent = title; b.children[1].textContent = sub;
  b.onclick = () => { choice = val; renderTests(); updStats(); };
  tbox.appendChild(b);
}
function updStats(){ $("sQ").textContent = choice === "mix" ? MIX_COUNT : BANK[choice].qs.length; }
$("sT").textContent = SECONDS / 60;
renderTests(); updStats();
const nameInput = $("name");
try {
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) nameInput.value = [u.first_name, u.last_name].filter(Boolean).join(" ");
} catch(e){}
const checkName = () => $("go").disabled = nameInput.value.trim().length < 2;
nameInput.addEventListener("input", checkName); checkName();

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ["start","quiz","result"].forEach(s => $(s).classList.toggle("hidden", s!==id)); window.scrollTo(0,0); }

$("go").onclick = () => {
  userName = nameInput.value.trim();
  if (choice === "mix") {
    QUESTIONS = shuffle(BANK.flatMap(t => t.qs)).slice(0, MIX_COUNT);
  } else {
    QUESTIONS = BANK[choice].qs;
  }
  order = shuffle(QUESTIONS.map((_,i)=>i)); idx = 0; score = 0; answers = [];
  show("quiz"); renderQ();
};

function renderQ(){
  const Q = QUESTIONS[order[idx]];
  $("count").textContent = `Savol ${idx+1} / ${QUESTIONS.length}`;
  $("prog").style.width = (idx / QUESTIONS.length * 100) + "%";
  $("qText").textContent = Q.q;
  $("note").className = "note hidden";
  $("next").classList.add("hidden");
  const box = $("opts"); box.innerHTML = "";
  Q.o.forEach((t,i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="l">${"ABCD"[i]}</span><span></span>`;
    b.lastChild.textContent = t;
    b.onclick = () => pick(i);
    box.appendChild(b);
  });
  startTimer();
}

function startTimer(){
  clearInterval(timerId); left = SECONDS; paint();
  timerId = setInterval(() => { left--; paint(); if (left <= 0) pick(-1); }, 1000);
}
function paint(){
  const t = $("timer");
  const L = Math.max(left,0);
  t.textContent = String(Math.floor(L/60)).padStart(2,"0") + ":" + String(L%60).padStart(2,"0");
  t.classList.toggle("low", left <= 10);
}

function pick(i){
  clearInterval(timerId);
  const Q = QUESTIONS[order[idx]];
  const btns = [...$("opts").children];
  btns.forEach(b => b.disabled = true);
  btns[Q.a].classList.add("ok");
  const right = i === Q.a;
  if (!right && i >= 0) btns[i].classList.add("bad");
  if (right) score++;
  answers.push({ q: Q.q, your: i >= 0 ? Q.o[i] : "Vaqt tugadi", correct: Q.o[Q.a], right });
  const n = $("note");
  n.className = "note " + (right ? "ok" : "bad");
  n.textContent = right ? "✅ To‘g‘ri!" : (i < 0 ? "⏰ Vaqt tugadi. " : "❌ Noto‘g‘ri. ") + (right ? "" : "To‘g‘ri javob: " + "ABCD"[Q.a] + ") " + Q.o[Q.a]);
  if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred(right ? "success" : "error"); } catch(e){} }
  const nx = $("next");
  nx.textContent = idx === QUESTIONS.length - 1 ? "Natijani ko‘rish" : "Keyingi savol";
  nx.classList.remove("hidden");
}

$("next").onclick = () => { idx++; idx < QUESTIONS.length ? renderQ() : finish(); };

function finish(){
  show("result");
  const total = QUESTIONS.length, pct = Math.round(score/total*100);
  $("rTitle").textContent = pct >= 80 ? "Ajoyib natija! 🏆" : pct >= 50 ? "Yaxshi natija 👍" : "Yana mashq qiling 💪";
  $("rName").textContent = userName;
  $("rTest").textContent = choice === "mix" ? "Aralash test" : BANK[choice].name;
  $("rScore").textContent = `${score}/${total}`;
  const col = pct >= 80 ? "#16a34a" : pct >= 50 ? "#2563eb" : "#dc2626";
  $("ring").style.background = `conic-gradient(${col} ${pct*3.6}deg, #e2e8f0 0)`;
  $("rMsg").textContent = `Siz ${pct}% natija ko‘rsatdingiz.`;
  const wrong = answers.filter(a => !a.right);
  const rv = $("review"); rv.innerHTML = "";
  if (wrong.length) {
    const h = document.createElement("h2"); h.textContent = "Xatolar ustida ishlash"; h.style.fontSize = "17px"; h.style.marginBottom = "4px";
    rv.appendChild(h);
    wrong.forEach(a => {
      const d = document.createElement("div"); d.className = "ri";
      d.innerHTML = `<b></b><div class="y"></div><div class="c"></div>`;
      d.children[0].textContent = a.q.length > 220 ? a.q.slice(0,220) + "…" : a.q;
      d.children[1].textContent = "Sizning javobingiz: " + a.your;
      d.children[2].textContent = "To‘g‘ri javob: " + a.correct;
      rv.appendChild(d);
    });
  }
}

$("again").onclick = () => show("start");
$("quit").onclick = () => { clearInterval(timerId); show("start"); };
</script>
</body>
</html>
