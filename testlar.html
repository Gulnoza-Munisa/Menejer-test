iz","2030-yilgacha hududdagi eng ilg‘or maktablardan biriga aylanishni rejalashtiramiz"],"a":1},{"q":"Moliyaviy boshqaruvning asosiy tamoyillari qaysi javobda to‘g‘ri va to‘liq keltirilgan?","o":["Qonuniylik va me’yoriylik, maqsadli sarflash, shaffoflik va hisobdorlik, samaradorlik, riskka sezgir boshqaruv","Rejalilik, moliyaviy intizom, hujjatlashtirish, tejamkorlik va nazorat","Me’yoriylik, markazlashuv, nazorat, iqtisodiylik va audit tizimi","Qonuniylik, tezkorlik, tejamkorlik, joriy nazorat va hisobotlilik"],"a":0},{"q":"Maktabda “har bir o‘quvchi hurmatga loyiq”, “xatolar jazolash uchun emas, o‘rganish uchun” degan tamoyillar asosida ishonchli muhit yaratildi. Ushbu holat inklyuziv ta’limning qaysi ijtimoiy ta’sir yo‘nalishini ifodalaydi?","o":["Differensial nazoratning kuchayishini","Intizomiy talablarning qat’iylashishini","O‘quvchilarni natijaga qarab saralashni","Inklyuziv madaniyatning qaror topishini"],"a":3},{"q":"Maktabda turli ijtimoiy sharoit, xulq-atvor va emotsional holatga ega o‘quvchilarning birgalikda ta’lim olayotgani natijasida o‘quvchilar va ota- onalarda “farqlilik - bu tabiiy holat” degan qarash shakllanmoqda. Ushbu holat inklyuziv ta’limning qaysi ijtimoiy ta’sirini eng to‘g‘ri ifodalaydi?","o":["Insonparvarlik tafakkurining shakllanishi","O‘quvchilarni psixologik jihatdan saralash zarurati","Ta’lim jarayonida yagona talablarning ustuvorligi","Ijtimoiy nazorat mexanizmlarining kuchayishi"],"a":0},{"q":"Ta’lim muassasasining mavjud Telegram kanali uchun QR kod yaratish ketma-ketligi bo‘yicha berilgan javobni aniqlang.","o":["Kanal havolasini matn ko‘rinishida yuborish, generator saytida fayl tanlash, QR kodni skanerlab tekshirish, keyin yuklab olish","QR kod generator saytiga kirish, rasm yuklash, kanal nomini yozish, rang tanlash, kodni saqlash","Kanal havolasini nusxalash, QR kod generator saytiga kirish, URL bo‘limiga havolani kiritish, hosil bo‘lgan QR kod dizaynini sozlash, tayyor QR kodni yuklab olish","Telegram kanalining nomini kiritish, rasm tanlash, QR kodni qo‘lda chizish, faylni saqlash, havolani keyin qo‘shish"],"a":2},{"q":"Direktor o‘z ish kunining birinchi 90 daqiqasini strategik rejalashtirish va o‘qituvchilarni murabbiylik qilishga ajratdi, kutilmagan telefon qo‘ng‘iroqlari va majlislardan uzoq turdi. Ushbu faoliyat qaysi samaradorlik tamoyiliga mos keladi?","o":["Chuqur ishlash tamoyili","Operativ boshqaruv tamoyili","Delegatsiya tamoyili","Teskari aloqa tamoyili"],"a":0},{"q":"Pedagogik xodimlarni baholashda quyidagi mezonlardan qaysi biri ichki tartib qoidalariga rioya qilish hamda pedagogik odob-axloq normalariga moslikni o‘lchaydi?","o":["Jamoatchilik bilan aloqalar samaradorligi","Kasbiy etika va intizom","Metodik mahorat va innovatsion yondashuv","Ta’lim natijalarining monitoringi va tahlili"],"a":1},{"q":"Qaysi tamoyil qarorlarning tahlil va dalillarga asoslanishini talab etadi?","o":["Izchillik","Tejamkorlik","Ilmiylik","Adolatlilik"],"a":2},{"q":"Yangi baholash tizimida formativ baholash qanday maqsadda qo‘llaniladi?","o":["O‘quvchi xatosini aniqlab, uni tuzatishga yo‘naltirish uchun","O‘quvchini yakuniy baholash natijasiga tayyorlash uchun","Choraklik natijalarni rasmiylashtirishni tezlashtirish uchun","O‘quvchilarni o‘zaro solishtirish va saralash uchun"],"a":0},{"q":"Kasbiy rivojlanish kuni tadbirlarini tashkil qilishda qanday ta’lim shakllaridan foydalaniladi?","o":["Auditoriya mashg‘ulotlari, laboratoriya ishlari, sinfdan tashqari tadbirlar va seminarlar","Mustaqil ta’lim, nazariy mashg‘ulotlar, amaliy kuzatuv va yakuniy nazorat","Kunduzgi ta’lim, sirtqi ta’lim, oilaviy ta’lim va eksternat shakli","Masofaviy ta’lim, ishlab chiqarishdan ajralgan holda ta’lim olish, dual ta’lim va mustaqil ta’lim"],"a":3},{"q":"Kasb tushunchasini tavsiflovchi asosiy tamoyillar qaysi javobda to‘liq va to‘g‘ri belgilangan?","o":["Kasb mehnat qilish, topshiriq bajarish, nazorat va hisobdorlik bilan belgilanadi","Kasb asosan tajriba, buyruqbozlik, ijro va bo‘ysunishga asoslanadi","Kasb faqat malaka oshirishni, intizomni, nazoratni va daromad olishni talab etadi","Kasb tarixiylikni, qonuniylikni, foyda keltirishni, ixtiyoriylikni talab etadi va faoliyat turi boshqasidan farqlanishi zarur"],"a":3},{"q":"Missiya asosan qaysi savolga javob beradi?","o":["Biz qanday nazorat qilamiz?","Biz qayerga erishmoqchimiz?","Biz qachon natijaga chiqamiz?","Biz nimaga mavjudmiz?"],"a":3},{"q":"Sumativ baholashda qatnashmagan o‘quvchilar qayta topshirishdan uning ballari qayd etiladigan holatni aniqlang.","o":["Respublika miqyosidagi tanlovda qatnashganligi sababli kelmagan bo‘lsa","Uy vazifasini bajarmagani uchun kiritilmagan bo‘lsa","Darsga kechikib kelgani sababli qatnashmagan bo‘lsa","Sinfdoshlaridan ko‘chirishga uringani uchun chiqarilgan bo‘lsa"],"a":0}]},{"name":"3-TEST","qs":[{"q":"Zamonaviy ta’lim tizimida CPD kasbiy rivojlanishning o‘rni to‘g‘ri ifodalangan javob variantini aniqlang.","o":["O‘qituvchiga ko‘proq tashkiliy topshiriqlarni bajarish, o‘quv jarayonini nazorat qilish va pedagogik faoliyatni ma’muriy boshqarishga yo‘naltiradi","O‘qituvchiga dars jarayonida belgilangan mavzularni qayta tushuntirish, mavjud usullarni saqlash va baholash natijalarini umumlashtirishga yordam beradi","O‘qituvchiga o‘quvchilarning individual ehtiyojlariga mos metodlarni tanlash, muammolarni hal qilish va yangi yondashuvlarni amaliyotga joriy etish imkonini beradi","O‘qituvchiga asosan hisobotlarni to‘ldirish, hujjatlar bilan ishlash va ichki nazorat talablariga moslashish bo‘yicha tajribani kuchaytiradi"],"a":2},{"q":"Moslashtiring.\n1.Jarayon yondashuvi\n2.Dalilga asoslangan boshqaruv\n3.Doimiy takomillashtirish\nA) “Menimcha” emas, monitoring, diagnostika va ko‘rsatkichlar asosida qaror qabul qilish\nB) Natija jarayonlardan kelib chiqadi: dars sifati, baholash, tarbiya muhiti va resurslar bilan bog‘liq bo‘ladi\nC) Har chorak va yil yakunida kamchiliklarni tahlil qilib, aniq chora- tadbirlarni belgilash\nD) Ta’lim jarayonida vazifalarni umumiy tarzda taqsimlab, ijro intizomini kuzatib borish","o":["1-C, 2-A, 3-B","1-B, 2-A, 3-C","1-B, 2-C, 3-D","1-A, 2-B, 3-D"],"a":1},{"q":"Moslashtiring.\n1.Prezident farmonlari va qarorlari\n2.Vazirlar Mahkamasi qarorlari\n3.Maktabgacha va maktab ta’limi vazirligi buyruqlari\nA) Ta’lim tizimini isloh qilish, rahbar kadrlar mas’uliyatini oshirish, ta’lim samaradorligini yuksaltirish\nB) Hududiy boshqaruv organlari vakolatlari, moliyalashtirish tartibi va hisobot mexanizmlarini belgilash\nC) Maktab faoliyatini tashkil etish, o‘quv yuklamalari, boshqaruv tuzilmasi, nazorat va monitoringni belgilash\nD) Direktor va o‘rinbosarlar vazifalari, ichki nazorat, hujjat yuritish, pedagoglar faoliyatini baholash","o":["1-A, 2-C, 3-D","1-C, 2-A, 3-D","1-B, 2-C, 3-D","1-A, 2-D, 3-C"],"a":0},{"q":"Maktab direktorining ishga qabul jarayonida ochiq darslar va mentorlar ishtiroki mavjud. Bu yondashuv qaysi HR strategiyasini belgilaydi?","o":["Ma’muriy hujjatlashtirish yondashuvi","Strategik HR boshqaruvi","Operativ nazorat boshqaruvi","Moliyaviy rag‘batlantirish strategiyasi"],"a":1},{"q":"Maktabda tabiiy fanlardan o‘zlashtirish ko‘rsatkichlari pasaygani kuzatildi. Rahbar tezkor yig‘ilish o‘tkazib, mavjud vaziyatni muhokama qildi va fan o‘qituvchilarining dars jarayonini kuchaytirish hamda ichki nazoratni qat’iylashtirish bo‘yicha qaror qabul qildi. Qarorga muvofiq qo‘shimcha hisobotlar joriy etildi va o‘quvchilarga qo‘shimcha vazifalar yuklatildi. Biroq o‘quvchilarning laboratoriya jihozlari yetishmasligi, o‘quv materiallarining eskirgani va dars yuklamasining ortgani masalalari chuqur o‘rganilmadi. Pedagogik kengash bilan masala keng qamrovda muhokama qilinmadi. Oradan bir necha oy o‘tib, o‘zlashtirish ko‘rsatkichlarida sezilarli o‘zgarish kuzatilmadi. O‘qituvchilar qo‘shimcha nazorat muammoni hal qilmayotganini bildirdi. Kuzatuv kengashi vaziyatni qayta ko‘rib chiqishni tavsiya etdi. Savol: mazkur vaziyatda boshqaruv jarayonining qaysi bo‘g‘inida jiddiy kamchilikka yo‘l qo‘yilgan?","o":["Boshqaruv qarorini qabul qilish va bajarilishini tashkil etishda muammo yetarlicha aniqlanmagan","O‘quvchilarga qo‘shimcha topshiriqlar berish va o‘qituvchilardan natijadorlik talab qilish jarayoni izchil tashkil etilmagan","Nazorat mexanizmlarini kuchaytirish va hisobotlarni yuritish bosqichi yetarli darajada tashkil etilmagan","Qaror ijrosini muddatlar asosida muvofiqlashtirish va mas’ullar faoliyatini baholash bosqichi sust olib borilgan"],"a":0},{"q":"Ijtimoiy tarmoqlarda maktabga oid bahsli holat yuzasidan tasdiqlanmagan salbiy axborot tarqaldi. Rahbariyat vaziyatni ichki tartibda o‘rganishga vaqt ajratib, bir necha kun rasmiy munosabat bildirmadi. Shu vaqt ichida mish- mishlar kuchaydi, ota-onalar orasida ishonchsizlik paydo bo‘ldi. Keyinchalik axborot noto‘g‘ri talqin qilingani aniqlandi. Kelgusida bunday holatlar maktab imijiga salbiy ta’sir ko‘rsatmasligi uchun eng asosli va samarali yondashuvni aniqlang.","o":["Vaziyatni pedagogik kengash va ota-onalar yig‘ilishida ko‘rib chiqib, ijtimoiy tarmoqlarda rasmiy munosabatni kechiktirib berish","Bahsli axborotlarni dastlab ichki muhokamada saqlab, vaziyat to‘liq oydinlashgach cheklangan doirada rasmiy izoh berish","Inqirozli vaziyatlarda tezkor, aniq va ochiq shaklda rasmiy pozitsiya bildirish, axborot tashabbusini o‘z qo‘liga olish","Salbiy munosabatlarga javob bermasdan, ijtimoiy tarmoqlardagi faollikni vaqtincha kamaytirib, keyinchalik umumiy ma’lumot bilan chiqish"],"a":2},{"q":"Direktor o‘zini mukammal rahbar deb hisoblar edi. Biroq so‘nggi vaqtlarda xodimlarning rahbar faoliyati haqidagi salbiy fikrlari sezila boshladi. Direktor o‘z kamchiliklarini aniqlab, ularni tuzatmoqchi bo‘ldi.\nSavol: Direktor o‘z faoliyatini xolis baholash uchun qaysi yo‘lni tanlagani maqsadga muvofiq?","o":["360 daraja baholash","Refleksiya","O‘zini o‘zi tahlil qilish","Ichki nazoratni kuchaytirish"],"a":0},{"q":"Umumiy o‘rta ta’lim maktabida o‘quvchilarning chorak yakunlari bo‘yicha belgilangan ko‘rsatkichlari kutilgan natijaga erishilmadi. Maktab rahbari ushbu holatni tahlil qilib, ichki monitoring natijalari, pedagoglar fikri va o‘quvchilar ehtiyojlarini o‘rgandi. Bir nechta muqobil yechimlar ishlab chiqildi va ular pedagogik kengashda muhokama qilindi. Qabul qilingan qaror ijrosi uchun aniq muddatlar belgilandi, mas’ul ijrochilar ko‘rsatildi hamda nazorat va baholash mexanizmlari rejalashtirildi. Ushbu vaziyatda maktab rahbari tomonidan qabul qilingan qarorning eng aniq ilmiy boshqaruv tavsifi to‘g‘ri ko‘rsatilgan javob variantini aniqlang.","o":["Bu ma’muriy topshiriqlarni tezkor taqsimlashga asoslangan, ichki nazorat ustuvor qo‘yilgan va ijro intizomini kuchaytirishga qaratilgan boshqaruv qaroridir","Bu tashkiliy jarayonlarni umumiy tartibga solishga yo‘naltirilgan, hujjatlar ijrosini nazorat qiluvchi va ichki muvofiqlashtirishni kuchaytiruvchi boshqaruv qaroridir","Bu natijalarni qisqa muddatda yaxshilashga qaratilgan, pedagoglar faoliyatini qayta taqsimlaydigan va operativ boshqaruv vositalariga tayangan qarordir","Bu pedagogik maqsadga yo‘naltirilgan, jamoaviy muhokamaga tayangan va qaror qabul qilish jarayonining asosiy bosqichlari ishtirok etgan boshqaruv qaroridir"],"a":3},{"q":"Direktor yangi qonun qabul qilinganidan keyin tashkilot faoliyatida xatoliklarga yo‘l qo‘ymaslikni xohlaydi. U qonun va qarorlarni muntazam o‘rganish hamda amaldagi tahrirlarni kuzatishni rejalashtirmoqda. Bunda qaysi yo‘l uning huquqiy savodxonligini oshirishga eng mos keladi?","o":["Ichki hujjatlar sonini muntazam ravishda ko‘paytirib borish","Tashkilotda nazorat tadbirlarini keskin kuchaytirib borish","Joriy davrning huquqiy bilimlarini yangilab borish","Barcha qarorlarni faqat yuqori organlarga yuborib tasdiqlatish"],"a":2},{"q":"Ingliz tili o‘qituvchisi xalqaro ta’limiy tadqiqotda ishtirok etdi. Tadqiqot davomida o‘rgangan zamonaviy yondashuv va metodik tavsiyalarni keyinchalik o‘z dars faoliyatida qo‘llay boshladi.\nSavol: Ushbu holat o‘qituvchining qaysi faoliyat yo‘nalishiga mos keladi?","o":["Boshqaruv faoliyati","Reflektiv tahlil bloki","O‘quv natijalari indikatori","Ilmiy-metodik faoliyat"],"a":3},{"q":"Moslashtiring.\n1.Emotsional beqaror bolalar\n2.Deviant xulqli bolalar\n3.Iqtidorli bolalar \nA) Barqaror psixologik muhit yaratish\nB) Mustaqil va tanqidiy fikrlashni rivojlantirish\nC) Individual ta’lim yo‘nalishlarini bosqichma-bosqich kuchaytirish\nD) Psixologik va ijtimoiy profilaktika","o":["1-B, 2-D, 3-A","1-D, 2-A, 3-B","1-A, 2-D, 3-B","1-A, 2-B, 3-C"],"a":2},{"q":"Maktabda yangi raqamli platforma joriy qilindi. Maqsad - o‘quvchilar va o‘qituvchilar faoliyatini onlayn nazorat qilish va tahlil qilish. Rahbar platformaning izchil ishlashini ta’minlash uchun trening tashkil qildi, mas’ullar tayinlandi va dastlabki ma’lumotlar yuklandi. Biroq bir necha oy o‘tib, platforma foydalanuvchilari texnik yordam va yo‘riqnomalarga ehtiyoj sezgani, ayrim ma’lumotlar noto‘g‘ri kiritilgani, jamoada kamchiliklar yuzaga kelgani va platforma samarasi pasaygani aniqlandi. Rahbar tizimdan kelayotgan ma’lumotlarni tahlil qilish va tuzatish bo‘yicha yetarli ish olib bormagan. Ushbu vaziyatda qaysi bosqich yetarli darajada amalga oshirilmagan?","o":["Qo‘llab-quvvatlash va o‘qitish bosqichi yetarli darajada amalga oshirilmagan","Vazifalarni taqsimlash va ijro intizomini nazorat qilish bosqichi yetarli darajada amalga oshirilmagan","Dastlabki rejalashtirish va texnik tanlov bosqichi yetarli darajada amalga oshirilmagan","Platformani ishga tushirish va boshlang‘ich ma’lumotlarni yuklash bosqichi yetarli darajada amalga oshirilmagan"],"a":0},{"q":"Moslashtiring.\n1.Qoida buzarlikni aniqlash\n2.Tushuntirish xatini olish\n3.Holatni tahlil qilish\n4.Intizomiy jazo qo‘llash \nA) Xodimdan yozma tushuntirish talab qilish, rad etilgan taqdirda dalolatnoma tuziladi\nB) Qoida buzarlik og‘irligini, oldingi holatlarni va xizmat faoliyatini tahlil qilish\nC) Dalolatnoma tuzish va guvohlar ko‘rsatmasini olish\nD) Intizomiy chorani tanlash va me’yoriy asoslarga tayangan holda rasmiylashtirish\nE) Xodim buyruq bilan tanishtiriladi","o":["1-B, 2-A, 3-C, 4-D","1-C, 2-A, 3-B, 4-E","1-A, 2-C, 3-B, 4-D","1-C, 2-B, 3-A, 4-E"],"a":1},{"q":"Moslashtiring.\n1.Shaxs tarbiyasidagi nuqsonlar\n2.Yoshlar o‘rtasidagi deviant xulq-atvor\n3.Ijtimoiy tengsizlik \nA) Huquqbuzarlik, zo‘ravonlik, giyohvandlik va internetga qaramlik kuchayadi\nB) Yoshlarning ta’lim natijalari pastlab, kasbiy yo‘nalishga qiziqishi susayadi\nC) Mas’uliyat, ijtimoiy faollik va axloqiy me’yorlar yetarli shakllanmaydi\nD) Sifatli ta’limdan chetda qolgan yoshlar jamiyatda faol bo‘la olmaydi","o":["1-A, 2-C, 3-B","1-C, 2-A, 3-D","1-C, 2-B, 3-D","1-D, 2-A, 3-C"],"a":1},{"q":"Maktab direktori tarix o‘qituvchisining darsini kuzatdi. Kuzatuv davomida o‘quvchilar intizomli bo‘lishiga qaramay, savol-javoblar yuzaki o‘tkazilganini, darsning asosiy qismi monolog tarzida tashkil etilganini\nko‘rdi. Dars tugagach, direktor o‘qituvchiga qisqa og‘zaki mulohaza bildirdi:\n“Hammasi yaxshi, faqat darsni jonlantiring, yana-da rivojlantiring”. O‘qituvchi bu fikrdan keyin nimani jonlantirishi, nimaning ustida ishlash kerakligini tushunmadi. Natijada kuzatuv natijalari o‘qituvchiga amaliy foyda bermadi. U o‘zini rivojlantirish yo‘lida aniq yo‘nalishni bilmay qoldi.\nSavol: Bu vaziyatda maktab direktori o‘qituvchining faoliyatini rivojlantirish va samarali baholash tizimini mustahkamlash uchun qanday yondashuvni qo‘llashi kerak?","o":["Davlat ta’lim standartlariga asoslangan mezonlar orqali darsni tahlil qilib, SWOT asosida kuchli va zaif tomonlarga aniq konstruktiv fikr-mulohaza berish","Dars yuzasidan umumiy tavsiyalar berib, keyingi kuzatuvgacha o‘qituvchidan mustaqil ravishda usullarni yangilashni kutish va natijani keyinroq umumiy tarzda baholash","Darsni qayta kuzatishdan oldin o‘qituvchiga namunaviy ishlanmalar yuborib, keyingi safar faollik, tartib va savol-javoblarni umumiy mezonlar asosida og‘zaki baholash","O‘qituvchining dars jarayonidagi kamchiliklarini pedagogik kengashda muhokama qilib, ularga mos umumiy metodik tavsiyalar ishlab chiqish va jamoaviy nazoratni kuchaytirish"],"a":0},{"q":"Maktab direktori ish rejasini strategik, taktik va operatsion darajaga bo‘ladi. Ushbu yondashuv qaysi boshqaruv prinsipiga mos keladi?","o":["Vazifalarni tasodifiy taqsimlash","Tashkiliy nazoratni kuchaytirish","Ichki hujjatlar aylanishini tezlashtirish","Vaqt va resurslarni boshqarish hamda rejalashtirish"],"a":3},{"q":"Ta’lim-tarbiya jarayonlaridagi kamchiliklar yoshlar va jamiyatda qanday siyosiy xavf-xatarlarga olib keladi? Moslashtiring.\n1.Fuqarolik ongining sust rivojlanishi\n2.Radikal va zararli g‘oyalarga moyillik\n3.Davlat boshqaruvi uchun kadrlar salohiyatining pasayishi \nA) Yoshlar ekstremistik, radikal va buzg‘unchi g‘oyalarga moyil bo‘ladi\nB) Yoshlarda jamiyat hayotiga nisbatan mas’uliyat hissi pasayib boradi\nC) Kelajakda malakali kadrlar yetishmasligi yuzaga keladi\nD) Yoshlar huquq va majburiyatlarini anglamaydi, siyosiy jarayonlarga befarq bo‘ladi","o":["1-A, 2-B, 3-D","1-D, 2-A, 3-C","1-B, 2-D, 3-C","1-D, 2-C, 3-A"],"a":1},{"q":"Maktabning yuqori sinf o‘quvchilari o‘rtasida dars qoldirish, baholarning pasayishi va ijtimoiy tadbirlarda ishtirokning kamaygani kuzatilmoqda. Maktab direktori sinf rahbarlari orqali ota-onalarni ogohlantiradi, biroq ota- onalarning ko‘pchiligi maktabdagi tadbirlarga befarq qaraydi, ba’zilari esa maktab faoliyatini tanqid qiladi, hatto chatlarda norozilik bildiradi. O‘qituvchilar esa o‘zlarini tushunilmayotgan va himoyasiz his qilmoqda. Maktab veb-saytida dars jadvali, baholar, elektron kundalik hisobotlari muntazam e’lon qilinmoqda, o‘quvchilarning ayrimlari maktabda ichki tartib qoidalarini buzmoqda, lekin ularning ota-onalari bilan samarali muloqot o‘rnatilmagan. Direktor ushbu holatga tizimli va strategik yondashmoqchi. Savol: Ushbu vaziyatda direktorning ota-onalar bilan samarali hamkorlikni tiklashi va o‘quvchilarning ijtimoiy faolligini oshirish bo‘yicha eng maqbul yechimni aniqlang.","o":["Ota-onalarni faqat rasmiy yig‘ilishlarga chaqirib, intizom buzilgan holatlar bo‘yicha ogohlantirishlar sonini oshirish, ichki nazoratni kuchaytirish va chatlardagi norozilikni cheklash","Ota-onalar uchun ochiq eshiklar va ochiq muloqot kunlari, seminar va treninglar tashkil qilish, ularning qiziqishini oshirish, media sohasini faollashtirish va ijtimoiy hamkorlikni kuchaytirish","O‘quvchilar faolligini oshirish maqsadida sinf rahbarlariga qo‘shimcha topshiriqlar berish, ota-onalar bilan yozma aloqa olib borish va maktab saytida e’lonlar sonini ko‘paytirish","Maktabdagi tartibni kuchaytirish, ota-onalardan yozma majburiyatnomalar olish, o‘quvchilarning bo‘sh vaqtini to‘liq nazorat qilish va tadbirlarda majburiy ishtirokni joriy etish"],"a":1},{"q":"Moslashtiring.\n1.Ijtimoiy tafakkur barqarorligi\n2.Insonparvar tafakkurning shakllanishi\n3.Inklyuziv madaniyatni qaror toptirish \nA) Ta’limdagi xilma-xillikni tabiiy va ijobiy hodisa sifatida qabul qilish\nB) Farqlilikni inkor etuvchi radikal va totalitar qarashlarga nisbatan ijtimoiy immunitetni shakllantirish\nC) Ishonch, xavfsizlik va o‘zaro hurmatga asoslangan muhitni rivojlantirish\nD) O‘quvchilarda jamiyatga moslashuv va ijtimoiy hamkorlik ko‘nikmalarini rivojlantirish","o":["1-A, 2-C, 3-B","1-C, 2-B, 3-D","1-B, 2-A, 3-C","1-B, 2-D, 3-A"],"a":2},{"q":"Moslashtiring.\n1.Ijtimoiy o‘zaro ta’sirning yetishmasligi\n2.Chalg‘itish imkoniyati\n3.O‘quvchilarning izolyatsiya qilinishi \nA) Kam motivatsiyaga ega o‘quvchilar diqqatini o‘qishdan ko‘ra boshqa faoliyatga qaratib, o‘quv jarayonidan chetlashadi\nB) O‘quvchilar tashqi dunyodan uzilib, o‘zlarini yolg‘iz va ajratilgan his qiladi, olgan bilimi o‘qituvchi bilimigagina bog‘liq bo‘lib qoladi\nC) Onlayn o‘quv kurslari yakka tartibda o‘tilgani sabab o‘quvchilarning tengdoshlari bilan muloqoti cheklanib, ijtimoiy ko‘nikmalar rivoji qiyinlashadi\nD) O‘quvchilarda bilimlarni baholash jarayoni sustlashib, nazorat mexanizmlari samarasizlashadi","o":["1-C, 2-B, 3-D","1-C, 2-A, 3-B","1-B, 2-C, 3-A","1-A, 2-B, 3-C"],"a":1},{"q":"Bugungi kunda 102-umumiy o‘rta ta’lim maktabida direktor Nargiza Anvarova ta’lim jarayonini raqamlashtirish va boshqaruv samaradorligini oshirish maqsadida o‘quvchilar va sinf rahbarlari bilan yig‘ilish o‘tkazdi. Yig‘ilishda e-Maktab tizimidan foydalanish sifati pastligi, statistik hisobotlar noto‘g‘ri yuritilayotgani, ota-onalar tizimga kam kirayotgani aniqlandi. Davomat va baholash ma’lumotlari elektron jurnalga kech kiritilmoqda. Ota- onalarning tizimga kam kirishi ularning farzandlari o‘zlashtirish darajasi va uy vazifalaridan bexabar ekanini ko‘rsatmoqda. O‘quvchilarning fanlar bo‘yicha o‘zlashtirish darajasi ham muntazam tahlil qilinmayapti.\nSavol: Maktab rahbari o‘quvchilar o‘zlashtirishi va ta’lim sifati bo‘yicha qarorlar qabul qilishda e-Maktab tizimidagi qaysi hisobotlar bo‘limidan foydalanishi va qanday metodik ishlarni amalga oshirishi eng muhim hisoblanadi?","o":["Elektron platformadagi texnik kamchiliklarni aniqlash, sinf rahbarlari zimmasiga eslatma berish, kunlik ma’lumot kiritilishini talab qilish va hisobotlarni faqat ma’muriyat darajasida ko‘rib chiqish","O‘quvchilar ro‘yxatini yangilab borish, sinf rahbarlari ma’lumotlarini qayta kiritish, ota-onalarga tizimga kirish bo‘yicha umumiy eslatmalar yuborish va hisobotlarni chorak yakunida ko‘rib chiqish","Davomat bo‘yicha alohida ma’lumotlarni jamlash, fan o‘qituvchilari bilan og‘zaki suhbat o‘tkazish, ota-onalar faolligini umumiy yig‘ilishlarda muhokama qilish va jurnal yuritishni nazorat qilish","O‘quvchilarning o‘zlashtirish darajasi va baholar statistikasi bo‘yicha hisobotlarni tahlil qilish, o‘rtacha baho va fanlar kesimida o‘zlashtirish samaradorligini muntazam shakllantirish, elektron kundalik va jurnal yuritish faoliyatini kuzatib borish"],"a":3},{"q":"Sun’iy intellekt dasturlari\n1.Grok\n2.Gemini\n3.DeepSeek Vazifasi\nA) Google tomonidan yaratilgan kuchli sun’iy intellekt modeli bo‘lib, u tabiiy tilni tushunish va turli vazifalarni bajarish uchun xizmat qiladi\nB) Musk kompaniyasi tomonidan ishlab chiqarilgan sun’iy intellekt chat-boti bo‘lib, u tezkor javoblar, ijodiy matnlar, fikr-mulohazalar va suhbat uchun xizmat qiladi\nC) DeepSeek kompaniyasining sun’iy intellekt modeli bo‘lib, u matnni tushunish, yaratish va tahlil qilishga yordam beradi\nD) Anthropic kompaniyasining sun’iy intellekt modeli bo‘lib, u matnni tushunish, yaratish va tahrirlashga yordam beradi","o":["1-C, 2-A, 3-B","1-B, 2-D, 3-A","1-A, 2-C, 3-D","1-B, 2-A, 3-C"],"a":3},{"q":"Maktabda o‘quv dasturlariga yangi metodik yondashuv joriy etilishi rejalashtirildi. Maktab direktori o‘zgarish haqida buyruq chiqardi, lekin jamoa bilan muhokama o‘tkazilmadi. Ayrim o‘qituvchilarda yuklama oshishi mumkinligi haqida xavotir paydo bo‘ldi. Ba’zi tajribali pedagoglar o‘zini qadrsiz his qila boshladi. Trening va metodik yordam yetarli tashkil etilmadi, jamoada “yana bir o‘zgartirishga tashabbus” degan kayfiyat shakllandi. O‘zgarishning maqsadi va natijasi aniq tushuntirilmaganligi sababli qarshilik kuchaydi. Natijada yangilik qog‘ozda qoldi, ammo amalda sezilarli o‘zgarish bo‘lmadi. Savol: mazkur vaziyatda rahbar qaysi tamoyilni yetarli darajada amalga oshirmagan?","o":["Nazorat va hisobotlilikni kuchaytirish tamoyilini","Resurslarni markazlashgan tartibda boshqarish va muvofiqlashtirish tamoyilini","Ochiq muloqot va jamoani jarayonga jalb etish tamoyilini","Vazifalarni tezkor taqsimlash va ijro intizomini ta’minlash tamoyilini"],"a":2},{"q":"Maktab direktoriga Microsoft Exselda quyidagi jadval taqdim etildi.Ushbu ma’lumot asosida rahbar ta’lim sifati ko’rsatkichlari haqida diagramma tayyorlash uchun Exsel dasturida qanday ishlar amalga oshiriladi?\nKo’rsatkichlar:\nI chorak II chorak III chorak IV chorak Yillik\nMaktabda o’zlashtirish ko’rsatkichi:\n97% 98% 99% 98% 98% Maktabda sifat ko’rsatkichi 27% 30% 31% 28% 29%","o":["Sichqonchaning o‘ng tugmasini bosgan holda jadvaldagi barcha ma’lumotlarni belgilab, “Vstavka” menyusidagi “Rekomenduyemye diagrammy” bo‘limiga kiradi va u yerdan mos diagramma turini tanlaydi","Ko‘rsatkichlar nomini belgilab, “Razmetka stranitsy” bo‘limiga kiradi, jadval uslubini tanlaydi va grafik ko‘rinishini saqlash orqali diagramma hosil qiladi","Barcha foiz ko‘rsatkichlarini qo‘lda qayta yozib, “Fayl” menyusidan eksport funksiyasini tanlaydi va tayyor shaklni grafik ko‘rinishda chiqaradi","Jadvaldagi ma’lumotlarni alohida ustunlarga ajratib, “Glavnaya” menyusidan “Avtosumma” tugmasini bosadi va hosil bo‘lgan natijalarni diagrammaga aylantiradi"],"a":0},{"q":"Logistika markazida yangi sun’iy intellekt tizimi ishga tushirildi. Ushbu tizimning vazifasi tovarlarga QR kod qo‘yish, ularni saralash va belgilangan manzilga yo‘naltirishdan iborat.\nSavol: Mazkur sun’iy intellekt turi qanday ataladi?","o":["Tor SI","Transformatsion SI","Logistik SI","Umumiy SI"],"a":0},{"q":"Siz maktab rahbarisiz. Darsni kuzatishdan oldin sizga faqat dars mavzusi va maqsadlar ro‘yxati berildi. Dars jarayonini kuzatishda siz ularning davlat ta’lim standartlariga mos yoki mos emasligini aniqlashni xohlaysiz. Shu vaziyatda qaysi bosqich va mezon asosida xulosa chiqarish eng to‘g‘ri bo‘ladi?","o":["Kuzatuvdan keyingi umumiy suhbat","Kuzatuvdan oldingi tahlil","O‘quvchilar fikrini yakuniy o‘rganish","Dars jarayonidagi joriy nazorat"],"a":1},{"q":"Umumta’lim maktabida tashqi baholash jarayoni yaqinlashmoqda. Maktab rahbariyati ishga faqat kechiktirilgan holda yondashib, DTS va DTM talablari asosida risk nuqtalarini oldindan aniqlamadi. Ta’lim sifati bo‘yicha dalillar tizimli jamlanmadi va aniqlangan kamchiliklar yuzasidan aniq reja ishlab chiqilmadi. Natijada tashqi baholash jarayoni maktab jamoasi uchun stressli faoliyatga aylandi, baholash natijalari esa ichki sifat tizimini rivojlantirishga xizmat qilmadi. Muammoning asosiy sababi shundaki, tashqi baholash jarayoni ichki ta’lim sifati tizimi bilan integratsiya qilinmagan, jarayon bosqichma-bosqich va tizimli ravishda amalga oshirilmagan. Ushbu vaziyatda jarayonni tizimlashtirish va tashqi baholashni ichki sifat tizimini mustahkamlovchi mexanizm sifatida tashkil etish uchun harakatlarning to‘g‘ri ketma-ketligini aniqlang.\n1.Aniqlangan kamchiliklar asosida ko‘rilgan choralar natijasini indikatorlar orqali qayta o‘rganish\n2.DTS va DTM talablari asosida risk nuqtalarini aniqlash\n3.Aniqlangan muammolar bo‘yicha kamchiliklar reyestrini shakllantirish\n4.Ta’lim sifati bo‘yicha dalillarni tizimli jamlash","o":["4-3-2-1","2-3-4-1","4-2-3-1","2-4-3-1"],"a":3},{"q":"Moslashtiring.\n1.Mehnat bozorida raqobatbardosh kadrlar yetishmasligi\n2.Innovatsion rivojlanishning sekinlashuvi\n3.Davlat iqtisodiy barqarorligiga tahdid \nA) Ishlab chiqarish samaradorligi kamayadi, kambag‘allik oshadi, budjet tushumi qisqaradi\nB) Ilm-fan va texnologiyada yangilik yaratishga qodir kadrlar yetishmaydi\nC) Yoshlarning kasbiy yo‘nalishga bo‘lgan qiziqishi pasayib, o‘qishga munosabati susayadi\nD) Zamonaviy bilim va ko‘nikmalarga ega bo‘lmagan bitiruvchilar mehnat bozorida talabga javob bera olmaydi","o":["1-D, 2-A, 3-B","1-B, 2-D, 3-C","1-D, 2-B, 3-A","1-C, 2-B, 3-D"],"a":2},{"q":"Moslashtiring.\n1.Emotsional-irodaviy sohasida qiyinchiliklari bo‘lgan bolalar\n2.Ijtimoiy kelib chiqishi sabab ta’limda qiyinchilikka duch kelayotgan bolalar\n3.Deviant xulqli bolalar \nA) Individual qo‘llab-quvvatlash, tashqi omillarga moslashgan yondashuv\nB) Xavfsiz psixologik muhit va barqaror pedagogik yondashuv\nC) Profilaktika, ijtimoiy-pedagogik va psixologik qo‘llab-quvvatlash\nD) Nazorat, tartib va umumiy intizom choralarini kuchaytirish","o":["1-C, 2-B, 3-A","1-B, 2-C, 3-D","1-A, 2-C, 3-B","1-B, 2-A, 3-C"],"a":3},{"q":"Google akkauntda elektron so‘rovnoma anketa tayyorlash ketma-ketligini aniqlang.","o":["So‘rovnoma mavzusini tanlash, savollarni yozish, Google Formni ochish, nom berish, havolani nusxalash, yuborish","Yangi forma yaratish, dizaynni tanlash, Google Formga kirish, savollarni qo‘shish, tavsif yozish, so‘rovnomani yuborish","Google akkauntga kirish, savollarni kiritish, forma nomini yozish, ulashish sozlamalarini tanlash, dizaynni o‘zgartirish","Google Formga kirish, yangi forma yaratish, so‘rovnoma nomi va tavsifini kiritish, savollarni qo‘shish va sozlash, dizayn va sozlamalarni moslash, so‘rovnomani ulashish"],"a":3}]},{"name":"4-TEST","qs":[{"q":"Texnologik evolyutsiyaning gipotetik bosqichida tizimlar o‘z-o‘zini avtonom tarzda qayta loyihalashtirish va siklik ravishda takomillashtirish qobiliyatiga ega bo‘ladi. Bu jarayon global miqyosda kognitiv portlashni keltirib chiqarishi hamda insoniyat boshqaruvi va nazorat mexanizmlarining butkul yoqolish xavfini yuzaga keltiradi. Ushbu prognozlarda qayd etilgan inson nazoratidan tashqaridagi avtonom evolyutsion tizim konsepsiyasi sun’iy intellekt ilmida qanday ataladi?","o":["Umumiy SI (General AI)","Neyronli SI (Neural AI)","Super SI (Super AI)","Tor SI (Narrow AI)"],"a":2},{"q":"Maktab innovatsion dars metodlarini sinovi boshlanmoqda. Direktor jamoani bir maqsad atrofida birlashtirib, yangilikni qabul qilish muhitini yaratmoqchi. Ushbu holat qaysi tamoyilga mos keladi?","o":["Darslarga aralashmasdan, o‘quvchilarga mustaqil rivojlanish va erkinlik berish","Maktab vizyonini jamoaga tushuntirib, yangiliklarni sinovdan o‘tkazish uchun sharoit yaratish","Barcha o‘quvchilarga qulay dars uslubini belgilab, yagona andozani joriy etish","Jamoaga yangilikni qabul qilish maktabning jamiyat oldidagi asosiy vazifasi ekanligini tushuntirish"],"a":1},{"q":"Raxbarning temperamentidan kelib chiqadigan boshqaruv uslubini moslashtiring.\nTushuncha:\n1. O‘zini va boshqalarni doimiy tahlil qiladigan ehtiyotkor raxbar\n2. Tinch, sabrli va boshqarish qobiliyati yuqori bo‘lgan raxbari\n3. Ijtimoiy energiya bilan to‘la va har doim faol bo‘lgan raxbari.\nTariflar:\nA. Flegmatik, B. Sangvinik, C. Melanxolik D. xolerik.","o":["1-A, 2-D, 3-C","1-C, 2-A, 3-B","1-D, 2-A, 3-C","1-B, 2-C, 3-A"],"a":1},{"q":"Vaziyat:\n971-sonli umumiy o‘rta ta’lim maktabida yangi raqamli platforma, yangilangan baholash mezonlari va metodik talablarni joriy etish jarayoni boshlandi. Dastlab yangiliklar tezkor ravishda ishga tushirildi, biroq ko‘p o‘tmay bir qator muammolar yuzaga chiqdi: ayrim o‘qituvchilar yangi tizimning maqsadini to‘liq anglamadi, boshqalarda esa ish hajmi ortishi haqidagi xavotir kuchaydi. Ayrim sinflarda noto‘g‘ri xabarlar tarqalib, ota- onalar orasida ham savollar ko‘paydi. Yana bir muammo shundaki, mas’ullar ayrim yo‘nalishlarda belgilangan bo‘lsa-da, ularning vazifalari aniq chegaralanmagani sabab jarayon izchil ketmadi. Direktor vaziyatni tahlil qilib, muammo faqat bitta omil bilan emas, balki o‘zgarish davrida bir nechta turdagi qiyinchiliklarning bir-biriga ta’siri bilan kuchayganini tushundi.\nSavol:\nUshbu vaziyatdan kelib chiqib, o‘zgarish sharoitida yuzaga kelgan qiyinchiliklarni eng to‘g‘ri aks ettiruvchi holatlarni belgilang.\n1.Reja va mas’ullar to‘liq aniqlanmaganligi sabab jarayonning ayrim bo‘g‘inlarida tashkiliy qiyinchilik yuzaga kelgan.\n2.Ota-onalar savollarining ortishi asosan tashqi qiyinchilik bo‘lib, u ichki boshqaruvdagi boshqa muammolardan mustaqil ravishda yuzaga keladi.\n3.Yangi tizim maqsadining yetarli tushuntirilmagani va noto‘g‘ri xabarlar tarqalishi axborot bilan bog‘liq qiyinchilikni kuchaytirgan.\n4.Ish hajmi ortishi haqidagi xavotir va yangi talablarni to‘liq tushunmaslik faqat psixologik omil bo‘lib, kadrlar bilan bog‘liq qiyinchilikka kirmaydi.\n5.O‘qituvchilarda yangi tartibni qabul qilishdagi ikkilanish, o‘z kuchiga ishonchsizlik va motivatsiya pasayishi kadrlar bilan bog‘liq qiyinchilik belgisi bo‘lishi mumkin.\n6.Jarayondagi qiyinchiliklar bir necha turdagi omillar bir-birini kuchaytirganda yanada murakkablashishi mumkin.","o":["1,3,5,6","3,5,6","1,2,4,6","1,3,6"],"a":1},{"q":"Maktab direktori dars jarayonlarida o‘qituvchi va o‘quvchilarning darslikdagi mavzularni vizual media shakliga o‘tkazish, ularni qiziqarli uslubda talqin etish va yangi raqamli mahsulotlar yaratish faoliyatini tahlil qildi. Ushbu yondashuv o‘qituvchilarda o‘quv materiallarini ijodiy anglash darajasini ko‘rsatuvchi eng samarali mezon sifatida baholandi. Shu metodik tahlilda o‘qituvchilarning axborotni o‘ziga xos tarzda qayta ishlashi va taqdim etishi orqali namoyon bo‘ladigan qaysi ko‘nikmaning ta’limiy qiymati asoslab berilgan?","o":["Innovatsion pedagogik monitoring","Estetik va kreativ ko‘nikmalar","Pedagogik tahlil va prognoz","Intellektual ko‘nikmalar"],"a":1},{"q":"Moslashtiring:\n1.Ishga qabul qilish tartibini amalga oshirish\n2.Hodim ma’lumotlarini \"Yagona milliy mehnat tizimi \" va mehnat daftarchasiga kiritish\n3.Mehnat shartnomasini tayyorlash va imzolash \nA) Mehnatni huquqiy tartibga solish, rasmiylashtirish va hisobga olish\nB) Tomonlarning manfaatlari muvozanati va kelishuv munosabatlarini ta’minlash\nC) Nomzodni ichki tartib bilan tanishtirish va ma’muriy buyruqlarni rasmiylashtirish\nD) Axborot etikasi va huquqiy oqibatlarning oldini olish","o":["1–B, 2–D, 3–A","1–A, 2–B, 3–C","1–C, 2–A, 3–B","1–C, 2–D, 3–B"],"a":2},{"q":"935-sonli umumiy o‘rta ta’lim maktabida yangi baholash mezonlari, raqamli platforma va metodik talablar bir vaqtning o‘zida joriy etilishi rejalashtirildi. Dastlab rahbariyat bu yangiliklar ta’lim sifatini oshirish, nazoratni kuchaytirish va hisobotlarni soddalashtirishga xizmat qilishini ta’kidladi. Biroq jamoada turli munosabatlar yuzaga keldi: ayrim o‘qituvchilar yangi tartiblarning mohiyatini yetarli tushunmadi, ba’zilari esa avvalgi muvaffaqiyatli ish usullari yo‘qolib ketishidan xavotir bildirdi. Yana bir guruh xodimlar vaqt, texnika va amaliy ko‘nikmalar yetishmasligini asosiy muammo sifatida ko‘rsatdi. Ayrim ota-onalar esa yangilikning mazmuni va uning farzandlariga qanday ta’sir qilishini aniq bilmagani sabab savollar bilan murojaat qila boshladi. Direktor ushbu holatni oddiy “yangilik kiritish” emas, balki puxta rejalashtirilishi, dalillar bilan asoslanishi, resurslari baholanishi va jamoaning moslashuvchanligini hisobga olgan holda bosqichma-bosqich amalga oshirilishi kerak bo‘lgan o‘zgarish jarayoni sifatida ko‘rmoqda.\nSavol:\nUshbu vaziyatdan kelib chiqib, o‘zgarish sharoitida qiyinchiliklarni boshqarishning eng to‘g‘ri yondashuvi qaysi variantda berilgan?","o":["O‘zgarishni boshqarishda avvalo uning mavjud holatni yaxshilashiga doir dalillar, amalga oshirish mexanizmi, ta’sir doirasi, zarur resurslar va ehtimoliy xavflar baholanib, so‘ng jarayon rejalashtirilgan, izchil va muloqotga tayangan holda amalga oshirilishi lozim.","O‘zgarishni boshqarishda asosiy e’tibor yangi talablarni tez joriy etishga, jamoaning moslashuvini esa amaliy jarayon davomida shakllantirishga qaratilishi kerak, chunki o‘zgarishning haqiqiy samarasi ko‘pincha bevosita qo‘llash boshlanganidan keyin aniq ko‘rina boshlaydi.","O‘zgarishni boshqarishda rahbarning asosiy vazifasi jamoani ruhlantirish, mavjud xavotirlarni pasaytirish va yangiliklarni avvalgi faoliyat turlariga zarar yetkazmaydigan shaklda joriy etishdan iborat bo‘lib, qolgan tashkiliy va resurs masalalari keyingi bosqichlarda aniqlashtirilishi mumkin.","O‘zgarishni boshqarishda jamoaning qarshiligini kamaytirish, resurslarni taqsimlash va yangi vazifalarni tushuntirish muhim bo‘lsa-da, amaliy jihatdan eng asosiy natija o‘zgarishning qisqa muddatda qo‘llana boshlashi va ichki jarayonlarga tez singib ketishi bilan belgilanadi."],"a":0},{"q":"Agar maqsad o‘quvchilarning ta’lim darajasini oshirish va sifat ko‘rsatkichlarini monitoring qilish bo‘lsa, qaysi ko‘rsatkich asosiy hisoblanadi?","o":["Boshqaruv faoliyati","Professional rivojlanish","O'quv natijalari indikatori","Ilmiy-metodik faollik"],"a":2},{"q":"Baholash turlarini subyektivlikni kamaytirish mexanizmlarini to‘g‘ri moslashtiring.\nBaholash turlari:\n1. 360 Darajali baholash\n2. Vaziyatli baholash\n3. O‘z-o‘zini baholash \nMexanizmlar:\nA) Faoliyatni tahlil qilish va refleksiya orqali anglashni chuqurlashtirish\nB) Aniq vazifa natijalariga tayangan holda baholash\nC) Turli manbalar fikrlarini solishtirish orqali xolislikni oshirish\nD) Oldindan belgilangan mezonlar asosida tahlil o‘tkazish","o":["1-D, 2-C. 3-B","1-C, 2-B, 3-A","1-A, 2-B, 3-D","1-D, 2-A, 3-C"],"a":1},{"q":"PISA 2022 natijalarida o'qish savotxonligi va tabiy fanlar savodxonligi ko'rsatkichini tanlang","o":["O'qish savodxonligi 336 ball (79-o'rin) Tabiy fan savodxonlligi 359 ball (79- o'rin)","O'qish savodxonligi 336 ball (80-o'rin) Tabiy fan savodxonlligi 355 ball (80- o'rin)","O'qish savodxonligi 336 ball (76-o'rin) Tabiy fan savodxonlligi 357 ball (77- o'rin)","O'qish savodxonligi 336 ball (80-o'rin) Tabiy fan savodxonlligi 354 ball (80- o'rin)"],"a":1},{"q":"Quyidagi islohot yo‘nalishlarini ularning asosiy maqsadli natijalari bilan moslashtiring.\nYo‘nalish:\n1. Kompetensiyaviy yondashuv\n2. Raqamli ta’limni joriy etish\n3. Boshqaruv tizimini takomillashtirish\n4. O‘quvchilarni har tomonlama rivojlantirish\nNatijalar:\nA. Ta’lim jarayonining ochiqligi va samaradorligini oshirish B. Mustaqil fikrlash va amaliy ko‘nikmalarni shakllantirish C. Ichki nazorat, monitoring va rahbarlik samaradorligini kuchaytirish D. Ma’naviy-axloqiy tarbiya, vatanparvarlik, sport va madaniyatga jalb etish","o":["1-B, 2-C, 3-A, 4-D","1-B, 2-A, 3-C, 4-D","1-C, 2-A, 3-B, 4-D","1-A, 2-B, 3-C, 4-D"],"a":1},{"q":"O‘quvchi xavfsizligi va huquqbuzarlik profilaktikasi yo‘nalishining maktab boshqaruvidagi strategik mohiyati asosan qaysi jihatda namoyon bo‘ladi?","o":["Intizomiy choralarni huquqiy asosda qo‘llash, javobgarlik mexanizmlarini tartibga solishda va profilaktik boshqaruv yondashuvini kuchaytirishda","O‘quvchilarni ijtimoiy faollikka jalb etish orqali ularning bo‘sh vaqtini samarali tashkil etishda va profilaktik boshqaruv yondashuvini kuchaytirishda","O‘quvchilarning ta’lim jarayonidagi raqobatbardoshligini oshirish va reyting ko‘rsatkichlarini yaxshilashda","Xavfli xatti-harakatlarni erta aniqlash, ularning oldini olish va profilaktik boshqaruv yondashuvini kuchaytirishda"],"a":3},{"q":"Maktab direktori dars jarayonlarida o‘qituvchi va o‘quvchilarning darslikdagi mavzularni vizual media shakliga o‘tkazish, ularni qiziqarli uslubda talqin etish va yangi raqamli mahsulotlar yaratish faoliyatini tahlil qildi. Ushbu yondashuv o‘qituvchilarda o‘quv materiallarini ijodiy anglash darajasini ko‘rsatuvchi eng samarali mezon sifatida baholandi. Shu metodik tahlilda o‘qituvchilarning axborotni o‘ziga xos tarzda qayta ishlashi va taqdim etishi orqali namoyon bo‘ladigan qaysi ko‘nikmaning ta’limiy qiymati asoslab berilgan?","o":["Innovatsion pedagogik monitoring","Intellektual ko‘nikmalar","Estetik va kreativ ko‘nikmalar","Pedagogik tahlil va prognoz"],"a":2},{"q":"O‘zgarishlar jarayonini samarali tashkil etish va amalga oshirishda quyidagi bosqichlarni ularning mazmuni bilan moslashtiring.\nBosqichlar:\n1. Google Keep\n2. Google Slides\n3. Google Sheets\nVazifalar:\nA) Rasm, diagramma, chizmalar va sxemalarni yaratish uchun mo‘ljallangan onlayn grafik vosita.\nB) Jadval va ma’lumotlar bilan ishlash uchun elektron jadval (Spreadsheet) dasturi.\nC) Tezkor eslatmalar, xotiralar va g‘oyalarni saqlash uchun ilova.\nD) Taqdimotlarni yaratish va ko‘rsatish uchun dastur.","o":["1-C, 2-D, 3-B","1-A, 2-B, 3-C","1-C, 2-B, 3-D","1-B, 2-D, 3-A"],"a":0},{"q":"Gospital maktabda o'quv jarayonini tashkil etish mexanizmlarini ularning amaliy xususiyatlari bilan moslashtiring.\n1. O‘quv reja va dasturlarini moslashtirish mexanizmlari,\n2. Individual yondashuv mexanizmi,\n3. Baholash tizimini tashkil etish mexanizmlari. \nA) Sinovlar hajmini kamaytirish, jamlovchi usullardan voz kechish, ogzaki fikr-mulohazalar hamda o‘quvchining shaxsiy ishlari, jamlanmasa, portfolio orqali rivojlanish dinamikasini kuzatish.\nB) O‘quv materiallari qisqa, 30 daqiqalik modullarga bo‘lish, fanlar hajmini qisqartirish, asosiy mavzularni ketma-ketligini, tibbiy muolokalar vaqtiga ko‘ra kechiktirish yoki mavzu uchun jadvalga solish.\nC) Bolaning kognitiv, ruhiy- emotsional holati va shifokor tashxisi asosida uning haftalik yuklama darajasini, darslar davomiyligini hamda fanlar ustuvorligini qat'iy shaxsiylashtirish\nD) Ta'lim jarayoning davolash muolajalariga xalaqit bermasligini ta'minlash, tibbiyot xodimlari bilan doimiy hamkorlik qilish hamda bolalarda kasallikka nisbatan ijobiy munosabatni shakllantirish.","o":["1-C, 2-D, 3-A","1-B, 2-C, 3-A","1-D, 2-B, 3-C","1-A, 2-C, 3-D"],"a":1},{"q":"Қайси давлатда аниқланган муаммолар, шахсга эмас тизимга боғланади","o":["Финландия","Япония","Америка.","Сингапур"],"a":1},{"q":"1.Jarayon yondashuvi\n2.Dalilga asoslangan boshqaruv\n3.Doimiy takomillashtirish \nA) “Menimcha” emas, monitoring, diagnostika va ko‘rsatkichlar asosida qaror qabul qilish\nB) Natija jarayonlardan kelib chiqadi: dars sifati, baholash, tarbiya muhiti va resurslar bilan bog‘liq bo‘ladi\nC) Har chorak va yil yakunida kamchiliklarni tahlil qilib, aniq chora- tadbirlarni belgilash\nD) Ta’lim jarayonida vazifalarni umumiy tarzda taqsimlab, ijro intizomini kuzatib borish","o":["1–B, 2–A, 3–D","1–D, 2–A, 3–C","1–B, 2–A, 3–C","1–B, 2–C, 3–A"],"a":2},{"q":"Maktab direktori o‘quv ishlari bo‘yicha o‘rinbosariga 9-sinflarda bir kunda matematika (CHSB) , ingliz tili, biologiya va fizika (BSB) fanlaridan summativ baholashlarni o‘tkazish bo‘yicha jadvalni tasdiqlashni buyurdi. Maktab ta’limi vazirligining amaldagi buyruqlari hamda summativ baholash tartibiga ko‘ra, ushbu vaziyatda qaysi me’yoriy talab buzilmoqda?","o":["BSB va CHSB tadbirlarini otlazishdda belgilangan baholash shakllari (test, loyiha, esse va boshqalar)ning o‘zaro mos kelmasligi holati.","Summativ baholash turlari ( BSB va CHSB) ularning maksimal ballar miqdorining ozaro mutanosibligi","Direktor o‘rinbosari tomonidan summativ baholashlarnis o‘tkazishning texnologik xaritasi noto‘g‘ri shakllantirilganligi","Bir o‘quv kuni davomida bitta sinf uchun uch fandan ortiq summativ baholash tadbirlarini o‘tkazish taqiqlanganligi bilan bog‘liq me’yorning buzilishi."],"a":3},{"q":"Maktabda yangi ish boshlagan o‘qituvchilar birinchi yil ichida yuqori darajada ishni tark etmoqda. Tahlil shuni ko‘rsatdiki, ularga yuklama darhol to‘liq berilgan va yetarli metodik yordam tashkil etilmagan.\nSavol:\nQuyidagi choralardan qaysi biri ushbu muammoni eng samarali bartaraf etadi?","o":["Yuklamani kamaytirish va nazoratni kuchaytirish","Yuklamani bosqichli oshirish va mentor biriktirish","Hisobotni kamaytirish va talabni soddalashtirish","Dars kuzatuvini oshirish va baholashni qat’iylashtirish"],"a":1},{"q":"Direktor keskin vaziyatda qarorni tez qabul qilishi kerak edi, lekin u hissiyotga berilmay, vaziyatni tahlil qilib, xodimlar bilan muloqot orqali yechim topdi.\nSavol:\nBu qaysi jihatga ko'proq mos?","o":["Emotsional intellekt","O‘zini boshqarish","Professional intizom","Rahbar pozitsiyasi"],"a":0},{"q":"Қайси халқаро тадқиқотда ўқувчиларнинг академик билимларининг амалиётга боғланиши қиёсий таҳлил қилинади?","o":["PIRLS","PISA","TIMSS","TALIS"],"a":1},{"q":"Maqsadlilik tamoyili maktab boshqaruvida qaysi boshqaruv muammosining oldini olishga xizmat qiladi?","o":["Faoliyatning bir-biriga bog‘lanmagan vazifalar asosida olib borilishiga","Faoliyatning tashqi talablar bilan haddan tashqari cheklanishiga","Faoliyatning aniq maqsad va vazifalardan uzilib qolishiga","Faoliyatning nazorat mexanizmlariga ortiqcha tayanib qolishiga"],"a":2},{"q":"O‘zgarishlar jarayonini samarali tashkil etish va amalga oshirishda quyidagi bosqichlarni ularning mazmuni bilan moslashtiring.\nBosqichlar:\n1. Tashkiliy jarayonlarni samarali tashkil etishda tashabbus ko‘rsatish\n2. Amalga oshirish\n3. Uzluksiz va uzviylikni ta’minlash \nTa’riflar:\nA) Qadamalar va amaliy harakat holatini tekshirish, yangi yondashuvlarni sinab ko‘rish, ko‘rsatkichlarni tahlil qilish va jamoaga tushuntirish.\nB) Nizolashayotgan tomonlarni individual o‘rganish, dalillarni to‘plash, muqobil yechimlar ishlab chiqish va kelishuvni nazorat qilish.\nC) Faoliyat natijalarining o‘zaro bog‘liqligini ta’minlash, tajribali jamoani shakllantirish va qarorlar ta’sir kuchini baholash va natijalarni jamoatchilikka ma'lum qilish\nD) Kelgusidagi rivojlanish strategiyalarini belgilash, umumiy holatni togri anglash va ishonch muhitini mustahkamlash hamda xodimlarni umumiy maqsad atrofida birlashtirish","o":["1–C, 2–A, 3–D","1–C, 2–B, 3–A","1–D, 2–A, 3–C","1–D, 2–C, 3–B"],"a":2},{"q":"Maktab rahbari har bir pedagogni KPI asosida baholashni xohlaydi. Agar maqsad o‘quvchilarning ta’lim darajasini oshirish va sifat ko‘rsatkichlarini monitoring qilish bo‘lsa, qaysi ko‘rsatkich asosiy hisoblanadi?","o":["Boshqaruv faoliyati","Ilmiy-metodik faollik","Professional rivojlanish","O'quv matijalari indikatori"],"a":3},{"q":"Past o‘zlashtirish sabablarini diagnostika qilish yo‘nalishlarini ularning ta’riflari bilan moslashtiring.\nTushunchalar:\n1. Kognitiv to‘siqlar\n2. Psixologik muhit\n3. Metodik xatolar \nTa’riflar:\nA) O‘qituvchi tushuntirish usuli o‘quvchining qabul qilish xususiyatiga mos kelmasligi natijasida mavzu yetarli o‘zlashtirilmaydi.\nB) O‘quvchilarning past natijasi ortida nosog‘lom muhit, tazyiq yoki salbiy ijtimoiy omillar yotadi.\nC) Past baholarning asosiy sababi sifatida avvalgi bosqichlardaw mavzular o‘rtasida bilim uzilishi va bo‘shliqlar paydo bo‘lgan bo‘ladi.\nD) O‘quvchilar davomat ko‘rsatkichlari asosida umumiy noto‘g‘ri xulosa chiqarilib, intizomiy choralar qo‘llanilmaydi.","o":["1–C, 2–B, 3–A","1–D, 2–B, 3–C","1–B, 2–A, 3–D","1–A, 2–C, 3–B"],"a":0},{"q":"KPI tizimining ta’lim menejmentidagi asosiy akademik ustunligi matnda qaysi yondashuv orqali ochib berilgan?","o":["O‘qituvchilar faoliyatini standartlashtirish va bir xil mezonlarga bo‘ysundirish bilan","Maktab strategik maqsadlarini pedagogning individual ish rejasi bilan integratsiya qilish bilan","Baholashni faqat miqdoriy natijalarga tayanib olib borish rejasi bilan integratsiya qilish bilan","Pedagog faoliyatini umumiy tavsiflar asosida baholash imkoniyat rejasi bilan integratsiya qilish bilan"],"a":1},{"q":"Quyidagi Google Account ilovalarini ularning vazifalari bilan moslashtiring.\nGoogle ilovalari:\n1. Google Keep\n2. Google Slides\n3. Google Sheets\nVazifalar:\nA) Rasm, diagramma, chizmalar va sxemalarni yaratish uchun mo‘ljallangan onlayn grafik vosita.\nB) Jadval va ma’lumotlar bilan ishlash uchun elektron jadval (Spreadsheet) dasturi.\nC) Tezkor eslatmalar, xotiralar va g‘oyalarni saqlash uchun ilova.\nD) Taqdimotlarni yaratish va ko‘rsatish uchun dastur.","o":["1-B, 2-D, 3-A","1-A, 2-B, 3-C","1-C, 2-D, 3-B","1-A, 1-C, 3-B"],"a":2},{"q":"1.Prezident farmonlari va qarorlari\n2.Vazirlar Mahkamasi qarorlari\n3.Maktabgacha va maktab ta’limi vazirligi buyruqlari \nA) Ta’lim tizimini isloh qilish, rahbar kadrlar mas’uliyatini oshirish, ta’lim samaradorligini yuksaltirish\nB) Hududiy boshqaruv organlari vakolatlari, moliyalashtirish tartibi va hisobot mexanizmlarini belgilash\nC) Maktab faoliyatini tashkil etish, o‘quv yuklamalari, boshqaruv tuzilmasi, nazorat va monitoringni belgilash\nD) Direktor va o‘rinbosarlar vazifalari, ichki nazorat, hujjat yuritish, pedagoglar faoliyatini baholash","o":["1–A, 2–B, 3–C","1–B, 2–C, 3–A","1–B, 2–A, 3–D","1–D, 2–A, 3–C"],"a":0},{"q":"Ijtimoiy tarmoqlarda maktab reytingini tanqid qiluvchi va vizual xabar tarqaldi. Direktor ehtirosga berilmasdan, axborot manbasini, ushbu malumotning vizual haqiqiyligini va uning ortidagi maqsadni tahlil qilib, asossiz qaror qabul qilishdan saqlandi. Ushbu vaziyatda rahbar samarali boshqaruv qaroriga kelishda qaysi konikmasini namoyon etdi?","o":["Axborot gigiyenasi","Pedagogik tahlil","Mediasavodxonlik","Kiberxavfsizlik"],"a":2},{"q":"Maktab direktori o‘quvchilarning kasbiy ehtiyojlarini aniqlash va maktabdagi umumiy muhitni xalqaro standartlar darajasida tahlil qilish maqsadida TALIS tadqiqot metodologiyasidan foydalanishga qaror qildi. Ushbu tadqiqot doirasida olinadigan ma’lumotlarning ishonchliligini qanday usul bilan ta’minlash mumkin?","o":["Ta’lim oluvchilar o‘rtasida o‘qitish sifati va maktab muhiti bo‘yicha testlar o‘tkazish orqali","O‘qituvchilar va direktorlarning kasbiy faoliyati yuzasidan anonim so‘rovnomalar o‘tkazish orqali","Maktab rahbarlari va pedagoglarning dars jarayonlarini bevosita ekspertlar tomonidan kuzatish orqali","Yuqori turuvchi tashkilotlar tomonidan berilgan rasmiy hisobotlarni qiyosiy tahlil qilish orqali"],"a":1}]},{"name":"5-TEST","qs":[{"q":"Maktabning 6-sinfida bullingga o‘xshash holat kuzatildi. Ayrim belgilar vaqt o‘tishi bilan kuchayib bordi: o‘quvchi darslarni tez-tez qoldira boshladi; sinfda kam gapiradigan, yopiqlashgan holatga keldi; tanaffuslarda ko‘pincha yolg‘iz yurdi. Sinf rahbari dastlab bu holatni “o‘smirlikdagi erkalik” deb baholadi. Biroq keyinchalik: o‘quvchining sumkasi yashirilgani, tanaffuslarda kamsituvchi va noo‘rin xatti-harakatlar sodir etilgani aniqlangan. Direktor bola xavfsizligi va farovonligini ta’minlash maqsadida quyidagi\nbandlardan iborat “tezkor choralar rejasi”ni shakllantirdi:\n1.Sinfda hamma ishtirokida jabrlanuvchini gapirtirib, “Kimlar seni xafa qildi?” degan Savol: bilan muhokama o‘tkazish.\n2.Holat haqida xabarni yozma qayd etish\n(vaqt, joy, ishtirokchilar), dalillarni maxfiy saqlash.\n3.Jabrlanuvchini vaqtincha xavfsiz muhitga olish, tanaffuslarda nazoratni kuchaytirish.\n4.Ota-onalar Telegram guruhida Vaziyat:ni to‘liq bayon qilib, “Kim ko‘rdi yoki biladi?” degan murojaat qoldirish.\n5.Psixologni jalb qilib, risk belgilarini baholash hamda sinf bo‘yicha profilaktik trening va “xavfsiz sinf” rejasi tuzish.\n6.Holatni “bir martalik holat” deb baholab, rasmiy hujjatlashtirmasdan qoldirish.\nSavol:\nDirektorning qaysi bandlari bola xavfsizligi va farovonligini ta’minlash tamoyillariga mos hisoblanadi?\n(2 yoki undan ortiq javob to‘g‘ri)\nA) 1-Band\nB) 2-Band\nC) 3-Band\nD) 4-Band\nE) 5-band\nF) 6-band","o":["A,B,C","A,C,D","B,C,E","A,D,F"],"a":2},{"q":"Texnologik laboratoriyada ishlayotgan yangi tizim o‘quvchilar va jismoniy matematik masalalarni yechish mustaqil ravishda, badiiy matn yozish va turli xil vaziyatlarga moslashgan holda yangi bilimlarni o‘zlashtirish qobiliyati namoyon etmoqdaki, hali to‘liq amalda mavjud bo‘lmagan bo‘lsa- da, ChatGPT va Cloud AI kabi vositalar ushbu darajaga qisman yaqinlashgan deb hisoblanadi. Inson intellektual darajasidagi ushbu SI tizimi qaysi guruhga kiradi?","o":["Neyronli SI, (Neural AI)","Tor SI, (Narrow AI )","Umumiy SI, (General AI).","Super SI,.( Super AI )"],"a":2},{"q":"Quyidagilardan qaysilari ta’lim xizmatlari sifatini ta’minlash yo‘llari sifatida ko‘rsatilgan?\nA) Baholash natijalarini yakuniy nazorat bilan umumlashtirib tahlil qilish\nB) O‘qituvchilarning kasbiy rivojlanishi va metodik hamkorligini yo‘lga qo‘yish\nC) O‘quv dasturi, dars ishlanmalari va baholash mezonlarining uyg‘unligini ta’minlash\nD) Xavfsiz va sog‘lom psixologik muhitni shakllantirish\nE) O‘quvchi va ota-onalar bilan muntazam teskari aloqa o‘rnatish","o":["A,B,D,E","B,C,D,E","A,B,C,D","A,C,D,E"],"a":1},{"q":"Maktab direktori o‘quv ishlari bo‘yicha o‘rinbosariga 9-sinflarda bir kunda matematika (CHSB) , ingliz tili, biologiya va fizika (BSB) fanlaridan summativ baholashlarni o‘tkazish bo‘yicha jadvalni tasdiqlashni buyurdi. Maktab ta’limi vazirligining amaldagi buyruqlari hamda summativ baholash tartibiga ko‘ra, ushbu vaziyatda qaysi me’yoriy talab buzilmoqda?","o":["BSB va CHSB tadbirlarini otlazishdda belgilangan baholash shakllari (test, loyiha, esse va boshqalar)ning o‘zaro mos kelmasligi holati.","Direktor o‘rinbosari tomonidan summativ baholashlarnis o‘tkazishning texnologik xaritasi noto‘g‘ri shakllantirilganligi","Summativ baholash turlari ( BSB va CHSB) ularning maksimal ballar miqdorining ozaro mutanosibligi","Bir o‘quv kuni davomida bitta sinf uchun uch fandan ortiq summativ baholash tadbirlarini o‘tkazish taqiqlanganligi bilan bog‘liq me’yorning buzilishi."],"a":3},{"q":"Maktabda tashqi talablar va ichki ehtiyojlar tez o‘zgarayotgan bir paytda rahbar ilgari belgilangan ish usullarini qayta ko‘rib chiqib, yangi sharoitga mos qarorlar qabul qildi.\nSavol:\nBu holat nimani anglatadi?","o":["Moslashuvchanlik","Barqarorlik","Rejalilik","Nazoratlilik"],"a":0},{"q":"Maktab direktori muassasasining besh yillik rivojlanish strategiyasini ishlab chiqishni boshladi. U jamoa bilan birgalikda maktabning kuchli va kuchsiz tomonlari, tashqi imkoniyatlar hamda xavf-xatarni atroflicha o‘rganib chiqdi. Mazkur tahlillar natijasida maktabdagi eng muhim muammolar va rivojlanish nuqsonlari aniqlandi. Strategik rejalashtirishning ushbu jarayoni qaysi bosqichga mos keladi?","o":["Rivojlanish uchun ustuvorlikni tanlash","Ustuvor yo‘nalishlarni guruhlarga ajratish","Strategik maqsad va yo‘nalishlarni belgilash","Boshlang‘ich tahlil, real holatni o‘rganish"],"a":3},{"q":"Quyidagi bosqichlarni boshqaruv qarorining ijro jarayonini boshqarish siklining mantiqiy ketma-ketligidajoylashtiring. Bosqichlar\n1.Qaror natijalarining samaradorligi va ta’sir darajasini yakuniy baholash\n2.Aniqlangan og‘ishlar asosida ish usullari, muddatlar yoki resurslarni qayta ko‘rib chiqish\n3.Ijrochilarni vazifalar bilan ta’minlash, sharoit yaratish va hamkorlikni yo‘lga qo‘yish\n4.Rejalashtirilgan natijalar bilan amaldagi holatni taqqoslab, muntazam monitoring olib borish","o":["4,2,3,1","3,2,4,1","4,3,2,1","3,4,2,1"],"a":0},{"q":"Vaziyat : Maktabda o‘qituvchilar almashinuvi (turnover) darajasi oshib\nbormoqda:\nso‘nggi bir yil davomida bir nechta o‘qituvchi ish joyini o‘zgartirdi; yangi ish boshlagan pedagoglar birinchi yilni murakkab deb baholamoqda; ayrim bo‘limlarda kasbiy charchoq belgilari sezilmoqda; dars kuzatuvlari ko‘pincha nazoratga yo‘naltirilgan deb qabul qilinmoqda; motivatsiya va kasbiy o‘sish imkoniyatlariga doir savollar kuchaygan. Direktor vaziyatni strategik HR sikli asosida qayta tashkil etishni rejalashtirmoqda: rejalashtirish → tanlash → moslashuv → rivojlanish → faoliyatni boshqarish → rag‘bat va retensiya → vorislik.\nSavol: Quyidagi harakatlardan qaysilari matndagi yondashuvga muvofiq maktabda kadrlar barqarorligini ta’minlashga qaratilgan eng maqbul strategik boshqaruv paketi hisoblanadi?\n(2 yoki undan ortiq javob to‘g‘ri)\nA) Fanlar kesimida o‘rta muddatli kadrlar ehtiyojini tahlil qilish, ehtimoliy bo‘shliqlarni oldindan ko‘rish va ichki kadrlar zaxirasini shakllantirish imkoniyatlarini belgilash\nB) Mehnat intizomini mustahkamlash maqsadida umumiy talablarni qayta ko‘rib chiqish va barcha bo‘limlarda nazorat mexanizmlarini bir xilda qo‘llash\nC) Yangi o‘qituvchilar uchun moslashuv jarayonini tizimlashtirish: mentorlik, bosqichma-bosqich yuklama, dars tahlili va rivojlantiruvchi fikr- mulohazalarni joriy etish\nD) Faoliyatni boshqarish tizimini rivojlanishga yo‘naltirish: aniq kutilmalar, muntazam kuzatuv, shaffof mezonlar va takomillashtirishga xizmat qiluvchi feedback\nE) Motivatsiya siyosatida moddiy rag‘batlantirish mexanizmlarini asosiy tayanch sifatida ko‘rib chiqish F) O‘qituvchilarning maktabda qolishiga ta’sir etuvchi nomoddiy omillarni kuchaytirish: kasbiy yutuqlarni tan olish, ishtirokni oshirish, muloqot va qo‘llab-quvvatlash muhitini rivojlantirish G) Ichki yetakchilarni aniqlash va ularni strategik delegatsiya orqali rahbarlik va metodik yetakchilik rollariga tayyorlash","o":["A,C,D,E,F","A,B,C,D,G","B,C,D,E,F","A,C,D,F,G"],"a":3},{"q":"Maktab hisob raqamida yetarli mablag' bo'lishiga qaramay, direktor tomonidan imzolangan to'lov topshiriqnomasi yuqori turuvchi moliya organi tomonidan rad etildi. Sababi, amalga oshirilgan xarajat tasdiqlangan smeta bandida ko'rsatilmagan va tegishli dalolatnomalat bilan asoslanmaganligi\nedi. Ushbu holatda rahbar qaysi tizimli xavf nuqtasiga e'tibor bermagan:","o":["Grantlar va homiylik riski;","Korrupsiyaviy risk;","Moddiy aktivlar riski","Meyoriy -muvofiqlik riski."],"a":3},{"q":"Savol:\nMaktab direktori yangi o‘quv yili uchun rivojlanish dasturini ishlab chiqmoqda. U \"Dalilga asoslangan boshqaruv\" tamoyiliga tayanib, shaxsiy taxminlarga tayanmaslik va muassasasidagi muhit hamda resurslar holatini aniq olchanadigan ko‘rsatkichlar asosida holis baholashni maqsad qilmoqda. Monitoring jarayonida direktor birinchi navbatda qaysi ko‘rsatkichlar bazasiga tayanishi lozim?","o":["O‘quvchilarning o‘quv rejalari va yutuqlarining ko‘pligi","Yuqori tashkilotlardan kelgan buyruqlar va xatlarning o‘z vaqtida ijro etilishi","O‘quvchilarning davomiy dinamikasi, metodik ta’minot monitoringi","Darslar ijrosi va sifatli o‘qitish jarayonini baholashning mezonliligi va xolisligi"],"a":2},{"q":"Quyidagi temperament turlarini ularning xulq-atvor xususiyatlari va kamchiliklari bilan moslashtiring.\nXususiyatlar:\n1. Haddan tashqari optimizm sababli jiddiy narsalarni yetarlicha jiddiy qabul qilmaslik, beparvolik.\n2. G‘azablanishga moyillik, hissiy reaksiyalarni boshqarishda qiyinchilik.\n3. Ortiqcha xavotirli bo‘lish, noaniqlikdan qo‘rqish va kichik narsalardan ham stressga tushish.\nTemperament turlari:\nA) Xolerik\nB) Sanguinik\nC) Flegmatik\nD) Melanxolik","o":["1-B, 2-C, 3-A","1-D, 2-B, 3-C","1-B, 2-A, 3-D","1-C, 2-D, 3-B"],"a":2},{"q":"Maktab amaliyotida ta’lim sifatini baholash indikatorlari va ularning tarkibiy qismlarini to‘g‘ri moslashtiring.\nIndikatorlar:\n1. Natija indikatorlari\n2. Jarayon indikatorlari\n3. Muhit va resurs indikatorlari \nVariantlar:\nA) O‘quvchilarning yutuqlari, umumiy ta’limiy jarayon, tarbiyaviy holat\nB) Davomat, xavfsizlik, psixologik iqlim, metodik ta’minot\nC) Yillik sifat reja, metodik kengash, intizom, baholash dinamikasi\nD) Dars sifati, o‘quv dasturlari ijrosi va baholashning mezonliligi","o":["1-D, 2-B, 3-C","1-B, 2-C, 3-D","1-B, 2-A, 3-C","1-A, 2-D, 3-B"],"a":3},{"q":"Pedagog davlat tizimidagi bo‘sh ish o‘rinlarini qidirayotgan bo‘lib, u faqat milliy vakansiyalar bazasi va ijtimoiy himoya tizimi orqali ish topishni maqsad qilmoqda. Ushbu vaziyat qaysi partalga mos keladi?","o":["Ish.mehnat.uz (My.Mehnat.uz)","Tanlov.uzedu.uz/ Vacancy.argos.uz","Ishplus.uz/ ish.plus.uz","It.uzedu.uz (Vacancy)"],"a":0},{"q":"Direktor yangi tartib bo‘yicha buyruq chiqardi, ammo unda huquqiy asos aniq ko‘rsatilmagan. Keyin ayrim xodimlar buyruqning qo‘llanishiga e’tiroz bildirdi. Bu holatda qaysi xulosa kuchayadi?","o":["Buyruqni tushuntirish mexanizmi yetarli rejalashtirilmagan","Buyruqning huquqiy tayanchi yetarli aniqlashtirilmagan","Buyruq ijrosi bo‘yicha nazorat shakli sust belgilangan","Buyruq mazmuni ichki tartib bilan yetarli uyg‘unlashmagan"],"a":1},{"q":"Kasb tushunchasining mazmuniy chegaralariga eng mos keluvchi faoliyat tavsifi qaysi variantda ifodalangan?","o":["Ijtimoiy ehtiyojlardan mustaqil holda amalga oshiriladigan erkin mashg‘ulot faoliyati","Muayyan tayyorgarlik talab qilmaydigan va vaqtinchalik daromadga yo‘naltiruvchi va barqaror natija beruvchi faoliyat","Shaxsning individual xohishlariga tayangan holda ixtiyoriy tarzda bajariluvchi va barqaror natija beruvchi faoliyat","Me’yoriy asosga ega bo‘lgan, maxsus tayyorgarlikni talab etuvchi va barqaror natija beruvchi faoliyat"],"a":3},{"q":"Maktabda moliyaviy ehtiyojlar ko‘p, ammo rejalashtirishda barcha xarajatlar bir qatorda ko‘rildi. Natijada zarur to‘lovlar bilan ta’lim sifatiga ta’sir qiluvchi sarflar o‘rtasidagi ustuvorlik chalkashdi. Bu holatda qaysi yondashuv yetarli ishlamagan?","o":["Xarajatlarni smeta va shtat birligiga qarab biriktirish yondashuvi","Xarajatlarni reja va ijro muddatiga qarab taqsimlash yondashuvi","Xarajatlarni majburiylik va natijadorlik bo‘yicha ajratish yondashuvi","Xarajatlarni hujjat va to‘lov asosiga qarab guruhlash yondashuvi"],"a":2},{"q":"Inklyuziv sinfda o‘quvchilarni kichik guruhlarga ajratadi. Vazifa bajarish jarayonida o‘quvchilar bir-biriga yordam berish, fikr almashish va umumiy mas’uliyatni his qilish orqali jamoaviy loyihalarni yakunladilar. Natijada o‘quvchilarda hamkorlik darajasi sezilarli darajada oshdi. Ushbu natija jadvalning qaysi bandi bilan izohlanadi?","o":["Ijtimoiy va kommunikativ ko‘nikmalarni rivojlantirish","Ijtimoiy lift funksiyasi","Ijtimoiy tafakkur barqarorligigi","Ta’limdagi cheklovlar talqinining ozgartirishi"],"a":0},{"q":"Ingliz tili o‘qituvchisi zamonaviy pedagogik texnologiyalar bo‘yicha uzoq muddatli malaka oshirish kursini tamomladi. Kursdan qaytgach, u o‘rgangan Project-based learning (loyiha asosida o‘qitish) metodini o‘z darslariga tatbiq etdi. Maktab ma’muriyati o‘qituvchi faoliyatini KPI tizimi asosida baholashda ushbu kursning qaysi komponentiga e’tibor qaratishi lozim?","o":["Ilmiy-metodik faoliyat","Reflektiv tahlil bloki","Professional rivojlanish","O‘quv natijalari indikatori"],"a":2},{"q":"Maktab direktori o‘z muassasasining hududiy o‘ziga xosligi va o‘qituvchilar jamoasining real imkoniyatlarini chuqur tahlil qilmasdan, yuqori turuvchi organlar tomonidan berilgan umumiy tavsiyalarni tahlilsiz \"qolip\" korinishida tatbiq etishda davom etmoqda. Natijada esa maktabdagi real muammolar yechilmay qolmoqda. Statistika va axborotni boshqarishdagi noaniqlikxUshbu holatda boshqaruv jarayonida qaysi turdagi muammo yoki kamchilik namoyon bo‘lmoqda?","o":["Jamoa bilan ishlashdagi muammolar","Nazorat va korrupsiyaga oid xavflar","Malaka va boshqaruv ko‘nikmalarining yetishmasligi","Statistika va axborotni boshqarishdagi noaniqlik"],"a":2},{"q":"Maktab rahbari har bir pedagogni KPI asosida baholashni xohlaydi. Agar maqsad o‘quvchilarning ta’lim darajasini oshirish va sifat ko‘rsatkichlarini monitoring qilish bo‘lsa, qaysi ko‘rsatkich asosiy hisoblanadi?","o":["Ilmiy-metodik faollik","Boshqaruv faoliyati","O‘quv natijalari indikatori","Professional rivojlanish"],"a":2},{"q":"Maktab o‘quvchilari va o‘qituvchilar dars jarayonida ma’lumotlarni qidirish va tahlil qilish uchun zamonaviy sun’iy intellekt texnologiyalaridan foydalanishni boshladilar. Maktab direktori ushbu yangiliklarning dars o‘tishga halaqit beruvchi omil sifatida taqiqlash orniga mazkur vositalardan o‘qituvchilarning ish samaradorligini oshirish va vaqtni tejashda qanday foydalanish mumkinligi bo‘yicha maxsus seminar tashkil etdi. Direktorni ushbu yondashuv rahbar shaxsning qayta xususiyatini ifodalaydi?","o":["Ish va hayot muvozanati","Moslashuvchanlik","Muvaffaqiyatsizlikka munosabat","Hissiyy intellektda"],"a":1},{"q":"Boshqaruv qarorlarini qabul qilish va qarorlarning bajarilishini tashkil etishning bosqichlaridan keltirilgan jarayonlarning to‘g‘ri ketma-ketligini aniqlang.\nQuyidagi bosqichlarni to‘g‘ri tartibda joylashtiring:\n1. Mezonlarini tanlash\n2. Vaziyatni tahlil qilish\n3. Muammoni aniqlash\n4. Muqobil variantlarni tanlash\n5. Muqobil variantlarni aniqlash","o":["2,3,1,5,4","3,1,2,5 4","1,2,3,4 ,5","2,1,4,3,5"],"a":0},{"q":"“Inson inson tomonidan yetarli aks ettirilmasligi qonuni” rahbar uchun qaysi psixologik xulosani talab qiladi?","o":["Kasbiy mahorat va shaxsiy fazilatlarni bir xil darajada ko‘rishni","Xodim haqidagi dastlabki tasavvur har doim to‘liq bo‘lmasligini","Jamoada baholash mezonlarini qisqartirish zarurligini","Xodimni faqat tashqi xulqi asosida baholash mumkinligini"],"a":1},{"q":"Maktabni loyiha asosida boshqarish bosqichlarining to‘g‘ri ketma- ketligini belgilang.\nBosqichlar:\n1. Strategik maqsadga mosligini aniqlash\n2. KPIlar asosida natijani baholash\n3. Loyihani tizimga integratsiya qilish\n4. Resurs, muddat va mahsulotlarni belgilash\n5. Loyihani bosqichma-bosqich amalga oshirish","o":["1–4–2–3–5","2–1–5–4–3","1–4–5–2–3","1–2–3–4–5"],"a":2},{"q":"Yagona identifikatsiya tizimidan (OneID) yuridik shaxs sifatida foydalanishning boshqaruvdagi asosiy afzalligi nimada namoyon bo‘ladi?","o":["Elektron raqamli imzoni tizim ichida majburiy yangilash autentifikatsiya orqali kirish imkoniyatida","Ta’lim muassasasining barcha ichki hujjatlarini avtomatik tasdiqlash autentifikatsiya orqali kirish imkoniyatida","Maktab rahbariga barcha elektron platformalarda cheklanmagan huquqlar berilishida","Davlat va xo‘jalik boshqaruvi portallariga yagona autentifikatsiya orqali kirish imkoniyatida"],"a":3},{"q":"Homiylik mablag‘larini jalb qilish jarayonida qaysi bosqich moliyaviy shaffoflik va javobgarlikni mustahkamlashga xizmat qiladi?","o":["Loyiha taklifini mazmunan asoslab ishlab chiqish majburiyatlarini belgilash","Maktab ehtiyojlari va muammolarini tahlil qilish majburiyatlarini belgilash","Shartnoma tuzish hamda hisobot berish majburiyatlarini belgilash","Homiy bilan muzokara va uchrashuvlar tashkil etish majburiyatlarini belgilash"],"a":2},{"q":"Maktabda uzoq muddatli reja asosida ish olib borilgach, ota-onalar va hamkorlar ishonchi sezilarli oshdi.\nSavol:\nBu qaysi natijaga ko‘proq mos?","o":["Obru","Tejamkorlik","Barqarorlik","Samaradorlik"],"a":0},{"q":"Quyidagi tushunchalarni ularning ta’riflari bilan moslashtiring.\nTushunchalar:\n1. Moslashuvchanlik\n2. O‘zgarish \nTa’riflar:\nA) Jarayon, u tadbir yoki hodisa emas; innovatsiya o‘z-o‘zidan yakunlanmaydi va inqirozga uchragan tashabbusning aksi sifatida qaraladi.\nB) Tashkiliy tuzilmani tubdan isloh qilish, lavozim yo‘riqnomalarini majburiy yangilash va krizis davrida qat’iy ma’muriy nazorat o‘rnatish choralari majmuasi.\nC) O‘zgarish jarayoniga va uni joriy etish harakatiga munosabat; moslashuvchanlik holati yagona emas.","o":["1-A, 2-B","1-C, 2-A","1-B, 2-C","1-A, 2-C"],"a":1},{"q":"Xalqaro baholash dasturlarining o‘ziga xos xususiyatlaridan kelib chiqib, o‘quvchilarning maktab dasturi doirasida o‘zlashtirgan akademik bilimlarini xalqaro miqyosda qiyosiy tahlil qiluvchi tadqiqotlarni aniqlang.","o":["PISA tadqiqoti","TIMSS tadqiqoti","TALIS tadqiqoti","PIRLS tadqiqoti"],"a":1},{"q":"Maktab direktori o‘quv tarbiya jarayonini yaxshilash maqsadida ichki nazorat va monitoringni yo‘lga qo‘ydi, o‘zining barcha ma’muriy qarorlarini amaldagi qonunchilik talablariga asosli ravishda muvofiqlashdirdi. Buning natijasida hodimlarning mas’uliyati keskin yuksaldi, tartibsiz xatti- harakatlar cheklandi va rahbarlik faoliyati tizimli qilindi. Ushbu vaziyat maktab hayotida qaysi omillarning amaliy tasirini yaxshilash ifodalaydi?","o":["Normativ-huquqiy hujjatlarning nazariy tushunchasi va ahamiyati.","Maktab rahbarining normativ-huquqiy hujjatlar bilan ishlashdagi vazifalari;","Maktab boshqaruvini tartibga soluvchi asosiy normativ-huquqiy hujjatlar;","Boshqaruv samaradorligini oshirishda normativ-huquqiy hujjatlarning roli;"],"a":3}]},{"name":"6-TEST","qs":[{"q":"Past o‘zlashtirish sabablarini diagnostika qilish yo‘nalishlarini ularning ta’riflari bilan moslashtiring.\nTushunchalar:\n1. Kognitiv to‘siqlar\n2. Psixologik muhit\n3. Metodik xatolar \nTa’riflar:\nA) O‘qituvchi tushuntirish usuli o‘quvchining qabul qilish xususiyatiga mos kelmasligi natijasida mavzu yetarli o‘zlashtirilmaydi.\nB) O‘quvchilarning past natijasi ortida nosog‘lom muhit, tazyiq yoki salbiy ijtimoiy omillar yotadi.\nC) Past baholarning asosiy sababi sifatida avvalgi bosqichlardaw mavzular o‘rtasida bilim uzilishi va bo‘shliqlar paydo bo‘lgan bo‘ladi.\nD) O‘quvchilar davomat ko‘rsatkichlari asosida umumiy noto‘g‘ri xulosa chiqarilib, intizomiy choralar qo‘llanilmaydi.","o":["1–B, 2–A, 3–D","1–A, 2–C, 3–B","1–C, 2–B, 3–A","1–D, 2–B, 3–C"],"a":2},{"q":"Maktabning strategik boshqaruvida qo‘llaniladigan tahlil va boshqaruv vositalarini to‘g’ri tarifi bilan moslashtiring.\n1.SWOT\n2.PEST\n3.SMART\nA)Ta’lim muassasasi faoliyatiga ta’sir etuvchi siyosiy iqtisodiy ijtimoiy va texnalogik omillarni tahlil qilish usili\nB)Maktabning kuchli va zaif tomonlari tashqi nmkoniyat va xavf-xatarlarni aniqlashga xizmat qiluvchi tahlil modili\nC)Maqsadlarni aniq. O‘lchavli erishish mumkin muhim va vaqt bilan bog’langan holda belgilash mezonlari majmui\nD)Rahbar faoliyati va mavjud infratuzilma resuslarini taqsimlash va ko‘rsatgichlarini baholash mezoni","o":["1-C.2-A.3-B","1-D.2-B.3-A","1-B.2-D.3-A","1-B.2-A.3-C"],"a":3},{"q":"Maktab direktori o‘quv yili davomida tasdiqlangan smeta hamda me’yoriy hujjatlarga muvofiq maktab ehtiyojlari uchun zaruriy moddiy boyliklarni xarid qilish va tegishli to‘lovlarni o‘z vaqtida amalga oshirish jarayonini belgilangan me’yorlar hamda moliyaviy intizomga qat’iy rioya etgan holda tashkil etdi. Ushbu holatda moliyaviy boshqaruvning qaysi tamoyili eng avvalo namoyon bo‘ladi?","o":["Samaradorlik","Shaffoflik va hisobdorlik","Qonuniylik va me’yoriylik","Riskga sezgir boshqaruv"],"a":2},{"q":"Maktab direktori muassasada yangi o‘zgarish va islohotlarni joriy etish uchun mas’ullarni tayinladi, aniq muddatlarni belgiladi va zaruriy sharoitlarni yaratib berdi. Dastlabki bosqichda ishlar ko‘zlanganidek rivojlandi, biroq vaqt o‘tishi bilan nazorat va e’tibor susayganligi sababli jarayonda o‘sish sekinlashdi. Ushbu holatda rahbar faoliyatida eng avvalo boshqaruvning qaysi tamoyili yetishmadi?","o":["Boshqaruv faoliyatida qarorlar ijrosining qonuniy va me’yoriy asoslarga to‘liq mosligini ta’minlash","Boshqaruv faoliyatida jamoaviy mas’uliyat va vakolatlarni adolatli taqsimlash ko‘nikmasini namoyon etish","Boshqaruv faoliyatida topshiriqlar ijrosini va resurslar taqsimotini qat’iy izchillikda tashkil etish","Boshqaruv faoliyatida monitoring va qo‘llab-quvvatlashning uzluksizligi hamda uzviyligini ta’minlash"],"a":3},{"q":"Maktab o‘qituvchilarini rag’batlantirish va lavozimlarga tavsiya etish jarayonida subyektiv yondoshuv kuchaygan. Mukofat va ustamalar ko‘proq rahbariyatga yaqin bo‘lgan xodimlarga berilmoqda yo‘qori natija ko‘rsatgan ayrim o‘qituvchilar etibordan chetda qolmoqda. Jamoada adolatsizlik hissi shakillanib, ichki nizolar ortgan, ba’zi pedagoglar o‘quvchilar manfatidan ko‘ra shaxsiy manfatini ustin qo‘ya boshlagan. Baholash jarayonida ham xolislik pasaygani sezilmoqda. O‘qituvchilar o‘z qarorlarining maktab obro‘siga ta’sir haqida yetarlicha o‘ylamayapti. Natijada ta’lim sifati va ota- onalar ishonchi pasaymoqda. Rahbar vaziyatni tahlil qilib muamoni chuqurroq omillar bilan bog’liqligini anglaydi.\nSAVOL:mazkur vaziyatda manfatlar to‘qnashuvining ildiz sababini bartaraf etish uchun eng maqbul chora qaysi?","o":["Fiziologik omillarni bartaraf etish. Xolislikni tiklash bo‘yicha tizimli choralarni amalga oshirish","Tashkiliy omillarni bartaraf etish va moddiy rag’batni kuchaytirish choralarni amalga oshirish","Axloqiy va ijtimoiy omillarni adolatli bartaraf etish bo‘yicha izchil choralarni amalga oshirish","Moliyaviy va iqtisodiy omillarni nazorat va qoidabuzarliklarga nisbatan choralarni amalga oshirish"],"a":0},{"q":"Umumiy o‘rta ta’lim muassasasida rahbarning ichki nazorat va teskari aloqa (feedberk) jarayonining to‘g’ri ketma-ketligini aniqlang\n1.Kamchiliklar aniqlanadi va muammolar tahlil qilinadi.\n2.Rahbar tavsiyalar beradi va tavsiyaqilmagan choralarni belgilaydi\n3.Rahbar darslarni kuzatadi va nazorat jarayonini amalga oshiradi\n4.Rahbar zarur yordamni ko‘rsatadi vajarayonni yaxshilaydi","o":["3-2-1-4","2-3-4-1","1-4-2-3","1-2-4-3"],"a":0},{"q":"Maktab direktori iqtidorli, ammo moddiy imkoniyati cheklangan oila farzandiga nufuzli oliygohga kirishi uchun maxsus tayyorgarlik kurslariga qatnashishiga ko‘maklashdi. Natijada o‘quvchi talaba bo‘lib, o‘zining ijtimoiy mavqeini yaxshilash imkoniyatiga ega bo‘ldi. Ushbu jarayonda ta’limning qaysi funksiyasi namoyon bo‘lmoqda?","o":["Ijtimoiy inklyuziya funksiyasi","Ijtimoiy lift funksiyasi","Ta’limdagi adolat va moslashuvchanlik","Ijtimoiy moslashuv funksiyasi"],"a":1},{"q":"6-sinf o‘quvchilarining kasbiy faoliyati va qiziqishlarini rivojlantirishning asosiy maqsadi qaysi javobda to‘g‘ri va aniq ko‘rsatilgan?","o":["O‘quvchilarning kasbiy faoliyati va qiziqishlari rivojlantiriladi hamda kelajakdagi kasbiy tanlovga tayyorgarlikning asosi yaratiladi","O‘quvchilarda mehnat va turli kasblar haqida ilk tasavvur shakllantiriladi hamda boshlang‘ich amaliy ko‘nikmalar poydevori yaratiladi","O‘quvchilar uchun chuqurlashtirilgan akademik ta’lim muhiti yaratiladi hamda muayyan fanlar bo‘yicha tor mutaxassislik beriladi","O‘quvchilar uchun turli kasb-hunar maskanlariga ekskursiya tashkil etiladi hamda ishlab chiqarish obyektlari bilan tanishtiriladi"],"a":0},{"q":"Reintegratsiya tushunchasiga berilgan eng to‘g‘ri ta’rifni aniqlang.","o":["Uzoq muddatli davolanishdan so‘ng o‘quvchining asosiy ta’lim muhitiga, ijtimoiy hayotga va tengdoshlar jamoasiga bosqichma-bosqich qaytishi","Muayyan sabablarga ko‘ra ta’limdan uzilib qolgan o‘quvchining akademik bilimlardagi bo‘shliqlarini to‘ldirish va qayta attestatsiyadan o‘tkazish jarayoni","Sog‘lig‘ida nuqsoni bor o‘quvchini vaqtinchalik masofaviy ta’lim shaklidan uyda ta’lim olish tizimiga o‘tkazish va moslashtirish","Alohida ehtiyojli o‘quvchining umumta’lim maktabi muhitiga va sinf jamoasiga birinchi marta moslashishi hamda ta’lim jarayoniga to‘liq jalb etilishi"],"a":0},{"q":"Xalqaro baholash dasturlarining o‘ziga xos xususiyatlaridan kelib chiqib, o‘quvchilarning maktab dasturi doirasida o‘zlashtirgan akademik bilimlarini xalqaro miqyosda qiyosiy tahlil qiluvchi tadqiqotlarni aniqlang.","o":["PIRLS tadqiqoti","TIMSS tadqiqoti","TALIS tadqiqoti","PISA tadqiqoti"],"a":1},{"q":"Tashkilot direktori huquqiy qarorlarni qabul qilish jarayonida xatoliklardan saqlanish va boshqarish sifatida oshirilishini maqsad qilgan, shu maqsadda u yuqori tashkilotlar bilan muntazam aloqani yo‘lga qo‘ymoqchi va tajribali mutahasislarni ekspertfikrini hisobga oladigan mehazinimlarni joriy etish rejalashtirdi. Bunda qaysi yo‘l uning huquqiy savodxonligini bevosita mustahkamlaydi?","o":["Maslahat va hamkorlikni yo‘lga quyish","Doimiy huquqiy bilimlarni yangilab borish","Amaliy huquqiy ko‘nikmalarni shakillantirish","Malaka oshirish va tajriba almashish seminarlari"],"a":0},{"q":"Xalqaro baholash tadqiqotlari va ularning davriyligi haqida berilgan to‘g‘ri ma’lumotni aniqlang.","o":["O‘quvchi yoshlarning raqamli savodxonlik hamda kreativ fikrlash ko‘nikmalarini baholash xalqaro tadqiqoti 2000-yildan yo‘lga qo‘yilgan bo‘lib, har 3 yilda (2025-yildan e’tiboran har 4 yilda) o‘tkaziladi","4 va 8-sinf o‘quvchilarining matematika hamda tabiiy fanlar bo‘yicha bilim va ko‘nikmalarini baholash tadqiqoti 2000-yildan yo‘lga qo‘yilgan bo‘lib, har 3 yilda (2025-yildan e’tiboran har 4 yilda) o‘tkaziladi","O‘quvchi yoshlarning o‘qish, matematika, tabiiy fanlar bo‘yicha savodxonligi va hayotiy ko‘nikmalarini baholash tadqiqoti 2000-yildan yo‘lga qo‘yilgan bo‘lib, har 3 yilda (2025-yildan e’tiboran har 4 yilda) o‘tkaziladi","Boshlang‘ich sinf o‘quvchilarining matnni tushunish va o‘qish savodxonligi darajasini baholash xalqaro tadqiqoti 2000-yildan yo‘lga qo‘yilgan bo‘lib, har 3 yilda (2025-yildan e’tiboran har 4 yilda) o‘tkaziladi"],"a":2},{"q":"O‘quvchilarning alohida toifalari va ularga xos bo‘lgan pedagogik- psixologik xususiyatlarni to‘g‘ri moslashtiring.\n1.Til to‘sig‘i mavjud bolalar\n2.Iqtidorli va intellektual salohiyatli bolalar\n3.Deviant xulqli bolalar \nA) Davlat tilini yetarli darajada bilmaslik, soddalashtirilgan tushuntirish va qo‘shimcha til ko‘maklariga muhtojlik\nB) Mustaqil va tanqidiy fikrlash ko‘nikmasi yuqori, tez o‘zlashtiruvchi, ammo moslashuvchanlikda alohida yondashuv talab etilishi\nC) Ijtimoiy-axloqiy va huquqiy me’yorlardan chetga chiqish, profilaktik hamda psixologik qo‘llab-quvvatlashga ehtiyojdorlik","o":["1 – A, 2 – B, 3 – C","1 – C, 2 – B, 3 – A","1 – A, 2 – C, 3 – B","1 – B, 2 – A, 3 – C"],"a":0},{"q":"Texnologik evolutsiyaning gipotetik bosqichida sun’iy tizimlar o‘z-o‘zini avtonom tarzda qayta loyihalash va siklik ravishda takomillashtirish qobiliyatiga ega bo‘ladi. Bu jarayon global miqyosda kognitiv portlashni keltirib chiqarishi hamda insoniyat boshqaruvi va nazorat mexanizmlarining butkul yo‘qolishi xavfini yuzaga keltiradi. Ushbu prognozlarda qayd etilgan, inson nazoratidan tashqaridagi avtonom evolutsion tizim konsepsiyasi ilm- fanda qaysi atama bilan ifodalanadi?","o":["Super SI (Super AI)","Tor SI (Narrow AI)","Umumiy SI (AGI)","Neyro SI (Neuro AI)"],"a":0},{"q":"Matematika fanidan o‘quvchilarning o‘zlashtirish ko‘rsatkichlari solishtirish orqali sust ekani aniqlandi. Agarda zaruriy profilaktik choralar ko‘rilmasa, ushbu salbiy holat kelgusi o‘quv yilida ham takrorlanishi mumkinligi xulosa qilindi. Ushbu vaziyatda kelgusi o‘quv yili tendensiyasini va ehtimoliy natijalarni oldindan baholash faoliyatida eng avvalo qaysi boshqaruv/tahlil usuli namoyon bo‘ladi?","o":["Prognozlash","Yakuniy tahlil","Solishtirma tahlil","Diagnostik tahlil"],
