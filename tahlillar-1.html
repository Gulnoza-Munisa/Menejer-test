<script>
const Q=[{"n": 1, "q": "Maktab boshqaruvining asosiy tamoyillarini ularning ta’riflari va mezonlari bilan moslashtiring.\n1) Demokratiklik tamoyili\n2) Adolatlilik tamoyili\n3) Ilmiylik tamoyili\nA) Rag‘batlantirishda shaxsiy munosabatni chetga surib, hamma uchun teng, shaffof va ochiq mezonlarni (KPI) asos qilish\nB) Har qanday inqirozli vaziyatda faqat ma’muriy buyruqbozlik va qat’iy rejalashtirishga tayanish\nC) Subyektiv yondashuvdan voz kechib, jarayonlarni diagnostika, tahlil va qonuniyatlarga tayanib boshqarish\nD) Jamoani boshqaruvga faol jalb etish, qarorlarni kengash va ochiq muhokamada qabul qilish", "o": ["1–D, 2–C, 3–A", "1–A, 2–D, 3–C", "1–B, 2–A, 3–D", "1–D, 2–A, 3–C"], "a": 3}, {"n": 2, "q": "Direktor TALIS tavsiyalari va milliy islohotlar bilan uyg‘un holda maktab boshqaruvini transformatsiyalash rejasini ishlab chiqmoqda.\nQaysi variant boshqaruvda eng maqbul strategik yo‘nalishlarni ifodalaydi?", "o": ["Kadrlar zaxirasini yaratish, avtonomiya va hisobdorlikni muvozanatlash, jamoatchilik ishtirokini kengaytirish, pedagogik yetakchilikni ustuvor qilish, xalqaro tajribalarni moslashtirish", "Kadrlar zaxirasini yaratish, avtonomiyani kengaytirish, jamoatchilik ishtirokini kuchaytirish, ma’muriy nazoratni ustuvor qilish, xalqaro tajribalarni joriy etish", "Pedagogik yetakchilikni kuchaytirish, hisobdorlikni nazorat bilan almashtirish, jamoatchilik ishtirokini rivojlantirish, kadrlar salohiyatini oshirish, xorijiy tajribalarni o‘rganish", "Kadrlar zaxirasini rivojlantirish, avtonomiya va hisobdorlikni muvofiqlashtirish, demokratik boshqaruvni qo‘llash, pedagogik yetakchilikni kuchaytirish, tajribalarni milliy sharoitga tatbiq etish"], "a": 0}, {"n": 3, "q": "Direktor o‘qituvchilarning kasbiy ehtiyojlarini aniqlash va maktab muhitini xalqaro standartlar darajasida tahlil qilish uchun TALIS metodologiyasidan foydalanishga qaror qildi.\nBu tadqiqotda olinadigan ma’lumotlarning ishonchliligi qanday ta’minlanadi?", "o": ["Yuqori turuvchi tashkilotlar bergan rasmiy hisobotlarni qiyosiy tahlil qilish orqali", "O‘qituvchilar va direktorlarning kasbiy faoliyati yuzasidan anonim so‘rovnomalar orqali", "Rahbarlar va pedagoglarning dars jarayonlarini ekspertlar bevosita kuzatishi orqali", "O‘quvchilar o‘rtasida o‘qitish sifati bo‘yicha test sinovlari orqali"], "a": 1}, {"n": 4, "q": "Akkreditatsiyaning asosiy mazmuni nimadan iborat?", "o": ["Faoliyatning davlat ta’lim standartlari va talablariga mosligini baholash hamda rivojlantirish yo‘nalishlarini belgilashdan", "Faoliyatning davlat ta’lim standartlari va talablariga mosligini e’tirof etish hamda davlat hujjati berish huquqini tan olishdan", "Faoliyatning davlat ta’lim talablariga mosligini aniqlash va sifat ko‘rsatkichlarini mezonlar asosida mustahkamlashdan", "Faoliyatning standartlarga mos yuritilishini aniqlash va attestatsiya asosida umumiy baho berishdan"], "a": 1}, {"n": 5, "q": "47-maktab direktori o‘quv yili boshida dars kuzatish rejasini tasdiqladi. Birinchi chorakda direktor va o‘rinbosarlar 60 dan ortiq darsga kirdi, har bir kuzatuv bo‘yicha bayonnoma to‘ldirilib, papkaga tikib qo‘yildi. Chorak yakunida o‘quvchilar bilimi diagnostika qilinib, natijalar jadvalga kiritildi va tumanga hisobot sifatida yuborildi. Biroq o‘qituvchilar o‘z darsi qanday baholanganini va nimani yaxshilash kerakligini bilmay qoldi: kuzatuvdan keyin ular bilan hech kim suhbatlashmadi, tavsiya ham, metodik yordam ham berilmadi. Ikkinchi chorakda darslarda o‘sha kamchiliklar takrorlandi, diagnostika natijalari deyarli o‘zgarmadi. Ayrim o‘qituvchilar esa «darsga kirish — xato qidirish uchun» deb xavotirlana boshladi.\nDirektor faoliyatida qaysi boshqaruv tamoyili to‘liq amalga oshmagan?", "o": ["Rejalilik tamoyili", "Rag‘batlantirish va motivatsiya tamoyili", "Demokratiklik va jamoaviy boshqaruv tamoyili", "Nazorat va teskari aloqa tamoyili"], "a": 3}, {"n": 6, "q": "Direktor choraklik metodik ishlar reja-tadbirlarini tuzdi, lekin ular maktab strategiyasi, ta’lim sifati, intizom va natijadorlik bilan uyg‘unlashmagan.\nBu holatda qaysi boshqaruv tamoyili buzilgan?", "o": ["Rejalilik", "Demokratiklik", "Maqsadlilik", "Nazorat va teskari aloqa"], "a": 2}, {"n": 7, "q": "Maktabni loyiha asosida boshqarish bosqichlarining to‘g‘ri ketma-ketligini belgilang.\n1) Resurs, muddat va mas’ullarni belgilash (reja tuzish)\n2) KPIlar asosida natijani baholash (monitoring)\n3) Strategik maqsadga mosligini aniqlash\n4) Loyihani maktab tizimiga integratsiya qilish\n5) Loyihani bosqichma-bosqich amalga oshirish (joriy etish)", "o": ["1 → 2 → 3 → 5 → 4", "3 → 1 → 5 → 2 → 4", "3 → 2 → 1 → 5 → 4", "1 → 3 → 5 → 2 → 4"], "a": 1}, {"n": 8, "q": "O‘zgarishga qarshilik qilayotgan xodimni «muammo» emas, signal deb ko‘rish direktor uchun nimani anglatadi?", "o": ["Qarshilikni xodimning shaxsiy munosabati bilan bog‘lab, individual tushuntirish ishlarini kuchaytirishni", "Qarshilikni jamoa ichidagi moslashuv jarayoni sifatida ko‘rib, umumiy muloqotni faollashtirishni", "Qarshilik ortida tizim darajasidagi muammo borligini ko‘rib, sabablarni chuqur tahlil qilishni", "Qarshilikni tabiiy holat deb baholab, bosqichma-bosqich moslashtirishni"], "a": 2}, {"n": 9, "q": "Strategik rejalashtirish tushunchalarini mazmuni, vaqt yo‘nalishi va mezonlari bilan moslashtiring.\n1) Missiya\n2) Vizyon\n3) Strategik maqsad\nA) Kelajakdagi ideal holat, 5–10 yillik muddat, jamoani ilhomlantiruvchi keng va tasviriy\nB) Strategik maqsadlarni amalga oshirish mexanizmi, qisqa muddatli, yillik yo‘l xaritalariga asos\nC) Vizyonga erishish uchun 3–5 yilda bajariladigan, aniq va o‘lchanadigan (KPI) natijalar\nD) Bugungi va doimiy faoliyat, «Biz nega mavjudmiz?» savoliga qisqa javob", "o": ["1–A, 2–B, 3–C", "1–D, 2–C, 3–A", "1–D, 2–A, 3–C", "1–C, 2–A, 3–D"], "a": 2}, {"n": 10, "q": "Ustuvorlikni tanlash mezonlarini ularning amaliy talablari bilan moslashtiring.\n1) Real sharoitda bajarilishi\n2) Eng katta ta’sir berishi\n3) Vaqt bilan bog‘langanligi\nA) Hamma yo‘nalishda kuchli bo‘la olmagani uchun sifatga eng katta ta’sir beradigan 3–5 vazifa bilan cheklanish\nB) Tanlangan maqsadlar uzoq cho‘zilmay, aynan 5 yil ichida aniq natija berishi\nC) Maqsad 3–5 yil yoki aniq kalendar yillari (2026–2030) bilan chegaralangan bo‘lishi\nD) Maqsad maktabning real resurslari, kadrlari, moliyaviy va moddiy-texnik imkoniyatlari doirasida bajarilishi", "o": ["1–D, 2–A, 3–C", "1–D, 2–B, 3–C", "1–A, 2–B, 3–D", "1–C, 2–B, 3–A"], "a": 1}, {"n": 11, "q": "112-maktabda yangi o‘quv yilidan o‘quvchilar portfoliosini raqamli platformada yuritish joriy etilmoqda. Direktor pedagogik kengashda o‘zgarishning sababi va maqsadini batafsil tushuntirdi, platformadan foydalanish bo‘yicha ikki kunlik amaliy seminar ham o‘tkazildi. Shunga qaramay, bir oy o‘tib ham o‘qituvchilarning yarmidan ko‘pi platformaga ma’lumot kiritmadi. Direktor o‘rinbosari buni «o‘qituvchilar erinmoqda» deb baholab, haftalik hisobot talab qilishni taklif etdi. Suhbatlarda esa boshqa manzara ochildi: o‘qituvchilar ikki yil oldin boshlangan «elektron kundalik» loyihasi yarim yo‘lda to‘xtab qolganini, o‘shanda kiritilgan ma’lumotlar yo‘qolib ketganini eslatdi. «Bu ham bir-ikki oydan keyin unutiladi», — dedi ko‘pchilik. Platformaning o‘zi esa ular uchun qiyin emasligi ma’lum bo‘ldi.\nModulga ko‘ra, jamoadagi qarshilikning asosiy sababi qaysi?", "o": ["Avvalgi o‘zgarish samarasiz yakunlangani sababli ishonchsizlik", "Yangi talab va texnologiyalar murakkab ko‘ringani sababli paydo bo‘lgan qo‘rquv", "O‘zgarishning sababi va maqsadi xodimlarga yetarli tushuntirilmagani", "Mavjud ish tartibi qulayroq bo‘lgani sababli odatdan voz kecha olmaslik"], "a": 0}, {"n": 12, "q": "45-maktab direktori yangi o‘quv yilining birinchi oyida uchta yangilikni e’lon qildi: elektron jurnalga to‘liq o‘tish, har bir o‘qituvchi uchun haftalik ochiq dars va yangi baholash mezonlari. Har bir yangilik uchun mablag‘ va texnika ajratildi, har biriga mas’ul o‘rinbosar tayinlandi. Oy oxiriga kelib o‘qituvchilar charchaganini aytdi, elektron jurnal yarim to‘ldirildi, ochiq darslar rasmiyatchilikka aylandi. Direktor «hamma sharoit yaratildi-ku» deb hayron.\nModulga ko‘ra, direktor qarshilikni kamaytirishning qaysi usulini buzgan?", "o": ["Jarayon davomida barqaror qo‘llab-quvvatlash va monitoring olib borish", "Qarshilikni tanqid sifatida qabul qilib, ochiq fikr almashish muhitini yaratish", "Moslashgan xodimlarni rag‘batlantirib, kichik yutuqlarni nishonlash", "O‘zgarishni bosqichlarga bo‘lib, har bosqich natijasini tahlil qilish"], "a": 3}, {"n": 13, "q": "Maktabda 4-sinflarda o‘quvchi savodxonligi pastligi aniqlandi. Direktor uch yil ichida natija ko‘rsatadigan aniq maqsad qo‘ymoqchi.\nQaysi variant strategik maqsad talablariga javob BERMAYDI?", "o": ["2026–2028-yillarda 4-sinf o‘quvchilarining o‘qish savodxonligini diagnostika asosida kamida 15 foizga oshiramiz", "2026–2028-yillarda 4-sinf o‘quvchilarida savodxonlikni zamonaviy metodlar yordamida kamida 15 foizga yuksaltiramiz", "2026–2028-yillarda 4-sinf o‘quvchi savodxonligiga samaradorlikning natijasini kamida 15 foizga oshiramiz", "2026–2028-yillarda 4-sinf o‘quvchilarining savodxonlik darajasini malakali o‘qituvchilar orqali kamida 15 foizga oshiramiz"], "a": 2}, {"n": 14, "q": "78-maktabda «O‘qish soati» loyihasi boshlandi: maqsad — 5-sinflarda o‘qish tezligi va matnni tushunishni oshirish. Loyiha maktab strategiyasiga kiritildi, mas’ul metodist, muddat va kutubxona resurslari belgilandi. Uch oy davomida 5-sinflarda har kuni 20 daqiqalik o‘qish soati o‘tkazildi. O‘qituvchilar va ota-onalar loyihani maqtadi, sinf rahbarlari «bolalar kitobga qiziqib qoldi» deb hisobot yozdi. Shundan so‘ng direktor loyihani yangi chorakdan 1–11-sinflarning barchasiga majburiy kiritish haqida buyruq loyihasini tayyorladi. Metodist esa loyiha boshida o‘tkazilgan o‘qish tezligi sinovi bilan hozirgi holat hali solishtirilmaganini eslatdi.\nModulga ko‘ra, direktor buyruqni imzolashdan oldin nima qilishi kerak?", "o": ["Loyihaning maktab vizyoni va strategik maqsadlariga mosligini qayta tekshirish", "Belgilangan KPIlar bo‘yicha natijani tahlil qilib, loyiha samarasini baholash", "Barcha sinflar uchun mas’ul, muddat va resurslarni oldindan taqsimlab chiqish", "Ota-onalar va o‘qituvchilarning ijobiy fikrini so‘rovnoma bilan rasmiylashtirish"], "a": 1}, {"n": 15, "q": "Ishchi guruh strategiya loyihasidagi missiya bandiga shunday yozdi: «2030-yilgacha bitiruvchilarning oliy ta’limga kirish ko‘rsatkichini 60 foizga yetkazamiz». Pedagogik kengashda metodist bu jumla missiya emasligini aytdi va uni boshqa bandga ko‘chirishni taklif qildi.\nModulga ko‘ra, jumla qaysi bandga ko‘chirilishi kerak va nega?", "o": ["Vizyonga — unda maktabning kelajakdagi holati tasvirlangan", "Strategik maqsadga — natijasi aniq va o‘lchab bo‘ladi", "Qadriyatlarga — u jamoaning ustuvor intilishini ifodalaydi", "Yillik rejaga — unda bajariladigan vazifa va muddat bor"], "a": 1}, {"n": 16, "q": "Strategik rejalashtirishda ishchi guruh hujjat tayyorlamoqda: missiya, vizyon, strategik maqsad va qadriyatlar alohida ko‘rsatilishi kerak.\nQaysi variant aynan missiyaga eng mos?", "o": ["Har bir o‘quvchiga sifatli ta’lim berib, yaqin yillarda mintaqaning eng nufuzli ta’lim maskaniga aylanamiz", "Halollik va ijodkorlik qadriyatlari asosida har bir o‘quvchini bilimli, raqobatbardosh shaxs sifatida tarbiyalashga xizmat qilamiz", "Har bir o‘quvchining intellektual va ma’naviy rivojlanishini ta’minlab, uni jamiyatga munosib shaxs sifatida tayyorlashni maqsad qilamiz", "Har bir o‘quvchining qobiliyatini rivojlantirib, uni bilimli va mas’uliyatli shaxs sifatida tarbiyalashga xizmat qilamiz"], "a": 3}, {"n": 17, "q": "Rahbarlarning xatti-harakatini temperament turi bilan moslashtiring.\n1) Yangi buyruqni bir necha bor qayta o‘qiydi, har bir xavfni yozib chiqadi va o‘z xatosini qayta-qayta tahlil qiladi\n2) Ota-ona baqirib kirganda ham ovozini ko‘tarmaydi, gapini oxirigacha eshitadi va shoshilmay xulosa chiqaradi\n3) Yangi jamoaga kelgan birinchi haftadayoq hamma bilan til topishib, yig‘ilishlarni ko‘tarinki kayfiyatda o‘tkazadi\nA) Flegmatik\nB) Sangvinik\nC) Melanxolik\nD) Xolerik", "o": ["1–C, 2–A, 3–B", "1–C, 2–A, 3–D", "1–A, 2–C, 3–B", "1–D, 2–A, 3–B"], "a": 0}, {"n": 18, "q": "Pedagogik kengashda tajribali o‘qituvchi direktorning yangi tartibini hammaning oldida keskin tanqid qildi. Direktor ovozini ko‘tarmadi, «fikringiz uchun rahmat, buni alohida muhokama qilamiz» dedi va kengashni davom ettirdi. Ertasi kuni o‘qituvchini chaqirib, avval nimadan xavotirda ekanini so‘radi: yangi tartib uning qo‘shimcha darslariga to‘g‘ri kelgan ekan. Direktor jadvalni u bilan birga qayta ko‘rib chiqdi.\nDirektorning xatti-harakati, eng avvalo, qaysi kompetensiyani ko‘rsatadi?", "o": ["Rahbarning ichki pozitsiyasi", "Emotsional intellekt", "Professional intizom", "O‘zini boshqarish"], "a": 1}, {"n": 19, "q": "Rahbar duch kelgan muammoni temperament turi bilan moslashtiring.\n1) «Hammasi joyida bo‘ladi, bizda muammo yo‘q» deb, akkreditatsiyaga tayyorgarlikni oxirgi haftaga qoldirdi\n2) Yig‘ilishda o‘qituvchining e’tirozini eshitib, darhol ovozini ko‘tardi, keyin aytganidan afsuslandi\n3) Bitta ota-onaning shikoyatidan keyin bir hafta xavotirda yurdi va qaror qabul qilolmay qoldi\nA) Xolerik\nB) Sangvinik\nC) Flegmatik\nD) Melanxolik", "o": ["1–C, 2–A, 3–D", "1–B, 2–D, 3–A", "1–B, 2–A, 3–C", "1–B, 2–A, 3–D"], "a": 3}, {"n": 20, "q": "Rahbar mas’uliyatining quyidagi jihatlari qanday ketma-ketlikda amalga oshiriladi?\n1) Xavf-xatarlarni tahlil qilish\n2) Xodimlarni o‘qitish\n3) Shaffoflik va monitoringni yo‘lga qo‘yish\n4) Tizimli chora-tadbirlar ishlab chiqish\n5) Qoidabuzarliklarga nisbatan chora belgilash", "o": ["1 → 2 → 4 → 3 → 5", "1 → 4 → 3 → 2 → 5", "1 → 4 → 2 → 3 → 5", "4 → 1 → 2 → 5 → 3"], "a": 2}, {"n": 21, "q": "Dars tugashi bilan bir ota-ona direktor xonasiga baqirib kirdi: «O‘qituvchingiz bolamni butun sinf oldida haqorat qildi, hozir ota-onalar guruhiga yozaman!» Xonada o‘rinbosar va yana ikki ota-ona bor edi. O‘qituvchi bu paytda darsda.\nBoshqaruv psixologiyasiga ko‘ra, direktorning birinchi qadami qanday bo‘lishi kerak?", "o": ["Ota-onani tinchlantirib, o‘qituvchiga bugunoq tushuntirish xati yozdirishni va’da qilish", "Ota-onaga shikoyatni yozma ariza qilib berishni aytib, ko‘rib chiqish muddatini belgilash", "O‘qituvchi tajribali ekanini aytib, ota-onadan shoshilmaslikni va guruhga yozmaslikni so‘rash", "Shoshilmay, ohangni pasaytirib, nima bo‘lgani, qachon va kim ko‘rganini aniqlashtirish"], "a": 3}, {"n": 22, "q": "Vaziyatlarni boshqaruv psixologiyasi qonuniyatlari bilan moslashtiring.\n1) Direktor jamoadagi eng xushmuomala, hammaga yoqadigan o‘qituvchini fan oyligiga mas’ul qildi, lekin tadbir sust o‘tdi\n2) Direktor uch o‘qituvchiga bir xil topshiriqni shaxsan va yozma berdi, uchalasi uni uch xil mazmunda bajardi\n3) O‘qituvchi o‘zini maktabdagi eng kuchli mutaxassis deb hisoblaydi, ammo o‘quvchilari natijasi o‘rtachadan past\nA) O‘z-o‘zini baholashning noadekvatligi\nB) Inson inson tomonidan yetarli aks ettirilmasligi\nC) Natijaning noaniqligi\nD) Boshqaruv ma’lumotlari mazmunining yo‘qolib borishi", "o": ["1–C, 2–B, 3–A", "1–B, 2–D, 3–A", "1–B, 2–C, 3–A", "1–A, 2–C, 3–B"], "a": 2}, {"n": 23, "q": "Boshqaruv psixologiyasi qonuniyatlarini ularning amaliy mazmuni bilan moslashtiring.\n1) Kompensatsiya qonuni\n2) Natijaning noaniqligi qonuni\n3) O‘z-o‘zini baholashning noadekvatligi\nA) Xodim o‘ziga yuqori baho beradi, lekin bu baho o‘zini oqlamaydi — «aysberg» ko‘rinishi\nB) Har kim mukammal emas: bilim fazilat bilan to‘ldiriladi, kamchilik tajriba hisobiga yopiladi\nC) Har bir xodim individual va takrorlanmas, topshiriqni har xil mazmunda bajaradi\nD) Buyruq ijrosida xodimlarda teskari norozilik — «bumerang» effekti paydo bo‘ladi", "o": ["1–B, 2–A, 3–C", "1–B, 2–C, 3–A", "1–C, 2–A, 3–B", "1–B, 2–D, 3–C"], "a": 1}, {"n": 24, "q": "Boshqaruv qarorini qabul qilish bosqichlarini to‘g‘ri tartibda joylashtiring.\n1) Pedagogik kengashda tanlangan yechimni muhokama qilib, kelishib olish\n2) Samaradorlik, resurs, vaqt va xavf bo‘yicha baholash ko‘rsatkichlarini belgilash\n3) Chorak natijalari va ichki-tashqi omillarni o‘rganib, asosiy muammoni belgilash\n4) Belgilangan ko‘rsatkichlar asosida eng maqbul yechimni tanlash\n5) Muammoni hal etishning bir nechta mumkin bo‘lgan yechimini ishlab chiqish", "o": ["3 → 5 → 2 → 4 → 1", "3 → 2 → 5 → 1 → 4", "2 → 3 → 5 → 4 → 1", "3 → 2 → 5 → 4 → 1"], "a": 3}, {"n": 25, "q": "Maktabda o‘quvchilarning chorak yakunidagi ko‘rsatkichlari kutilgan natijaga erishmadi. Rahbar ichki monitoring natijalari, pedagoglar fikri va o‘quvchilar ehtiyojlarini o‘rgandi. Bir nechta muqobil yechim ishlab chiqilib, pedagogik kengashda muhokama qilindi. Qaror ijrosi uchun muddatlar, mas’ul ijrochilar, nazorat va baholash mexanizmlari belgilandi.\nBu qarorning eng aniq ilmiy boshqaruv tavsifi qaysi?", "o": ["Pedagogik maqsadga yo‘naltirilgan, monitoring va pedagoglar fikriga asoslangan, ijrochilari belgilangan, nazorat hisobotlar orqali tashkil etilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, jamoaviy muhokamaga tayangan va qaror qabul qilishning asosiy bosqichlari amalga oshirilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, tahlilga asoslangan, muqobil yechimlar ko‘rilgan, ijrochi va muddatlar buyruq bilan rasmiylashtirilgan qaror", "Pedagogik maqsadga yo‘naltirilgan, jamoaviy muhokamada ishlangan, ijrochilar belgilangan, nazorat muntazam yig‘ilishlar orqali tashkil etilgan qaror"], "a": 1}, {"n": 26, "q": "Yuqori sinflarda dars qoldirish, baho pasayishi, tadbirlarda ishtirok kamayishi kuzatilmoqda. Direktor sinf rahbarlari orqali ota-onalarni ogohlantiradi, biroq ko‘pchilik befarq, ba’zilari chatlarda norozi. O‘qituvchilar o‘zini himoyasiz his qilmoqda. Veb-saytda hisobotlar chiqmoqda, lekin ota-onalar bilan samarali muloqot yo‘q. Direktor tizimli yondashmoqchi.\nOta-onalar bilan hamkorlikni tiklash va o‘quvchilar faolligini oshirishning eng maqbul yechimi qaysi?", "o": ["Ochiq eshiklar va ochiq muloqot kunlari, seminar va treninglar orqali ota-onalar qiziqishini oshirish, media va ijtimoiy hamkorlikni faollashtirish", "Muntazam ochiq muloqot kunlari va seminarlar o‘tkazib, yutuq va muammolarni birga muhokama qilish, hamkorlikni kuzatuv kengashi orqali rasmiylashtirish", "Sinf rahbarlari va o‘qituvchilar bilan birga ota-onalar uchun ochiq tadbirlar, media faolligi va jamoaviy loyihalar orqali hamkorlikni yo‘lga qo‘yish", "Ota-onalar qo‘mitasi va kuzatuv kengashi orqali muloqot o‘rnatib, faoliyatni media orqali yoritish va seminarlar orqali jalb etish"], "a": 0}, {"n": 27, "q": "Tabiiy fanlardan o‘zlashtirish pasaydi. Rahbar tezkor yig‘ilish o‘tkazib, darsni kuchaytirish va ichki nazoratni qat’iylashtirish bo‘yicha qaror qildi, qo‘shimcha hisobotlar va vazifalar joriy etildi. Laboratoriya jihozlari yetishmasligi, materiallarning eskirgani va yuklama ortgani chuqur o‘rganilmadi. Masala pedagogik kengashda muhokama qilinmadi. Bir necha oydan keyin ham natija o‘zgarmadi.\nBoshqaruv jarayonining qaysi bo‘g‘inida jiddiy kamchilik bor?", "o": ["Monitoring natijalari yuzaki tahlil qilingan, pedagoglar fikri olinmagan, choralar samaradorligi tizimli baholanmagan", "Qaror ijrosida mas’ul shaxslar va muddatlar belgilanmagan, tizimli nazorat va teskari aloqa yo‘lga qo‘yilmagan", "Jamoaviy muhokama va muammoning chuqur tahlili o‘tkazilmagan, shu sababli asosiy sabablar aniqlanmay, samarali chora belgilanmagan", "Resurs va materiallar yetishmasligi aniqlangan bo‘lsa-da, ularni bartaraf etish rejasi va moliyaviy imkoniyatlar baholanmagan"], "a": 2}, {"n": 28, "q": "O‘quvchilar olimpiadalarda yuqori natija ko‘rsatmoqda, pedagoglar malakali. Biroq ota-onalar va mahalla orasida maktab faoliyati ochiq emas, yutuqlar yoritilmaydi, degan fikr bor. Rasmiy axborot kam beriladi, ijtimoiy tarmoq sahifalari faolsiz. Maktabning tashqi imiji ichki imkoniyatlariga mos emas.\nImijni yaxshilash uchun eng to‘g‘ri va ustuvor qaror qaysi?", "o": ["Ijtimoiy tarmoq va veb-sayt orqali yutuqlarni tizimli yoritib, ota-onalar va mahalla bilan ishonchli muloqot kanallarini yo‘lga qo‘yish", "Faoliyatni strategik asosda yo‘lga qo‘yib, yutuqlar va jarayonlar haqida tezkor, tizimli va shaffof axborot berish orqali ishonchli muloqot o‘rnatish", "Ota-onalar qo‘mitasi va mahalla bilan tizimli uchrashuvlar o‘tkazib, yutuqlarni shaffof taqdim etish va hamkorlikni strategik yo‘lga qo‘yish", "PR faoliyatini tizimli rejalashtirib, yutuqlar haqida tezkor axborot berish, ijtimoiy tarmoq va an’anaviy vositalar orqali muloqotni kuchaytirish"], "a": 1}, {"n": 29, "q": "Maktab PR faoliyatini samarali tashkil etish bosqichlarining to‘g‘ri ketma-ketligini aniqlang.\n1) Har chorak oxirida ota-onalar fikri va sahifa ko‘rsatkichlari qanday o‘zgarganini o‘lchash\n2) Ochiq eshiklar kunini o‘tkazib, yutuqlarni sahifada haftalik yoritishni boshlash\n3) Natijaga qarab kontent rejasi va muloqot kanallarini qayta ko‘rib chiqish\n4) Ota-onalar va mahalla orasida so‘rovnoma o‘tkazib, maktab haqidagi fikrni o‘rganish\n5) PR strategiyasi, yillik reja va mas’ul xodimlarni tasdiqlash", "o": ["4 → 1 → 5 → 2 → 3", "4 → 5 → 1 → 2 → 3", "5 → 4 → 2 → 1 → 3", "4 → 5 → 2 → 1 → 3"], "a": 3}, {"n": 70, "q": "Boshqaruv vazifalarini dasturiy vosita bilan moslashtiring.\n1) Sinflar kesimida reyting va yillik ko‘rsatkichlarni kuzatish\n2) Ma’lumotnomalarni bir xil rasmiy ko‘rinishda tez tayyorlash\n3) O‘rinbosarlar bilan bitta hujjat ustida bir vaqtda ishlash\nA) Word shablonlari\nB) Excel jadvallari\nC) PowerPoint taqdimoti\nD) Google Docs hujjati", "o": ["1–B, 2–A, 3–C", "1–B, 2–D, 3–A", "1–A, 2–B, 3–D", "1–B, 2–A, 3–D"], "a": 3}, {"n": 73, "q": "Direktor chatbotga yozdi: «Siz tajribali ta’lim menejerisiz. Maktabimizda 900 nafar o‘quvchi bor, moddiy-texnik baza o‘rtacha, ustuvor yo‘nalish — ta’lim sifati. Maktab uchun rivojlanish strategiyasi yozing.» Javob juda umumiy chiqdi.\nUchlik qoidaning qaysi talabi bajarilmagan?", "o": ["Aniq rolni yuklash", "Vaziyatni to‘liq bayon etish", "Javobni tanqidiy tekshirish", "Natijani aniqroq talab etish"], "a": 3}, {"n": 74, "q": "Maktab boshqaruvidagi holatlarni SI qo‘llanish yo‘nalishi bilan moslashtiring.\n1) O‘quvchilar davomatini avtomatik kuzatish va tahlil qilish\n2) Natijalar dinamikasidan kamchiliklarni erta aniqlash\n3) Videonazorat orqali favqulodda vaziyatni aniqlash\nA) Ma’muriy vazifalarni optimallashtirish\nB) Ta’lim sifatini nazorat qilish\nC) Ma’lumotlar tahlili va qaror qabul qilish\nD) Xavfsizlikni ta’minlash", "o": ["1–A, 2–B, 3–D", "1–A, 2–C, 3–D", "1–B, 2–C, 3–D", "1–A, 2–C, 3–B"], "a": 1}, {"n": 75, "q": "Direktor xavf guruhidagi o‘quvchilarni aniqlash uchun ularning familiyasi, baholari va oilaviy sharoiti yozilgan jadvalni chatbotga yuklab tahlil qildirmoqchi. Ota-onalardan rozilik olinmagan.\nDirektor eng avvalo qanday yo‘l tutishi kerak?", "o": ["Chatbot xulosasini tekshirib, so‘ng qaror qabul qiladi", "Yakuniy qarorni chatbot emas, pedagogik jamoa qabul qiladi", "Ma’lumotni roziliksiz chatbot tahliliga topshirmaydi", "Tahlil natijasini ota-onalarga oshkora ma’lum qiladi"], "a": 2}, {"n": 76, "q": "Modulga ko‘ra qaysi ikki chatbot bepul akkauntlarda ko‘proq limit taqdim etishi bilan ajralib turadi?", "o": ["DeepSeek va Grok", "Gemini va Copilot", "ChatGPT va Claude", "Grok va Gemini"], "a": 0}, {"n": 77, "q": "Maktabdagi vaziyatlarni ular uchun eng mos raqamli vosita bilan moslashtiring.\n1) Hujjatlar arxivini internetda saqlab, istalgan qurilmadan ko‘chirib olish\n2) Majlisda kanal havolasini telefon kamerasi bilan bir zumda ochish\n3) Ikki o‘rinbosar bir hujjatni bir vaqtda tahrirlab, o‘zgarishni darhol ko‘rishi\nA) Google Docs\nB) Google Drive\nC) QR kod\nD) Google Sheets", "o": ["1–B, 2–C, 3–D", "1–A, 2–C, 3–B", "1–B, 2–C, 3–A", "1–D, 2–C, 3–A"], "a": 2}, {"n": 78, "q": "O‘qituvchilar ChatGPT bilan ishlashga o‘rganib qolgan. Direktor ularga Microsoft xizmatidagi chatbotni tavsiya qilib, «ishlashi sizga tanish bo‘ladi» dedi.\nDirektor tavsiya qilgan chatbot haqida qaysi tavsif to‘g‘ri?", "o": ["Copilot — Gemini bazasida, g‘oyalar yaratishda ustun", "Grok — ChatGPT bazasida ishlaydi, o‘xshash ustunliklarga ega", "Copilot — ChatGPT bazasida, bepul limiti ko‘proq", "Copilot — ChatGPT bazasida, unga o‘xshash afzalliklarga ega"], "a": 3}, {"n": 79, "q": "Boshqaruv vazifalarini SI vositasi bilan moslashtiring.\n1) Murakkab boshqaruv jarayoni matnini sxema va infografikaga aylantirish\n2) «Yashil maktab» loyihasi bo‘yicha taqdimotni brauzerda tez tayyorlash\n3) Bepul imkoniyat bilan tasvir yaratib, uning bir qismini Canvas orqali tahrirlash\nA) Gamma\nB) Leonardo AI\nC) Napkin\nD) MidJourney", "o": ["1–C, 2–A, 3–D", "1–C, 2–A, 3–B", "1–A, 2–C, 3–B", "1–C, 2–D, 3–B"], "a": 1}, {"n": 80, "q": "O‘zgarish davridagi belgilarni qiyinchilik turi bilan moslashtiring.\n1) Muddat noaniq, mas’ullar belgilanmagan, reja yo‘q\n2) Ko‘nikma yetishmaydi, motivatsiya pasaygan, qarshilik kuchaygan\n3) Ota-onalar bosimi, tekshiruvlar, jamoatchilik e’tibori\nA) Kadrlar\nB) Tashqi\nC) Tashkiliy\nD) Psixologik", "o": ["1–A, 2–C, 3–B", "1–C, 2–D, 3–B", "1–C, 2–A, 3–D", "1–C, 2–A, 3–B"], "a": 3}, {"n": 81, "q": "Maktabda yangi baholash tizimi joriy etildi. O‘qituvchilar «nima o‘zgaradi?» degan savollarga javob ololmayapti. Mish-mishlar ko‘paydi va norozilik kuchaydi.\nDirektor qaysi muammoni birinchi navbatda bartaraf etishi kerak?", "o": ["Kommunikatsiya bo‘shlig‘ini", "Jarayon izchilligi sustligini", "Tushuntirish ishlari zaifligini", "Jamoa ishonchi pasayishini"], "a": 0}, {"n": 82, "q": "Yangi elektron kundalik joriy etilgach, baholar o‘z vaqtida kiritilmay qoldi. Direktor yig‘ilishda masalani ochiq muhokama qildi, o‘qituvchilarni hurmat bilan tingladi va kechikkanlarga ogohlantirish berdi. Ammo kechikishga sabab bo‘lgan internet, qurilma va yo‘riqnoma masalasi o‘rganilmadi — keyingi oy ham baholar kechikdi.\nDirektor qiyinchiliklarni boshqarishning qaysi tamoyiliga amal qilmagan?", "o": ["Tizimlilik tamoyili", "Ochiq muloqot tamoyili", "Oldini olish tamoyili", "Insonparvarlik tamoyili"], "a": 0}, {"n": 83, "q": "Qaysi holatda «5 nega?» usuli eng samarali hisoblanadi?", "o": ["Muammo sababi takroriy tekshirilayotganida", "Muammo ildizi chuqur aniqlanayotganida", "Muammo takroran davom etayotganida", "Muammo natijasi qayta baholanayotganida"], "a": 2}, {"n": 84, "q": "Maktabda yangi raqamli platforma joriy qilindi. Rahbar trening tashkil qildi, mas’ullar tayinlandi, dastlabki ma’lumotlar yuklandi. Bir necha oy o‘tib foydalanuvchilar texnik yordam va yordamnomalarga ehtiyoj sezdi, ayrim ma’lumotlar noto‘g‘ri kiritildi, platforma samarasi pasaydi. Rahbar tizimdan kelayotgan ma’lumotlarni tahlil qilish va tuzatish bo‘yicha yetarli ish olib bormagan.\nO‘zgarishlarni boshqarishning qaysi bosqichi yetarlicha amalga oshirilmagan?", "o": ["Metodik yordam va nazorat bosqichi", "Qo‘llab-quvvatlash va o‘qitish bosqichi", "Texnik ko‘mak va tahlil bosqichi", "Amaliy kuzatuv va tuzatish bosqichi"], "a": 1}, {"n": 85, "q": "Direktor o‘quvchining o‘zlashtirishdagi qiyinchiligini faqat «bola sust» degan fikr bilan izohlash o‘rniga dars metodikasi, sinf muhiti va ta’lim sharoitlarini ham tahlil qilishni topshirdi.\nBu yondashuv inklyuziv ta’limning qaysi jihatini aks ettiradi?", "o": ["Ta’limdagi cheklovlar talqinining o‘zgarishi", "Ta’limdagi qiyinchilik sababining o‘rganilishi", "Ta’limdagi muhit ta’sirining aniqlashtirilishi", "Ta’limdagi metodik omillarning baholanishi"], "a": 0}, {"n": 86, "q": "Til to‘sig‘i mavjud va ijtimoiy sharoiti murakkab bo‘lgan o‘quvchilar uchun maktab qo‘shimcha pedagogik yordam, moslashtirilgan topshiriqlar va tengdoshlar yordamini yo‘lga qo‘ydi.\nUshbu choralar eng avvalo nimaga xizmat qiladi?", "o": ["Ta’limdan ajralish xavfini kamaytirishga", "Ta’limda uzilish holatini cheklashga", "Ta’limdan chetlashishning oldini olishga", "Ta’limda ishtirok davomiyligini saqlashga"], "a": 2}, {"n": 87, "q": "Bir maktab barcha o‘quvchilarga bir xil topshiriq va bir xil baholash mezonini qo‘llash o‘rniga, ularning individual ehtiyojlari va rivojlanish sur’atlari hisobga olingan holda moslashtirilgan baholash tizimini joriy etdi.\nBu inklyuziv ta’limning qaysi tamoyiliga mos keladi?", "o": ["Ta’limdagi adolat va individuallikka", "Ta’limdagi adolat va ehtiyojlilikka", "Ta’limdagi adolat va moslashtirishga", "Ta’limdagi adolat va moslashuvchanlikka"], "a": 3}, {"n": 88, "q": "Maktabda turli ijtimoiy sharoit, xulq-atvor va emotsional holatga ega o‘quvchilar birgalikda ta’lim olmoqda. O‘quvchilar va ota-onalarda «farqlilik — tabiiy holat» degan qarash shakllanmoqda.\nUshbu holat inklyuziv ta’limning qaysi ijtimoiy ta’sirini eng to‘g‘ri ifodalaydi?", "o": ["Insonparvarlik qarashining rivojlanishi", "Insonparvarlik muhitining mustahkamlanishi", "Insonparvar tafakkurning shakllanishi", "Insonparvarlik munosabatining qaror topishi"], "a": 2}, {"n": 89, "q": "Maktabda «har bir o‘quvchi hurmatga loyiq, xatolar jazolash uchun emas, o‘rganish uchun» degan tamoyillar asosida ishonchli muhit yaratildi.\nUshbu holat inklyuziv ta’limning qaysi ijtimoiy ta’sir yo‘nalishini ifodalaydi?", "o": ["Inklyuziv muhitning mustahkamlanishi", "Inklyuziv madaniyatning qaror topishi", "Inklyuziv yondashuvning rivojlanishi", "Inklyuziv munosabatning shakllanishi"], "a": 1}, {"n": 90, "q": "Inklyuziv ta’limning ijtimoiy ta’sir yo‘nalishlarini ularning mazmuni bilan moslashtiring.\n1) Ijtimoiy tafakkur barqarorligi\n2) Insonparvar tafakkurning shakllanishi\n3) Inklyuziv madaniyatni qaror toptirish\nA) Farqlilikni tabiiy va ijobiy hodisa sifatida qabul qilish\nB) Ishonch, xavfsizlik va o‘zaro hurmatga asoslangan muhitni rivojlantirish\nC) Farqlilikni inkor etuvchi radikal qarashlarga nisbatan ijtimoiy immunitetni shakllantirish\nD) Ta’limdagi ehtiyojlarni individual yondashuv asosida moslashtirish", "o": ["1–C, 2–D, 3–B", "1–C, 2–A, 3–B", "1–A, 2–C, 3–B", "1–C, 2–A, 3–D"], "a": 1}];const L="ABCD";let i=0,score=0,done=false;

function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;

document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
