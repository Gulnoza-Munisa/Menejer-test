<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tahlillar 1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--tg-theme-bg-color,#f4f5f7);color:var(--tg-theme-text-color,#1c1c1e)}
.w{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.bar{height:6px;background:#dde1e6;border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:#2b7de9;width:0}
.top{display:flex;justify-content:space-between;font-size:14px;opacity:.75;margin-bottom:8px}
.card{background:var(--tg-theme-secondary-bg-color,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.q{white-space:pre-line;font-size:16px;line-height:1.45;margin-bottom:14px}
.o{display:flex;gap:10px;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid #d0d5db;border-radius:10px;background:transparent;color:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.o b{flex:0 0 26px;height:26px;border-radius:50%;background:#1c1c1e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.o.ok{border-color:#1f9d55;background:#e6f6ec;color:#1c1c1e}.o.ok b{background:#1f9d55}
.o.no{border-color:#d64545;background:#fdeaea;color:#1c1c1e}.o.no b{background:#d64545}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--tg-theme-button-color,#2b7de9);color:var(--tg-theme-button-text-color,#fff);font-size:16px;margin-top:12px;cursor:pointer}
.btn:disabled{opacity:.4}
.res{text-align:center}.res .big{font-size:44px;font-weight:700;margin:10px 0}
</style></head><body><div class="w">
<h1>Tahlillar 1</h1>
<div class="bar"><i id="bar"></i></div>
<div id="app"></div></div>
<script>
const Q=[{"n": 1, "q": "Maktab boshqaruvining asosiy tamoyillarini ularning ta’riflari va mezonlari bilan moslashtiring.\n1) Demokratiklik tamoyili\n2) Adolatlilik tamoyili\n3) Ilmiylik tamoyili\nA) Rag‘batlantirishda shaxsiy munosabatni chetga surib, hamma uchun teng, shaffof va ochiq mezonlarni (KPI) asos qilish\nB) Har qanday inqirozli vaziyatda faqat ma’muriy buyruqbozlik va qat’iy rejalashtirishga tayanish\nC) Subyektiv yondashuvdan voz kechib, jarayonlarni diagnostika, tahlil va qonuniyatlarga tayanib boshqarish\nD) Jamoani boshqaruvga faol jalb etish, qarorlarni kengash va ochiq muhokamada qabul qilish", "o": ["1–D, 2–C, 3–A", "1–A, 2–D, 3–C", "1–B, 2–A, 3–D", "1–D, 2–A, 3–C"], "a": 3}, {"n": 2, "q": "Direktor TALIS tavsiyalari va milliy islohotlar bilan uyg‘un holda maktab boshqaruvini transformatsiyalash rejasini ishlab chiqmoqda.\nQaysi variant boshqaruvda eng maqbul strategik yo‘nalishlarni ifodalaydi?", "o": ["Kadrlar zaxirasini yaratish, avtonomiya va hisobdorlikni muvozanatlash, jamoatchilik ishtirokini kengaytirish, pedagogik yetakchilikni ustuvor qilish, xalqaro tajribalarni moslashtirish", "Kadrlar zaxirasini yaratish, avtonomiyani kengaytirish, jamoatchilik ishtirokini kuchaytirish, ma’muriy nazoratni ustuvor qilish, xalqaro tajribalarni joriy etish", "Pedagogik yetakchilikni kuchaytirish, hisobdorlikni nazorat bilan almashtirish, jamoatchilik ishtirokini rivojlantirish, kadrlar salohiyatini oshirish, xorijiy tajribalarni o‘rganish", "Kadrlar zaxirasini rivojlantirish, avtonomiya va hisobdorlikni muvofiqlashtirish, demokratik boshqaruvni qo‘llash, pedagogik yetakchilikni kuchaytirish, tajribalarni milliy sharoitga tatbiq etish"], "a": 0}, {"n": 3, "q": "Direktor o‘qituvchilarning kasbiy ehtiyojlarini aniqlash va maktab muhitini xalqaro standartlar darajasida tahlil qilish uchun TALIS metodologiyasidan foydalanishga qaror qildi.\nBu tadqiqotda olinadigan ma’lumotlarning ishonchliligi qanday ta’minlanadi?", "o": ["Yuqori turuvchi tashkilotlar bergan rasmiy hisobotlarni qiyosiy tahlil qilish orqali", "O‘qituvchilar va direktorlarning kasbiy faoliyati yuzasidan anonim so‘rovnomalar orqali", "Rahbarlar va pedagoglarning dars jarayonlarini ekspertlar bevosita kuzatishi orqali", "O‘quvchilar o‘rtasida o‘qitish sifati bo‘yicha test sinovlari orqali"], "a": 1}, {"n": 4, "q": "Akkreditatsiyaning asosiy mazmuni nimadan iborat?", "o": ["Faoliyatning davlat ta’lim standartlari va talablariga mosligini baholash hamda rivojlantirish yo‘nalishlarini belgilashdan", "Faoliyatning davlat ta’lim standartlari va talablariga mosligini e’tirof etish hamda davlat hujjati berish huquqini tan olishdan", "Faoliyatning davlat ta’lim talablariga mosligini aniqlash va sifat ko‘rsatkichlarini mezonlar asosida mustahkamlashdan", "Faoliyatning standartlarga mos yuritilishini aniqlash va attestatsiya asosida umumiy baho berishdan"], "a": 1}, {"n": 5, "q": "47-maktab direktori o‘quv yili boshida dars kuzatish rejasini tasdiqladi. Birinchi chorakda direktor va o‘rinbosarlar 60 dan ortiq darsga kirdi, har bir kuzatuv bo‘yicha bayonnoma to‘ldirilib, papkaga tikib qo‘yildi. Chorak yakunida o‘quvchilar bilimi diagnostika qilinib, natijalar jadvalga kiritildi va tumanga hisobot sifatida yuborildi. Biroq o‘qituvchilar o‘z darsi qanday baholanganini va nimani yaxshilash kerakligini bilmay qoldi: kuzatuvdan keyin ular bilan hech kim suhbatlashmadi, tavsiya ham, metodik yordam ham berilmadi. Ikkinchi chorakda darslarda o‘sha kamchiliklar takrorlandi, diagnostika natijalari deyarli o‘zgarmadi. Ayrim o‘qituvchilar esa «darsga kirish — xato qidirish uchun» deb xavotirlana boshladi.\nDirektor faoliyatida qaysi boshqaruv tamoyili to‘liq amalga oshmagan?", "o": ["Rejalilik tamoyili", "Rag‘batlantirish va motivatsiya tamoyili", "Demokratiklik va jamoaviy boshqaruv tamoyili", "Nazorat va teskari aloqa tamoyili"], "a": 3}, {"n": 6, "q": "Direktor choraklik metodik ishlar reja-tadbirlarini tuzdi, lekin ular maktab strategiyasi, ta’lim sifati, intizom va natijadorlik bilan uyg‘unlashmagan.\nBu holatda qaysi boshqaruv tamoyili buzilgan?", "o": ["Rejalilik", "Demokratiklik", "Maqsadlilik", "Nazorat va teskari aloqa"], "a": 2}, {"n": 7, "q": "Maktabni loyiha asosida boshqarish bosqichlarining to‘g‘ri ketma-ketligini belgilang.\n1) Resurs, muddat va mas’ullarni belgilash (reja tuzish)\n2) KPIlar asosida natijani baholash (monitoring)\n3) Strategik maqsadga mosligini aniqlash\n4) Loyihani maktab tizimiga integratsiya qilish\n5) Loyihani bosqichma-bosqich amalga oshirish (joriy etish)", "o": ["1 → 2 → 3 → 5 → 4", "3 → 1 → 5 → 2 → 4", "3 → 2 → 1 → 5 → 4", "1 → 3 → 5 → 2 → 4"], "a": 1}, {"n": 8, "q": "O‘zgarishga qarshilik qilayotgan xodimni «muammo» emas, signal deb ko‘rish direktor uchun nimani anglatadi?", "o": ["Qarshilikni xodimning shaxsiy munosabati bilan bog‘lab, individual tushuntirish ishlarini kuchaytirishni", "Qarshilikni jamoa ichidagi moslashuv jarayoni sifatida ko‘rib, umumiy muloqotni faollashtirishni", "Qarshilik ortida tizim darajasidagi muammo borligini ko‘rib, sabablarni chuqur tahlil qilishni", "Qarshilikni tabiiy holat deb baholab, bosqichma-bosqich moslashtirishni"], "a": 2}, {"n": 9, "q": "Strategik rejalashtirish tushunchalarini mazmuni, vaqt yo‘nalishi va mezonlari bilan moslashtiring.\n1) Missiya\n2) Vizyon\n3) Strategik maqsad\nA) Kelajakdagi ideal holat, 5–10 yillik muddat, jamoani ilhomlantiruvchi keng va tasviriy\nB) Strategik maqsadlarni amalga oshirish mexanizmi, qisqa muddatli, yillik yo‘l xaritalariga asos\nC) Vizyonga erishish uchun 3–5 yilda bajariladigan, aniq va o‘lchanadigan (KPI) natijalar\nD) Bugungi va doimiy faoliyat, «Biz nega mavjudmiz?» savoliga qisqa javob", "o": ["1–A, 2–B, 3–C", "1–D, 2–C, 3–A", "1–D, 2–A, 3–C", "1–C, 2–A, 3–D"], "a": 2}, {"n": 10, "q": "Ustuvorlikni tanlash mezonlarini ularning amaliy talablari bilan moslashtiring.\n1) Real sharoitda bajarilishi\n2) Eng katta ta’sir berishi\n3) Vaqt bilan bog‘langanligi\nA) Hamma yo‘nalishda kuchli bo‘la olmagani uchun sifatga eng katta ta’sir beradigan 3–5 vazifa bilan cheklanish\nB) Tanlangan maqsadlar uzoq cho‘zilmay, aynan 5 yil ichida aniq natija berishi\nC) Maqsad 3–5 yil yoki aniq kalendar yillari (2026–2030) bilan chegaralangan bo‘lishi\nD) Maqsad maktabning real resurslari, kadrlari, moliyaviy va moddiy-texnik imkoniyatlari doirasida bajarilishi", "o": ["1–D, 2–A, 3–C", "1–D, 2–B, 3–C", "1–A, 2–B, 3–D", "1–C, 2–B, 3–A"], "a": 1}];const L="ABCD";let i=0,score=0,done=false;
try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const app=document.getElementById('app'),bar=document.getElementById('bar');
function show(){done=false;bar.style.width=(i/Q.length*100)+'%';const q=Q[i];
app.innerHTML='<div class="top"><span>'+q.n+'-savol · '+(i+1)+' / '+Q.length+'</span><span>To‘g‘ri: '+score+'</span></div><div class="card"><div class="q"></div>'+
q.o.map((t,k)=>'<button class="o" data-k="'+k+'"><b>'+L[k]+'</b><span></span></button>').join('')+
'<button class="btn" id="nx" disabled>'+(i<Q.length-1?'Keyingi savol':'Natijani ko‘rish')+'</button></div>';
app.querySelector('.q').textContent=q.q;
app.querySelectorAll('.o').forEach(b=>{b.querySelector('span').textContent=q.o[+b.dataset.k];b.onclick=()=>pick(b)});
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():result()};window.scrollTo(0,0)}
function pick(b){if(done)return;done=true;const k=+b.dataset.k,a=Q[i].a;
app.querySelectorAll('.o')[a].classList.add('ok');if(k===a)score++;else b.classList.add('no');
try{Telegram.WebApp.HapticFeedback.notificationOccurred(k===a?'success':'error')}catch(e){}
document.getElementById('nx').disabled=false}
function result(){bar.style.width='100%';const p=Math.round(score/Q.length*100);
app.innerHTML='<div class="card res"><div>Natijangiz</div><div class="big">'+score+' / '+Q.length+'</div><div>'+p+'%</div><button class="btn" id="re">Qayta topshirish</button></div>';
document.getElementById('re').onclick=()=>{i=0;score=0;show()}}
show();
</script></body></html>
